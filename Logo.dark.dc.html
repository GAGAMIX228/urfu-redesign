<h1 class="big" style="font-size:52px">Логотип и фирменный стиль</h1>
<p class="muted" style="margin-top:12px;font-size:19px;max-width:760px">Знак сохраняет узнаваемую форму «У» УрФУ. Меняется только цвет: вместо розово-жёлтого перехода — уральские самоцветы.</p>
</div></section>

<h3>Знак</h3>
<p class="muted" style="margin-top:10px">Форма — фирменная «У»: засечка сверху, широкая диагональ и хвост, уходящий влево. Цвет перетекает сверху вниз: аметист → сапфир → малахит. На тёмном фоне используются более светлые оттенки тех же камней.</p>

<div class="sec-head"><div><div class="kicker">Палитра</div><h2>Основа и самоцветы</h2></div></div>
<p class="muted" style="max-width:760px">Основа отвечает за строгость и читаемость, самоцветы — за разнообразие разделов. Для каждого цвета указан контраст белого текста на нём: норма WCAG AA — от 4,5.</p>

<div class="g3">
<div class="card"><h3>Полоса самоцветов</h3><p class="muted" style="margin-top:8px">Четыре цвета подряд — подпись стиля под шапкой страницы и над подвалом.</p><div style="height:6px;margin-top:20px;border-radius:3px;background:linear-gradient(90deg,var(--a1) 0 25%,var(--a2) 25% 50%,var(--a3) 50% 75%,var(--a4) 75%)"></div></div>
<div class="card"><h3>Фотографии</h3><p class="muted" style="margin-top:8px">Настоящие снимки кампуса. Сверху и снизу — лёгкое затемнение, чтобы подписи читались; у каждого фото указан автор.</p><div class="ph art t2 photo" style="--img:url('photos/kampus-leto.webp');height:150px;margin-top:16px;position:relative;overflow:hidden"><span class="lbl">Фото: В. Бухаров, CC BY-SA 4.0</span></div></div>
