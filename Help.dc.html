<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const FAQ = [["adm", "Когда начинается приём документов?", "С 20 июня. На бюджет по результатам ЕГЭ документы принимают до 25 июля, с экзаменами УрФУ — до 15 июля. Это даты приёма-2026; правила следующего года УрФУ публикует зимой.", "Admission.dc.html#calendar", "Весь календарь приёма", "cal"], ["adm", "Как подать документы, не приезжая в Екатеринбург?", "Через Госуслуги (сервис «Поступление в вуз онлайн») или в личном кабинете абитуриента на сайте приёмной комиссии. Лично — ул. Мира, 19, аудитория ГУК-100.", "Admission.dc.html#apply", "Способы подачи", "cont"], ["adm", "Хватит ли моих баллов на бюджет?", "Сравните сумму с проходными баллами прошлых лет: на главной есть ползунок баллов, а в каталоге — фильтр по сумме и ЕГЭ. У каждой программы — баллы за несколько лет.", "Catalog.dc.html", "Каталог программ", ""], ["adm", "Дают ли дополнительные баллы за службу в армии?", "Да, 10 баллов за индивидуальное достижение — всем, кто прошёл службу в Вооружённых силах России. Подтверждается копией двух первых разворотов военного билета.", "", "", "hot"], ["adm", "Когда день открытых дверей?", "Обычно в январе. Перед приёмом-2026 приёмная комиссия называла ориентировочно 17–18 января — точную дату объявляют на сайте.", "Events.dc.html", "Календарь событий", "hot"], ["adm", "Когда подавать согласие на зачисление?", "До 14:00 в день этапа: 1 августа — квоты и олимпиадники, 5 августа — основной этап, 9 августа — дополнительный. Без согласия на бюджет не зачисляют.", "Admission.dc.html#lists", "Как работают списки", "cal"], ["adm", "Сколько стоит платное обучение?", "Зависит от программы: в нашем каталоге — от 246 000 до 390 000 ₽ в год. Есть скидки отдельным категориям и образовательный кредит с господдержкой под 3% годовых.", "Admission.dc.html#cost", "Посчитать стоимость", ""], ["dorm", "Как получить место в общежитии?", "Отметьте потребность в общежитии при подаче документов. Первокурсников в 2025 году заселяли в три этапа: 25–29 августа, в сентябре и в октябре — на освободившиеся места. Графики и списки готовят жилищные комиссии институтов.", "Dorms.dc.html", "Кампус и общежития", "pos"], ["dorm", "Сколько стоит общежитие?", "В студгородке — от 1 340 до 2 110 ₽ в месяц вдвоём в комнате, вместе с коммунальными. В кампусе Новокольцовский — около 2 380 ₽. Летом без отопления дешевле.", "Dorms.dc.html#price-h", "Таблица цен", ""], ["dorm", "Какой медосмотр нужен для заселения?", "В медсанчасти УрФУ на Комсомольской, 59 или в медцентре кампуса Новокольцовский. С собой: паспорт, СНИЛС, полис ОМС, прививочный сертификат и флюорография не старше 11 месяцев. Осмотр в 2025 году стоил 210 ₽, флюорография — 234 ₽.", "", "", "pos"], ["dorm", "Что делать, если места в общежитии не хватило?", "Университет помогает со съёмным жильём — проект «Платное жильё». Вопросы о местах решает жилищная комиссия вашего института.", "Dorms.dc.html", "Кампус и общежития", "pos"], ["study", "Где посмотреть расписание своей группы?", "На странице «Расписание»: выберите буквы группы и введите 6 цифр. Сайт запомнит группу, и в следующий раз пары откроются сразу.", "Schedule.dc.html", "Открыть расписание", ""], ["study", "Куда жаловаться, если нарушают права студента?", "Горячая линия Минобрнауки по правовой и социальной защите студентов: 8-800-222-55-71, добавочный 1. Учёба и аттестация, перевод, стипендии, общежитие, документы об образовании.", "", "", "line"], ["health", "Где медпункт и поликлиника?", "Медсанчасть УрФУ — ул. Комсомольская, 59, пн–пт 8:00–18:00. В кампусе Новокольцовский — медцентр на ул. 100-летия Университета, стр. 10, пн–пт 8:30–17:00.", "Contacts.dc.html", "На карте", "pos"], ["health", "Мне тяжело, нужна психологическая помощь", "Горячая линия психологической помощи студентам: 8-800-222-55-71, добавочный 2. Тревога, напряжение в учёбе, трудности в отношениях. Звонок бесплатный.", "", "", "line"], ["money", "Кто поможет со стипендией и выплатами?", "Начисления ведёт ваш институт. Если выплату задерживают или отказывают без причины — горячая линия Минобрнауки 8-800-222-55-71, добавочный 1.", "", "", "line"], ["money", "Как оплатить общежитие или медосмотр?", "Через сервис электронных платежей УрФУ pay.urfu.ru, Систему быстрых платежей по QR-коду или в кассе медсанчасти.", "", "", "pos"], ["it", "Не работает Wi-Fi, почта или доступ к сервисам", "Техподдержка УрФУ: +7 (343) 227-20-70, support@urfu.ru.", "", "", "cont"]], DIR = [["Контакт-центр", "Любые вопросы об университете", "8-800-100-50-44", "88001005044", "contact@urfu.ru", "Бесплатно по России. Пн–пт 8:30–19:00, сб 10:00–16:00", "общий вопрос справка"], ["Приёмная комиссия", "Поступление, документы, списки", "+7 (343) 375-44-74", "+73433754474", "priem@urfu.ru", "ул. Мира, 19, ГУК-100", "поступление абитуриент"], ["Техподдержка", "Wi-Fi, почта, личный кабинет", "+7 (343) 227-20-70", "+73432272070", "support@urfu.ru", "", "it интернет пароль"], ["Медсанчасть УрФУ", "Медосмотр, справки, лечение", "", "", "", "ул. Комсомольская, 59. Пн–пт 8:00–18:00", "врач здоровье медосмотр"], ["Пресс-служба", "Для журналистов", "+7 (343) 375-97-33", "+73433759733", "news@urfu.ru", "", "сми журналист"], ["Реклама и партнёрство", "Реклама в университете", "+7 (343) 375-93-53", "+73433759353", "partner@urfu.ru", "", "партнёр бизнес"]], TOP = [["all", "Все"], ["adm", "Поступление"], ["dorm", "Общежитие"], ["study", "Учёба"], ["health", "Здоровье"], ["money", "Деньги"], ["it", "Wi-Fi и почта"]], SRC = {"cal": "https://web.archive.org/web/20260831155039/https://urfu.ru/ru/applicant/docs-abiturient/kalendar-priema/", "hot": "https://web.archive.org/web/20251114010920/https://urfu.ru/ru/feedback/priem/obshchie-voprosy-po-priemu/", "pos": "https://web.archive.org/web/20251114102246/https://urfu.ru/ru/students/social/campus/", "cont": "https://web.archive.org/web/20251114044926/https://urfu.ru/ru/contacts/", "line": "https://web.archive.org/web/20251114063908/https://urfu.ru/ru/students/social/gorjachaja-linija-dlja-studentov/"};
const st = this.state || {};
let q0 = st.q; if (q0 === undefined) { q0 = new URLSearchParams(location.search).get('q') || ''; }
const t = st.t || 'all';
// живые слова → слова из ответов
const SYN = { 'общаг': 'общежит', 'стипух': 'стипенд', 'вайфай': 'wi-fi', 'вай-фай': 'wi-fi', 'инет': 'wi-fi', 'врач': 'мед', 'больниц': 'мед', 'деньг': 'оплат', 'армия': 'армии' };
let q = q0.toLowerCase().trim(); Object.keys(SYN).forEach(k => { q = q.split(k).join(SYN[k]); });
const words = q.split(/\s+/).filter(w => w.length > 1).map(w => w.slice(0, Math.max(4, w.length - 2)));
const hit = s => words.every(w => s.toLowerCase().indexOf(w) !== -1);
const TN = {}; TOP.forEach(([k, n]) => TN[k] = n);
const faq = FAQ.filter(f => (t === 'all' || f[0] === t) && hit(f[1] + ' ' + f[2] + ' ' + TN[f[0]]))
  .map(f => ({ tn: TN[f[0]], q: f[1], a: f[2], href: f[3], lt: f[4], src: f[5] ? SRC[f[5]] : '' }));
const dir = DIR.filter(d => hit(d.join(' '))).map(d => ({ n: d[0], w: d[1], p: d[2], tel: d[3], m: d[4], h: d[5] }));
const n = faq.length;
const form = n % 10 === 1 && n % 100 !== 11 ? 'ответ' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'ответа' : 'ответов';
return {
  q: q0, hasQ: !!q0,
  setQ: e => this.setState({ q: e.target.value }),
  clear: () => this.setState({ q: '', t: 'all' }),
  topics: TOP.map(([k, nm]) => ({ n: nm, on: String(k === t), pick: () => this.setState({ t: k }) })),
  faq, none: n === 0, dir, dirNone: dir.length === 0,
  countText: (q0 || t !== 'all') ? (n ? 'Нашлось ' + n + ' ' + form : 'Ничего не нашлось') : n + ' ' + form + ' на частые вопросы'
};
}
}
