<h1 class="big" style="font-size:48px">Кампус и общежития</h1>
<p class="muted" style="margin-top:12px;font-size:19px;max-width:720px">Где учиться, где жить и как получить место — на одной странице.</p>
</div></section><div class="wrap">
<section class="cmp" aria-labelledby="cmp-h">
<h2 id="cmp-h" style="margin-top:56px">Два кампуса</h2>
<div class="cmp-g">
<article class="cmp-c cmp-a">
<div class="cmp-ph" role="img" aria-label="Студгородок и главный учебный корпус сверху" style="background-image:url('photos/kampus-sverhu.webp')"></div>
<div class="cmp-b"><span class="tag">Исторический кампус</span><h3>Втузгородок</h3>
<p>Главный учебный корпус на улице Мира, 19 и большинство институтов. Рядом — студенческий городок.</p>
<ul class="cmp-n"><li><b>14</b>общежитий в студгородке</li><li><b>1920</b>год основания университета</li></ul>
<a class="btn2" href="https://yandex.ru/maps/?text=%D0%95%D0%BA%D0%B0%D1%82%D0%B5%D1%80%D0%B8%D0%BD%D0%B1%D1%83%D1%80%D0%B3%2C%20%D1%83%D0%BB.%20%D0%9C%D0%B8%D1%80%D0%B0%2C%2019" target="_blank" rel="noopener">Главный корпус на карте<span class="sr"> (откроется в новой вкладке)</span></a></div>
</article>
<article class="cmp-c cmp-b2">
<div class="cmp-big"><span>Новокольцовский</span><b>2026</b><span>открытие</span></div>
<div class="cmp-b"><span class="tag">Новый кампус</span><h3>Новый кампус в Новокольцовском</h3>
<p>Сюда в 2026 году переезжают Институт радиоэлектроники и IT (ИРИТ-РтФ) и Институт экономики и управления. Рядом — 4 общежития на улице 100-летия Уральского университета.</p>
<ul class="cmp-n"><li><b>40&nbsp;300&nbsp;м²</b>учебный комплекс ИРИТ-РтФ</li><li><b>85</b>аудиторий и компьютерных классов</li><li><b>23</b>коворкинга</li><li><b>3&nbsp;000+&nbsp;м²</b>лабораторий</li></ul>
<a class="btn2" href="https://rtf.urfu.ru/about-institute/campus/" target="_blank" rel="noopener">О новом кампусе ИРИТ-РтФ<span class="sr"> (откроется в новой вкладке)</span></a></div>
</article>
</div>
<p class="muted" style="font-size:14px;margin-top:12px">Цифры — с сайтов ИРИТ-РтФ и кампуса УрФУ. Все 18 общежитий с адресами — на <a href="https://campus.urfu.ru/ru/studencheskii-gorodok/obshchezhitija/obshchezhitija/" target="_blank" rel="noopener">сайте кампуса УрФУ<span class="sr"> (откроется в новой вкладке)</span></a>.</p>
</section>
<h2 style="margin-top:64px">Общежития в цифрах</h2>
<div class="g3" style="margin-top:24px">
<div class="card" style="background:var(--blue-soft);border-color:var(--blue-soft)"><div style="font-family:var(--narrow);font-weight:700;font-size:28px;color:var(--blue)">18</div><div>общежитий: 14 в студгородке и 4 в новом кампусе</div></div>
<div class="card" style="background:var(--blue-soft);border-color:var(--blue-soft)"><div style="font-family:var(--narrow);font-weight:700;font-size:28px;color:var(--blue)">от 1 000 ₽</div><div>в месяц за место</div></div>
<div class="card" style="background:var(--blue-soft);border-color:var(--blue-soft)"><div style="font-family:var(--narrow);font-weight:700;font-size:28px;color:var(--blue)">100%</div><div>иногородних первокурсников, заявивших потребность, получают место</div></div>
</div>
<h2 style="margin-top:64px">Как получить место</h2>
<div class="g4" style="margin-top:24px">
<div class="card"><div style="font-family:var(--narrow);font-weight:700;font-size:24px;color:var(--copper)">1</div><div style="font-weight:600;margin-top:8px">Отметьте при поступлении</div><p class="muted" style="font-size:15px;margin-top:6px">Галочка «нуждаюсь в общежитии» в заявлении.</p></div>
<div class="card"><div style="font-family:var(--narrow);font-weight:700;font-size:24px;color:var(--copper)">2</div><div style="font-weight:600;margin-top:8px">Дождитесь зачисления</div><p class="muted" style="font-size:15px;margin-top:6px">Списки на заселение публикуются в личном кабинете.</p></div>
<div class="card"><div style="font-family:var(--narrow);font-weight:700;font-size:24px;color:var(--copper)">3</div><div style="font-weight:600;margin-top:8px">Пройдите медосмотр</div><p class="muted" style="font-size:15px;margin-top:6px">В медсанчасти УрФУ на Комсомольской, 59. С собой: паспорт, полис, СНИЛС, сертификат прививок и флюорография не старше 11 месяцев.</p></div>
<div class="card"><div style="font-family:var(--narrow);font-weight:700;font-size:24px;color:var(--copper)">4</div><div style="font-weight:600;margin-top:8px">Заселяйтесь</div><p class="muted" style="font-size:15px;margin-top:6px">Договор и ключи в день заселения.</p></div>
</div>
<h2 style="margin-top:64px">Выберите общежитие</h2>
<div class="g3" style="margin-top:24px">
<div class="card" style="padding:0;overflow:hidden"><div class="ph art t1 photo" style="--img:url('photos/obshchezhitie-9.webp');height:200px;border-radius:0;position:relative;overflow:hidden"></div><div style="padding:20px"><div style="font-family:var(--narrow);font-weight:700;font-size:19px">Общежитие № 9</div><div class="muted" style="font-size:15px;margin-top:6px">ул. Фонвизина, 8</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px"><span class="tag">16 этажей, построено в 2023</span><span class="tag">Кухня в каждом блоке</span></div><div style="display:flex;justify-content:space-between;margin-top:16px;align-items:center"><span class="muted" style="font-size:14px">Цена — в договоре найма</span><a href="Contacts.dc.html">На карте</a></div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div class="ph art t2 photo" style="--img:url('photos/obshchezhitie-5.webp');height:200px;border-radius:0;position:relative;overflow:hidden"></div><div style="padding:20px"><div style="font-family:var(--narrow);font-weight:700;font-size:19px">Общежитие № 5</div><div class="muted" style="font-size:15px;margin-top:6px">ул. Малышева, 144</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px"><span class="tag">Блочного типа, комнаты на 2–3 человека</span><span class="tag">Для иностранных студентов</span></div><div style="display:flex;justify-content:space-between;margin-top:16px;align-items:center"><span class="muted" style="font-size:14px">Цена — в договоре найма</span><a href="Contacts.dc.html">На карте</a></div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div class="ph art t3 photo" style="--img:url('photos/obshchezhitie-10.webp');height:200px;border-radius:0;position:relative;overflow:hidden"></div><div style="padding:20px"><div style="font-family:var(--narrow);font-weight:700;font-size:19px">Общежитие № 10</div><div class="muted" style="font-size:15px;margin-top:6px">пр. Ленина, 66</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px"><span class="tag">Коридорного типа, комнаты на 2–3 человека</span><span class="tag">ФТИ</span></div><div style="display:flex;justify-content:space-between;margin-top:16px;align-items:center"><span class="muted" style="font-size:14px">Цена — в договоре найма</span><a href="Contacts.dc.html">На карте</a></div></div></div>
</div>
<h2 style="margin-top:64px">Частые вопросы</h2>
<div style="margin-top:12px;max-width:860px">
<details><summary>Дают ли общежитие контрактникам?</summary><p class="muted" style="margin-top:12px">Да. Места дают иногородним студентам очной формы — и бюджетникам, и контрактникам. Решение принимает жилищная комиссия института.</p></details>
<details><summary>Что делать, если места не хватило?</summary><p class="muted" style="margin-top:12px">Профком помогает найти комнату или квартиру — проект «Платное жильё». Заявление можно оставить на Мира, 19, кабинет ГУК-309.</p></details>
<details><summary>Какие документы нужны при заселении?</summary><p class="muted" style="margin-top:12px">Паспорт, договор найма и ордер от комиссии — с ними оформляют регистрацию в паспортном отделе студгородка. После оплаты в общежитии выдают ключ и пропуск. Сниматься с регистрации по месту жительства не нужно.</p></details>
</div>
