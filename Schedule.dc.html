<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание — УрФУ</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<style>
/* макет телефона: по центру на компьютере, на весь экран на телефоне */
body{background:var(--bg-soft);padding:32px 16px;margin:0}
.phone{width:390px;max-width:100%;height:844px;margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(14,27,43,.25);outline:1px solid var(--line)}
.phone-top{background:radial-gradient(420px 260px at 90% 0%,var(--hero-1),transparent 70%),radial-gradient(360px 260px at 0% 100%,var(--hero-2),transparent 70%),var(--ink) !important}
@media (max-width:480px){body{padding:0}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;outline:0}}
</style>
</head>
<body>
<template id="dc-tpl">
<div class="phone" style="background:#F6F7F9;display:flex;flex-direction:column;font-family:'IBM Plex Sans',sans-serif;color:var(--ink)">
<div class="phone-top" style="color:#FFFFFF;padding:20px 20px 16px">
<div style="display:flex;justify-content:space-between;align-items:center"><a href="MainMobile.dc.html" aria-label="На главную" style="display:flex"><svg width="18" height="32" viewBox="0 0 35 62" aria-hidden="true"><defs><linearGradient id="gemS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A7AD6"></stop><stop offset=".5" stop-color="#5B8BDB"></stop><stop offset="1" stop-color="#3CCFA6"></stop></linearGradient></defs><path d="M1 2 H25 V4 H17 L33 35 C31 46 24 59 12 60 C10 60.2 8.8 59.3 9.4 58.1 C16 55.8 22.6 49 24.4 38.6 L6.2 4 H3.4 Z" fill="url(#gemS)"></path></svg></a><span style="font-size:14px;color:var(--on-dark-muted)">Группа [номер]</span></div>
<div style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:24px;margin-top:16px">Расписание</div>
<div style="display:flex;gap:6px;margin-top:16px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="6">
<sc-if value="{{d.on}}" hint-placeholder-val="{{false}}"><button onClick="{{d.pick}}" style="flex:1;min-height:56px;border-radius:6px;border:0;background:#FFFFFF;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px">{{d.w}}<span style="font-size:11px;font-weight:500">{{d.n}}</span></button></sc-if>
<sc-if value="{{d.off}}" hint-placeholder-val="{{true}}"><button onClick="{{d.pick}}" style="flex:1;min-height:56px;border-radius:6px;border:0;background:var(--ink-2);color:#FFFFFF;font:inherit;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px">{{d.w}}<span style="font-size:11px;font-weight:500;color:var(--on-dark-muted)">{{d.n}}</span></button></sc-if>
</sc-for>
</div>
</div>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{pairs}}" as="p" hint-placeholder-count="4">
<div style="background:#FFFFFF;border-radius:8px;padding:14px 16px;display:flex;gap:14px;border:1px solid var(--line)">
<div style="min-width:52px"><div style="font-weight:600">{{p.from}}</div><div style="font-size:13px;color:var(--muted)">{{p.to}}</div></div>
<div style="flex:1"><div style="font-weight:600">{{p.t}}</div><div style="font-size:13px;color:var(--muted);margin-top:2px">{{p.kind}} · ауд. [номер]</div><div style="font-size:13px;color:var(--muted)">[Преподаватель]</div></div>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="text-align:center;padding:48px 16px;color:var(--muted)">Пар нет — хороший день, чтобы заглянуть в <a href="Events.dc.html">календарь событий</a>.</div></sc-if>
</div>
<nav aria-label="Нижнее меню" style="display:flex;background:#FFFFFF;border-top:1px solid var(--line);padding:6px 4px 10px">
<a href="MainMobile.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg>Главная</a>
<a href="Search.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Поиск</a>
<a href="Schedule.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--blue);font-weight:600;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Расписание</a>
<a href="Contacts.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Сервисы</a>
<a href="Institute.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Меню</a>
</nav>
</div>

</template>
<div id="dc-root"></div>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const d = (this.state && this.state.d) || 0;
const days = [['Пн','[дд]'],['Вт','[дд]'],['Ср','[дд]'],['Чт','[дд]'],['Пт','[дд]'],['Сб','[дд]']];
const T = [['08:30','10:00'],['10:15','11:45'],['12:00','13:30'],['14:15','15:45'],['16:00','17:30']];
const plan = [
[[0,'Математический анализ','Лекция'],[1,'Программирование','Практика'],[2,'Английский язык','Практика']],
[[1,'Физика','Лекция'],[2,'Алгоритмы и структуры данных','Лабораторная'],[3,'Физическая культура','Практика']],
[[0,'Основы российской государственности','Семинар'],[1,'Математический анализ','Практика']],
[[0,'Программирование','Лекция'],[1,'Программирование','Лабораторная'],[2,'Физика','Практика'],[3,'История России','Лекция']],
[[1,'Алгебра и геометрия','Лекция'],[2,'Алгебра и геометрия','Практика']],
[]
];
const pairs = plan[d].map(([i, t, kind]) => ({ from: T[i][0], to: T[i][1], t, kind }));
return {
days: days.map(([w, n], k) => ({ w, n, on: k === d, off: k !== d, pick: () => this.setState({ d: k }) })),
pairs,
empty: pairs.length === 0
};
}
}

</script>
<script src="dc-lite.js"></script>
<script src="site.js"></script>
</body>
</html>
