/* макет телефона: по центру на компьютере, на весь экран на телефоне */
body{background:var(--bg-soft);padding:32px 16px;margin:0}
.phone{width:390px;max-width:100%;height:844px;margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(14,27,43,.25);outline:1px solid var(--line)}
.phone-top{background:radial-gradient(420px 260px at 90% 0%,var(--hero-1),transparent 70%),radial-gradient(360px 260px at 0% 100%,var(--hero-2),transparent 70%),var(--ink) !important}
@media (max-width:480px){body{padding:0}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;outline:0}}
/* компьютер: обычная страница сайта с неделей по столбцам; телефон: экран приложения */
.desk{display:none}
@media (min-width:900px){
body{padding:0;background:var(--bg)}
.phone{display:none !important}
.desk{display:block}
}
.sg-form{margin-top:24px;max-width:560px}
.sg-form label{display:block;color:#FFFFFF;font-weight:600;margin-bottom:8px}
.sg-row{display:flex;gap:8px}
.sg-field{flex:1;min-width:0;display:flex;align-items:center;min-height:48px;border-radius:12px;border:2px solid transparent;background:#FFFFFF;color:var(--ink);overflow:hidden}
.sg-field:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.sg-field.bad{border-color:#FF8FB4}
.sg-field select,.sg-field input{border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);min-height:44px;outline:0}
.sg-p{padding:0 2px 0 12px;font-weight:600;cursor:pointer;width:auto}
.sg-po{width:4.6em;padding:0 4px 0 14px;font-weight:600;text-transform:uppercase}
.sg-dash{font-weight:600;padding:0 2px}
.sg-n{flex:1;min-width:0;padding:0 14px 0 4px;letter-spacing:.04em}
.sg-row .btn{min-height:48px;white-space:nowrap}
.sg-hint{color:var(--on-dark-muted);font-size:14px;margin-top:8px}
.sg-err{color:#FFD0E0;font-size:15px;font-weight:600;margin-top:8px}
.sg-ph{margin-top:14px}
.sg-ph .sg-field{min-height:44px}
.sg-ph .sg-field select,.sg-ph .sg-field input{font-size:16px}
.sg-ph .sg-row .btn{min-height:44px}
.wk-view{display:inline-flex;border:2px solid var(--limestone);border-radius:14px;padding:3px;background:#FFFFFF}
.wk-view button{min-height:40px;padding:0 16px;border:0;border-radius:10px;background:transparent;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.wk-view button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.wk-view button:focus-visible,.dv-d:focus-visible{outline:3px solid var(--amethyst);outline-offset:2px}
.wk-share{min-height:48px}
.dv{margin-top:20px;max-width:820px}
.dv-days{display:flex;gap:8px;flex-wrap:wrap}
.dv-d{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:8px 10px;border:2px solid var(--limestone);border-radius:14px;background:#FFFFFF;font:inherit;color:var(--ink);cursor:pointer}
.dv-d span{font-size:14px;color:var(--muted)}
.dv-d[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.dv-d[aria-pressed="true"] span{color:#FFFFFF}
.dv-h{font-family:var(--narrow);font-size:30px;margin-top:24px}
.dv-free{margin-top:16px;padding:24px;border-radius:16px;background:var(--limestone);font-size:18px}
.dv-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.dv-p{display:flex;gap:20px;align-items:stretch;padding:18px 20px;border-radius:16px;background:#FFFFFF;border:1px solid var(--line);border-left:6px solid var(--c,var(--a3))}
.dv-p.k-lec{--c:var(--a3)}.dv-p.k-pr{--c:var(--a1)}.dv-p.k-lab{--c:var(--a2)}.dv-p.k-sem{--c:var(--a4)}
.dv-p.is-now{box-shadow:0 0 0 3px var(--c)}
.dv-tm{display:flex;flex-direction:column;min-width:64px}
.dv-tm b{font-family:var(--narrow);font-size:22px}
.dv-tm span{color:var(--muted);font-size:14px}
.dv-b{display:flex;flex-direction:column;gap:2px}
.dv-b b{font-size:18px}
.dv-b small{color:var(--muted);font-size:14px}
.dv-now,.dv-next{align-self:flex-start;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;margin-bottom:4px}
.dv-now{background:var(--ink);color:#FFFFFF}
.dv-next{background:var(--limestone);color:var(--ink)}
.dv-gap{margin-top:12px}
.wk-nav{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:32px}
.wk-btn{width:48px;height:48px;border-radius:14px;border:2px solid var(--limestone);background:#FFFFFF;color:var(--ink);font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.wk-btn:hover{border-color:var(--amethyst)}
.wk-btn:focus-visible,.wk-ph button:focus-visible{outline:3px solid var(--amethyst);outline-offset:2px}
.wk-now{display:flex;flex-direction:column;min-width:190px;padding:0 6px}
.wk-now b{font-family:var(--narrow);font-size:20px}
.wk-now span{font-size:14px;color:var(--muted)}
.wk-today{min-height:48px}
.wk-ics{min-height:48px;margin-left:auto}
.wk-nav + .week{margin-top:16px}
.wk-ph{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:14px;color:var(--on-dark-muted)}
.wk-ph button{width:44px;height:36px;border-radius:10px;border:0;background:var(--ink-2);color:#FFFFFF;font-size:20px;cursor:pointer}
@media (max-width:700px){.wk-ics{margin-left:0}}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:32px}
.wday{border:1px solid var(--line);border-radius:10px;background:#FFFFFF;display:flex;flex-direction:column;min-height:320px;overflow:hidden}
.wday-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;font-weight:600;background:var(--bg-soft)}
.wday-h span{font-weight:400;font-size:13px;color:var(--muted)}
.wday.today{border-color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.wday.today .wday-h{background:var(--blue-soft)}
.wday-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.wp{border-radius:8px;padding:10px 12px;background:var(--bg-soft);box-shadow:inset 3px 0 0 var(--c,var(--a1))}
.wp b{display:block;font-size:14px;line-height:1.35;margin-top:2px}
.wp small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.wp .tm{font-size:12px;font-weight:600;color:var(--muted)}
.wp.k-lec{--c:var(--a3)}.wp.k-pr{--c:var(--a1)}.wp.k-lab{--c:var(--a2)}.wp.k-sem{--c:var(--a4)}
.wfree{margin:auto;color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
.wlegend{display:flex;gap:20px;flex-wrap:wrap;margin-top:20px;font-size:14px;color:var(--muted)}
.wlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
@media (max-width:1180px){.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
// текущая учебная неделя: в воскресенье показываем следующую
const now = new Date(); const wd = (now.getDay() + 6) % 7;
const off = (this.state && this.state.w) || 0;
const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - wd + (wd === 6 ? 7 : 0) + off * 7);
const todayIdx = off === 0 ? (wd === 6 ? 0 : wd) : -1;
const dt = k => new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + k);
const dm = x => String(x.getDate()).padStart(2, '0') + '.' + String(x.getMonth() + 1).padStart(2, '0');
const d = (this.state && this.state.d !== undefined) ? this.state.d : Math.max(0, todayIdx);
// группа из адреса ?g= — только буквы, цифры и дефис
let gSaved = ''; try { gSaved = localStorage.getItem('urfu-group') || ''; } catch (e) {}
const qs = new URLSearchParams(location.search);
const qp = (qs.get('p') === '*' ? qs.get('po') : qs.get('p')) || '';
const gRaw = (qs.get('g') || (qs.get('n') ? qp + '-' + qs.get('n') : '') || gSaved).toUpperCase().replace(/\s+/g, '');
const g = /^[А-ЯЁ]{1,6}-\d{6}[А-ЯЁ]{0,2}$/.test(gRaw) ? gRaw : '';
const days = ['Пн','Вт','Ср','Чт','Пт','Сб'].map((w, k) => [w, String(dt(k).getDate())]);
const semStart = new Date(now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1, 8, 1);
const semMon = new Date(semStart.getFullYear(), 8, 1 - (semStart.getDay() + 6) % 7);
const wkNo = Math.floor((mon - semMon) / 6048e5) + 1;
const T = [['08:30','10:00'],['10:15','11:45'],['12:00','13:30'],['14:15','15:45'],['16:00','17:30']];
const plan = [
[[0,'Математический анализ','Лекция'],[1,'Программирование','Практика'],[2,'Английский язык','Практика']],
[[1,'Физика','Лекция'],[2,'Алгоритмы и структуры данных','Лабораторная'],[3,'Физическая культура','Практика']],
[[0,'Основы российской государственности','Семинар'],[1,'Математический анализ','Практика']],
[[0,'Программирование','Лекция'],[1,'Программирование','Лабораторная'],[2,'Физика','Практика'],[3,'История России','Лекция']],
[[1,'Алгебра и геометрия','Лекция'],[2,'Алгебра и геометрия','Практика']],
[]
];
const full = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const KC = {'Лекция':'k-lec','Практика':'k-pr','Лабораторная':'k-lab','Семинар':'k-sem'};
const week = days.map(([w, n], k) => {
const ps = plan[k].map(([i, t, kind]) => ({ from: T[i][0], to: T[i][1], t, kind, cls: 'wp ' + KC[kind] }));
return { w, n, full: full[k], cls: 'wday' + (k === todayIdx ? ' today' : ''), pairs: ps, empty: ps.length === 0 };
});
const pairs = plan[d].map(([i, t, kind]) => ({ from: T[i][0], to: T[i][1], t, kind }));
const view = (this.state && this.state.v) || 'week';
const nowMin = now.getHours() * 60 + now.getMinutes(), mm = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const isToday = d === todayIdx && wd !== 6;
let nextSet = false;
const pairsX = plan[d].map(([i, t, kind]) => { const a = mm(T[i][0]), b = mm(T[i][1]); const nowP = isToday && nowMin >= a && nowMin < b; let next = false, nextT = '';
  if (isToday && !nextSet && nowMin < a) { next = true; nextSet = true; const left = a - nowMin; nextT = 'Через ' + (left >= 60 ? Math.floor(left / 60) + ' ч ' : '') + (left % 60) + ' мин'; }
  return { from: T[i][0], to: T[i][1], t, kind, n: i + 1, now: nowP, next, nextT, cls: 'dv-p ' + KC[kind] + (nowP ? ' is-now' : '') }; });
const gaps = []; for (let j = 1; j < plan[d].length; j++) { const gp = mm(T[plan[d][j][0]][0]) - mm(T[plan[d][j - 1][0]][1]); if (gp >= 40) gaps.push(gp); }
const inSem = wkNo >= 1 && wkNo <= 22 && semStart <= mon;
const parity = inSem ? (wkNo % 2 ? 'нечётная' : 'чётная') : '';
// выгрузка недели в календарь телефона (.ics); Екатеринбург — UTC+5
const ics = () => {
  const z = n => String(n).padStart(2, '0');
  const st = (day, hm) => { const [h, m] = hm.split(':').map(Number); const x = new Date(Date.UTC(day.getFullYear(), day.getMonth(), day.getDate(), h - 5, m)); return x.getUTCFullYear() + z(x.getUTCMonth() + 1) + z(x.getUTCDate()) + 'T' + z(x.getUTCHours()) + z(x.getUTCMinutes()) + '00Z'; };
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//URFU redesign//schedule//RU', 'CALSCALE:GREGORIAN'];
  plan.forEach((ps, k) => ps.forEach(([i, t, kind], j) => { const day = dt(k); L.push('BEGIN:VEVENT', 'UID:' + st(day, T[i][0]) + '-' + j + '@urfu-redesign', 'DTSTAMP:' + st(new Date(), '12:00'), 'DTSTART:' + st(day, T[i][0]), 'DTEND:' + st(day, T[i][1]), 'SUMMARY:' + t + ' (' + kind.toLowerCase() + ')', 'DESCRIPTION:' + (g ? 'Группа ' + g + '. ' : '') + 'Пример расписания с сайта-прототипа УрФУ', 'END:VEVENT'); }));
  L.push('END:VCALENDAR');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar' }));
  a.download = 'raspisanie-' + (g || 'primer') + '-' + dm(mon).replace('.', '-') + '.ics'; document.body.appendChild(a); a.click(); a.remove();
};
return {
g, sub: g ? 'Группа ' + g : 'Пример расписания первого курса', chip: g ? g + ' · пример' : 'Пример: 1 курс',
note: g ? 'Пары показаны для примера: на настоящем сайте здесь будет расписание группы ' + g + ' из системы расписания УрФУ — с аудиториями и преподавателями.' : 'Это пример: введите номер группы, и здесь будет её расписание — с аудиториями и преподавателями.',
wkRange: dm(mon) + ' — ' + dm(dt(5)), wkNo: inSem ? wkNo + '-я неделя семестра, ' + parity : (off === 0 ? 'текущая неделя' : 'вне семестра'),
wkShort: dm(mon) + '–' + dm(dt(5)) + (parity ? ' · ' + parity : ''),
isNow: off === 0, notNow: off !== 0, wkWhen: off === 0 ? 'Эта неделя' : off === 1 ? 'Следующая неделя' : off === -1 ? 'Прошлая неделя' : (off > 0 ? 'Через ' + off + ' нед.' : off + ' нед.'),
prevW: () => this.setState({ w: off - 1, d: 0 }), nextW: () => this.setState({ w: off + 1, d: 0 }), thisW: () => this.setState({ w: 0, d: undefined }), ics,
days: days.map(([w, n], k) => ({ w, n, on: k === d, off: k !== d, pick: () => this.setState({ d: k }) })),
pairs,
week,
isWeek: view === 'week', isDay: view === 'day', toWeek: () => this.setState({ v: 'week' }), toDay: () => this.setState({ v: 'day' }),
dayFull: full[d] + ', ' + dm(dt(d)), pairsX, hasGap: gaps.length > 0, gapT: gaps.length ? 'Большой перерыв: ' + gaps[0] + ' мин — успеете пообедать.' : '',
shareQ: g ? '?g=' + encodeURIComponent(g) : '',
empty: pairs.length === 0
};
}
}

</script>
