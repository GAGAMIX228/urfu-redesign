<h1 class="big" style="font-size:52px;margin-top:20px;max-width:900px">Программная инженерия</h1>
<p style="font-size:19px;margin-top:16px;max-width:760px;color:#2B3946">Проектирование, разработка и сопровождение программных систем: от требований заказчика до работающего продукта.</p>

<div><div class="muted" style="font-size:14px">Проходной балл 2025</div><div style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:28px">259</div></div>

<div><div class="muted" style="font-size:14px">Срок и форма</div><div style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:28px">4 года, очно</div></div>
</div>

<h2 style="margin-top:56px">Проходной балл на бюджет</h2>
<div class="card" style="margin-top:20px;display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap">
<div style="display:flex;gap:28px;align-items:flex-end;height:180px" aria-label="Проходной балл: 2023 — 253, 2024 — 244, 2025 — 259">

<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><b class="num">244</b><div style="width:64px;height:100px;background:#A9BFE2;border-radius:8px 8px 0 0"></div><span class="muted" style="font-size:14px">2024</span></div>

</div>
<div style="flex:1 1 260px"><p style="font-size:17px">Баллы колеблются в пределах 15 — ориентируйтесь на диапазон, а не на одно число.</p><p class="muted" style="font-size:14px;margin-top:8px">Плюс до 6 баллов за аттестат с отличием, 2 — за волонтёрство, 1 — за золотой значок ГТО.</p></div>

<div class="card"><div style="font-weight:600;font-size:18px">Проверять качество</div><p class="muted" style="margin-top:8px">Тестирование, ревью кода, сопровождение.</p></div>
