<style>
.in-addr{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:20px}
.in-addr .card{display:flex;flex-direction:column;gap:4px;border-left:6px solid var(--a3)}
.in-addr b{font-family:var(--narrow);font-size:22px}
.in-p26{margin-top:20px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#FFFFFF}
.in-r{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.in-r:last-child{border-bottom:0}
.in-rh{background:var(--bg-soft-2);font-size:14px;color:var(--muted);font-weight:600}
.in-r>span{font-family:var(--narrow);font-size:19px;font-weight:700}
.in-r small{display:none}
.in-r a{font-weight:600}
@media (max-width:640px){.in-rh{display:none}.in-r{grid-template-columns:repeat(3,minmax(0,1fr))}.in-r a{grid-column:1/-1}.in-r small{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:500;color:var(--muted)}}
.in-logos{display:flex;flex-wrap:wrap;gap:8px}
.in-logos span{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:#FFFFFF;font-family:var(--narrow);font-weight:700;font-size:17px}
.in-ways b,.in-ev b{font-size:18px;display:block}
.in-ways p,.in-ev p{margin-top:6px;font-size:15px}
.in-top .btn{white-space:normal;text-align:center}
.in-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:32px;border-radius:24px;background:linear-gradient(135deg,#EDE3FF,#DCE8FF)}
.in-ev .card{border-top:4px solid var(--a2)}
.in-news{display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--a2)}
.in-news .tag{align-self:flex-start}
.in-news b{font-size:19px;line-height:1.35}
</style>
<style id="im-css">
.im-ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.im-ex button{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--line-strong);background:#FFFFFF;color:var(--ink);cursor:pointer}
.im-ex button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.im-ex button:focus-visible{outline:3px solid var(--amethyst);outline-offset:2px}
.im-res{margin-top:16px;font-family:var(--narrow);font-size:26px;font-weight:700}
.im-fit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.im-fit .card{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink)}
.im-fit b{font-family:var(--narrow);font-size:26px}
.im-n{font-weight:700;color:var(--amethyst)}
.im-fit .muted{font-size:14px}
.im-addr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.im-addr div{display:flex;flex-direction:column;padding:14px 16px;border-radius:14px;background:#FFFFFF;border:1px solid var(--line);border-left:5px solid var(--gold)}
.im-addr span{font-size:14px;color:var(--muted)}
.im-bars{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.im-bars li{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) 110px;gap:14px;align-items:center}
.im-bar{height:14px;border-radius:8px;background:var(--limestone);overflow:hidden}
.im-bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--amethyst),var(--rhodonite))}
.im-bars b{font-family:var(--narrow);font-size:24px;text-align:right}
.im-bars small{font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:var(--muted);font-weight:500}
.im-eg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.im-eg .card,.im-fy .card{display:flex;flex-direction:column;gap:6px}
.im-eg .muted,.im-fy .muted{font-size:15px}
.im-fy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.im-fy a.card{text-decoration:none;color:var(--ink)}
.im-fy a.card:hover{border-color:var(--amethyst)}
@media (max-width:900px){.im-fit,.im-addr{grid-template-columns:repeat(2,minmax(0,1fr))}.im-eg,.im-fy{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.im-fit,.im-addr{grid-template-columns:minmax(0,1fr)}.im-bars li{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}.im-bar{grid-column:1/-1;grid-row:2}}
</style>
<style id="ir3-css">
.ir-camp{background:var(--ink);color:#FFFFFF;border-radius:24px;padding:36px;margin-top:40px}
.ir-camp .muted,.ir-camp .muted a{color:var(--on-dark-muted)}
.ir-camp h2{color:#FFFFFF}
.ir-camp-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.ir-cn{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ir-cn li{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:14px;background:rgba(255,255,255,.08)}
.ir-cn b{font-family:var(--narrow);font-size:28px;color:var(--gold);line-height:1.05}
.ir-cn span{font-size:14px;color:var(--on-dark-muted)}
.ir-hist{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ir-hist li{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;background:#FFFFFF;border:1px solid var(--line);border-top:5px solid var(--rhodonite)}
.ir-hist li:nth-child(2n){border-top-color:var(--amethyst)}
.ir-hist b{font-family:var(--narrow);font-size:30px;line-height:1}
.ir-hist span{font-size:14px;color:var(--muted)}
.ir-labs{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ir-labs li{padding:12px 16px;border-radius:12px;background:var(--limestone);font-weight:600;font-size:15px}
.ir-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ir-pj{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ir-pj span{padding:6px 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;font-weight:600}
.ir-radio{background:var(--gold-soft);border-color:var(--gold)}
.ir-may{display:inline-block;font-family:var(--narrow);font-size:44px;font-weight:700;color:var(--rhodonite-d,#C81A62);line-height:1}
@media (max-width:1000px){.ir-camp-in,.ir-two{grid-template-columns:minmax(0,1fr)}.ir-hist{grid-template-columns:repeat(2,minmax(0,1fr))}.ir-labs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.ir-camp{padding:24px 18px;border-radius:18px}.ir-cn{grid-template-columns:repeat(2,minmax(0,1fr))}.ir-hist,.ir-labs{grid-template-columns:minmax(0,1fr)}}
</style>
<style id="il2-css">
.il-t{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#FFFFFF}
.il-r{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr)) minmax(0,1.2fr);gap:12px;padding:14px 18px;border-top:1px solid var(--line);align-items:center}
.il-r:first-child{border-top:0}
.il-rh{background:var(--limestone);font-size:13px;font-weight:700;color:var(--muted)}
.il-r a{font-family:var(--narrow);font-size:22px;font-weight:700}
.il-r span{font-family:var(--narrow);font-size:20px;font-weight:700}
.il-rh span{font-family:inherit;font-size:13px}
.il-r small{display:none}
.il-fil{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:16px;align-items:center}
.il-fil b{font-family:var(--narrow);font-size:24px}
.il-fc{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:var(--limestone)}
.il-fc a{font-weight:700;font-size:18px}
@media (max-width:760px){.il-rh{display:none}.il-r{grid-template-columns:repeat(2,minmax(0,1fr))}.il-r .il-n{grid-column:1/-1}.il-r span{display:flex;flex-direction:column}.il-r small{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted)}.il-fil{grid-template-columns:minmax(0,1fr)}}
</style>
<style id="ilo-css">.il-oth{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.il-oth .card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}.il-oth .card:hover{border-color:var(--amethyst)}.il-oth b{font-family:var(--narrow);font-size:22px}.il-oth .muted{font-size:15px}@media (max-width:900px){.il-oth{grid-template-columns:minmax(0,1fr)}}</style>
<style id="ilg-css">.il-gr{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.il-gr a{display:flex;flex-direction:column;min-height:44px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#FFFFFF;color:var(--ink);text-decoration:none}.il-gr a:hover{border-color:var(--amethyst)}.il-gr span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}@media (max-width:900px){.il-gr{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
</head>

</div></header><main id="main" tabindex="-1" style="outline:none"><sc-if value="{{isAll}}" hint-placeholder-val="{{false}}"><section class="phead has-ph dark"><div class="wrap" style="padding-bottom:64px"><div class="ph-hex" style="--img:url('photos/glavnyj-korpus-fasad.webp')" aria-hidden="true"></div><div class="crumbs" style="color:var(--on-dark-muted)"><a href="Main.dc.html" style="color:var(--on-dark-muted)">Главная</a> / Об университете / Институты</div><h1 class="big" style="font-size:48px;margin-top:20px;color:#FFFFFF;max-width:960px">Институты УрФУ</h1><p style="color:var(--on-dark-muted);font-size:19px;margin-top:16px;max-width:720px">Выберите институт, чтобы посмотреть его программы и контакты.</p></div></section><div class="wrap"><section class="sec"><div class="g2"><sc-for list="{{all}}" as="x" hint-placeholder-count="8"><a class="card yu-tile" href="{{x.href}}" style="display:flex;flex-direction:column;gap:10px"><span class="tag" style="align-self:flex-start">{{x.short}}</span><div style="font-family:var(--narrow);font-weight:700;font-size:21px">{{x.full}}</div><div class="muted" style="font-size:15px">{{x.lead}}</div><div style="font-size:14px;color:var(--blue);font-weight:600;margin-top:auto">{{x.cnt}}</div></a></sc-for></div></section></div><!-- imore --><div class="wrap">
<section class="sec im-pick" aria-labelledby="im-ex-h">
<h2 id="im-ex-h">Куда можно с моими ЕГЭ</h2>
<p class="muted" style="margin-top:8px;max-width:720px">Отметьте предметы, которые сдаёте, — покажем институты и программы, куда они подходят. Русский язык нужен везде.</p>
<div class="im-ex" role="group" aria-label="Мои предметы ЕГЭ"><sc-for list="{{exBtns}}" as="b" hint-placeholder-count="9"><button type="button" aria-pressed="{{b.on}}" onClick="{{b.tog}}">{{b.n}}</button></sc-for></div>
<p class="im-res" aria-live="polite">{{exSum}}</p>
<div class="im-fit"><sc-for list="{{exFit}}" as="x" hint-placeholder-count="3"><a class="card" href="{{x.href}}"><b>{{x.short}}</b><span class="im-n">{{x.cnt}}</span><span class="muted">{{x.names}}</span></a></sc-for></div>
<p class="muted" style="font-size:14px;margin-top:10px">По каталогу программ сайта. Для архитектуры и журналистики нужен ещё творческий экзамен в УрФУ.</p>
</section>
<section class="sec" aria-labelledby="im-ad-h">
<h2 id="im-ad-h">Где учатся институты</h2>
<div class="im-addr"><sc-for list="{{addrAll}}" as="a" hint-placeholder-count="8"><div><b>{{a.a}}</b><span>{{a.who}}</span></div></sc-for></div>
<p style="margin-top:12px"><a href="Contacts.dc.html">Корпуса на карте кампуса →</a> · <a href="Help.dc.html#bld-h">Как называют корпуса →</a></p>
</section>
<!-- ilist2 --><section class="sec" aria-labelledby="il-t-h">
<h2 id="il-t-h">Институты в цифрах</h2>
<p class="muted" style="margin-top:8px;max-width:720px">По программам бакалавриата из каталога сайта: сколько их, самый высокий проходной балл, бюджетные места и цена за год.</p>
<div class="il-t" role="table" aria-label="Институты в цифрах">
<div class="il-r il-rh" role="row"><span role="columnheader">Институт</span><span role="columnheader">Программ</span><span role="columnheader">Лучший балл</span><span role="columnheader">Бюджет</span><span role="columnheader">Цена в год</span></div>
<sc-for list="{{itab}}" as="r" hint-placeholder-count="8"><div class="il-r" role="row"><span role="cell" class="il-n"><a href="{{r.href}}">{{r.short}}</a></span><span role="cell"><small>Программ</small>{{r.n}}</span><span role="cell"><small>Лучший балл</small>{{r.top}}</span><span role="cell"><small>Бюджет</small>{{r.b}}</span><span role="cell"><small>Цена в год</small>{{r.p}}</span></div></sc-for>
</div>
<p class="muted" style="font-size:14px;margin-top:10px">Проходные баллы 2024–2025 годов. «—» — в каталоге нет данных.</p>
</section>
