<h1 class="big" style="font-size:44px;margin-top:20px">Почти 50 тысяч заявлений на бюджет: УрФУ подвёл итоги приёма-2026</h1>
<p style="font-size:22px;line-height:1.45;margin-top:24px;color:#2B3946">Бюджетный этап приёмной кампании завершён, и интерес к университету заметно вырос: заявлений стало на 7,5 тысячи больше, чем годом раньше.</p>
</div></section>
<div class="wrap" style="margin-top:40px"><div class="ph art t1 photo" style="--img:url('photos/glavnyj-korpus-fasad.webp');height:480px;position:relative;overflow:hidden"></div></div>
<div class="wrap" style="max-width:860px;margin-top:40px;font-size:19px;line-height:1.7">
<div class="ar-top">
<aside class="ar-short" aria-labelledby="ar-sh"><h2 id="ar-sh">Коротко</h2><ul>
<li>Почти 50 тысяч заявлений на бюджет — на 7,5 тысячи больше, чем в 2025 году.</li>
<li>Больше всего хотят на IT и инженерные программы.</li>
<li>Целевых заявлений на 40% больше, чем мест.</li>
<li>УрФУ уходит от бакалавриата к «базовому высшему» — в пилотном проекте.</li>
</ul></aside>
<nav class="ar-toc" aria-labelledby="ar-toc"><h2 id="ar-toc">Содержание</h2><ol>

<li><a href="#ar-new">Что меняется в университете</a></li>

</ol></nav>
</div>
<h2 id="ar-num" style="margin-top:8px;margin-bottom:20px;font-size:28px">Итоги в цифрах</h2>
<div class="g3" style="margin-bottom:36px;font-size:16px;line-height:1.4">
<div style="border-top:3px solid var(--blue);padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:var(--blue)">49 832</div><div class="muted">заявления на бюджетные места</div></div>
<div style="border-top:3px solid var(--blue);padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:var(--blue)">+7,5 тыс.</div><div class="muted">к прошлому году</div></div>
<div style="border-top:3px solid var(--blue);padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:var(--blue)">1 065</div><div class="muted">заявлений по целевой квоте</div></div>
</div>
<p>Приём документов на бюджетные места в Уральском федеральном университете закончился. Всего абитуриенты подали почти 50 тысяч заявлений — заметно больше, чем в прошлую кампанию.</p>
<p style="margin-top:20px">Особенно вырос спрос на целевое обучение: заявлений по целевой квоте пришло примерно на 40% больше, чем было выделено мест.</p>
<h2 id="ar-who" style="margin-top:44px;font-size:28px">Кто и куда подавал</h2>
<p style="margin-top:16px">Самый высокий спрос — на IT-программы и инженерные специальности. Отдельно считают тех, кто может поступить без вступительных испытаний: такие абитуриенты претендуют на 1 861 бюджетное место.</p>
<div class="ar-quote"><b>1 861</b><span>бюджетное место — на столько претендуют абитуриенты с правом поступления без экзаменов</span></div>
<p style="margin-top:20px">Целевое обучение снова стало популярнее: заявлений по целевой квоте — 1 065, это на 40% больше, чем выделено мест. Значит, и на целевые места был конкурс. Как устроена целевая квота — в разделе <a href="Admission.dc.html#benefits">«Особые права»</a>.</p>
<h2 id="ar-late" style="margin-top:44px;font-size:28px">Что ещё можно было успеть</h2>
<p style="margin-top:16px">Приём на платные места продолжается. Тем, кто сдаёт внутренние вступительные испытания, документы принимают до 15 августа, а поступающим по результатам ЕГЭ — до 20 августа. Подробности — на странице <a href="Admission.dc.html">«Как поступить»</a>.</p>
<h2 id="ar-new" style="margin-top:44px;font-size:28px">Что меняется в университете</h2>
<p style="margin-top:16px">УрФУ стал участником пилотного проекта новой системы высшего образования. Вместо привычной схемы «бакалавриат — магистратура» в вузе будет два уровня: базовое и специализированное высшее образование.</p>
<p style="margin-top:20px">Базовое высшее образование будет длиться от 4 до 6 лет, а специализированное (магистратура, ординатура) — от 1 до 3 лет.</p>
<h2 id="ar-tl" style="margin-top:44px;font-size:28px">Как шёл приём-2026</h2>
<ol class="ar-tl"><li><b>20 июня</b><span>Старт приёма документов</span></li><li><b>15 июля</b><span>Последний день для тех, кто сдаёт экзамены УрФУ</span></li><li><b>25 июля</b><span>Последний день приёма на бюджет по ЕГЭ</span></li><li><b>27 июля</b><span>Итоги: 49 832 заявления на бюджет</span></li><li><b>1, 5 и 9 августа</b><span>Согласия на зачисление: квоты, основной и дополнительный этапы</span></li><li><b>20 августа</b><span>Последний день подачи на платное</span></li></ol>
<p style="margin-top:12px;font-size:15px;color:var(--muted)">Даты — из <a href="Admission.dc.html#calendar">календаря приёма УрФУ</a>.</p>
<div class="ar-ph"><figure><div class="ph art photo" style="--img:url('photos/studenty.webp')"></div><figcaption>Студенты УрФУ</figcaption></figure><figure><div class="ph art photo" style="--img:url('photos/kampus-leto.webp')"></div><figcaption>Кампус летом</figcaption></figure></div>
<h2 id="ar-next" style="margin-top:44px;font-size:28px">Что это значит для поступающих в 2027 году</h2>
<p style="margin-top:16px">Если интерес к университету продолжит расти, конкурс на популярные IT- и инженерные программы может стать выше. Вот что стоит сделать заранее:</p>
<ol class="ar-steps">
<li><b>Посмотрите проходные баллы прошлых лет</b><span>В <a href="Catalog.dc.html">каталоге</a> — баллы и места по каждой программе, фильтр по вашим ЕГЭ.</span></li>
<li><b>Выберите 2–3 запасные программы</b><span>Можно подать на 5 направлений и расставить приоритеты. Поможет <a href="Quiz.dc.html">подбор за 3 вопроса</a>.</span></li>
<li><b>Соберите достижения</b><span>Аттестат с отличием, ГТО, волонтёрство и олимпиады УрФУ дают дополнительные баллы — <a href="Admission.dc.html#school">что есть для школьников</a>.</span></li>
<li><b>Запишите даты</b><span>Приём начинается 20 июня, согласие подают в начале августа — <a href="Admission.dc.html#calendar">календарь приёма</a>.</span></li>
</ol>
<p style="margin-top:28px;font-size:15px;color:var(--muted)">Источник: <a href="https://obltv.ru/news/bolshe-50-tysyach-abiturientov-podali-zayavleniya-v-urfu-v-2026-33873">ОТВ</a>. Текст пересказан для прототипа.</p>

const t = document.createElement('textarea'); t.value = url; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;left:-9999px;top:0';
document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove();
if (ok) done(); else window.prompt('Скопируйте ссылку:', url);
};
if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, fallback); else fallback();
}
};
}
}
