<h1 class="big" style="font-size:44px;margin-top:20px">Почти 50 тысяч заявлений на бюджет: УрФУ подвёл итоги приёма-2026</h1>
<p style="font-size:22px;line-height:1.45;margin-top:24px;color:#2B3946">Бюджетный этап приёмной кампании завершён, и интерес к университету заметно вырос: заявлений стало на 7,5 тысячи больше, чем годом раньше.</p>
</div></section>
<div class="wrap" style="margin-top:40px"><div class="ph art t1 photo" style="--img:url('photos/glavnyj-korpus-fasad.webp');height:480px;position:relative;overflow:hidden"></div></div>
<div class="wrap" style="max-width:860px;margin-top:40px;font-size:19px;line-height:1.7">
<div class="g3" style="margin-bottom:36px;font-size:16px;line-height:1.4">
<div style="border-top:3px solid var(--blue);padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:var(--blue)">49 832</div><div class="muted">заявления на бюджетные места</div></div>
<div style="border-top:3px solid var(--blue);padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:var(--blue)">+7,5 тыс.</div><div class="muted">к прошлому году</div></div>
<div style="border-top:3px solid var(--blue);padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:var(--blue)">1 065</div><div class="muted">заявлений по целевой квоте</div></div>
</div>
<p>Приём документов на бюджетные места в Уральском федеральном университете закончился. Всего абитуриенты подали почти 50 тысяч заявлений — заметно больше, чем в прошлую кампанию.</p>
<p style="margin-top:20px">Особенно вырос спрос на целевое обучение: заявлений по целевой квоте пришло примерно на 40% больше, чем было выделено мест.</p>
<h2 style="margin-top:44px;font-size:28px">Что ещё можно успеть</h2>
<p style="margin-top:16px">Приём на платные места продолжается. Тем, кто сдаёт внутренние вступительные испытания, документы принимают до 15 августа, а поступающим по результатам ЕГЭ — до 20 августа. Подробности — на странице <a href="Admission.dc.html">«Как поступить»</a>.</p>
<h2 style="margin-top:44px;font-size:28px">Что меняется в университете</h2>
<p style="margin-top:16px">УрФУ стал участником пилотного проекта новой системы высшего образования. Вместо привычной схемы «бакалавриат — магистратура» в вузе будет два уровня: базовое и специализированное высшее образование.</p>
<p style="margin-top:28px;font-size:15px;color:var(--muted)">Источник: <a href="https://obltv.ru/news/bolshe-50-tysyach-abiturientov-podali-zayavleniya-v-urfu-v-2026-33873">ОТВ</a>. Текст пересказан для прототипа.</p>
