<h1 class="big" style="font-size:44px;margin-top:20px">Почти 50 тысяч заявлений на бюджет: УрФУ подвёл итоги приёма-2026</h1>
<p style="font-size:22px;line-height:1.45;margin-top:24px;color:#2B3946">Бюджетный этап приёмной кампании завершён, и интерес к университету заметно вырос: заявлений стало на 7,5 тысячи больше, чем годом раньше.</p>
</div>
<div class="wrap" style="margin-top:40px"><div class="ph" style="height:480px;position:relative;overflow:hidden"><svg aria-hidden="true" style="position:absolute;left:0;top:0;width:100%;height:100%"><defs><pattern id="hatch0" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#C3CEDC" stroke-width="1"></line></pattern></defs><rect width="100%" height="100%" fill="#DCE3EC"></rect><rect width="100%" height="100%" fill="url(#hatch0)"></rect></svg><span style="position:relative;display:inline-flex;align-items:center;gap:6px;background:#FFFFFF;color:#3E4853;padding:4px 10px;border-radius:4px;font-size:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>Фото приёмной комиссии</span></div></div>
<div class="wrap" style="max-width:860px;margin-top:40px;font-size:19px;line-height:1.7">
<div class="g3" style="margin-bottom:36px;font-size:16px;line-height:1.4">
<div style="border-top:3px solid #1D4E9E;padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:#1D4E9E">49 832</div><div class="muted">заявления на бюджетные места</div></div>
<div style="border-top:3px solid #1D4E9E;padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:#1D4E9E">+7,5 тыс.</div><div class="muted">к прошлому году</div></div>
<div style="border-top:3px solid #1D4E9E;padding-top:14px"><div class="num" style="font-weight:700;font-size:34px;color:#1D4E9E">1 065</div><div class="muted">заявлений по целевой квоте</div></div>
</div>
<p>Приём документов на бюджетные места в Уральском федеральном университете закончился. Всего абитуриенты подали почти 50 тысяч заявлений — заметно больше, чем в прошлую кампанию.</p>
<p style="margin-top:20px">Особенно вырос спрос на целевое обучение: заявлений по целевой квоте пришло примерно на 40% больше, чем было выделено мест.</p>
<h2 style="margin-top:44px;font-size:28px">Что ещё можно успеть</h2>
<p style="margin-top:16px">Приём на платные места продолжается. Тем, кто сдаёт внутренние вступительные испытания, документы принимают до 15 августа, а поступающим по результатам ЕГЭ — до 20 августа. Подробности — на странице <a href="Admission.dc.html">«Как поступить»</a>.</p>
<h2 style="margin-top:44px;font-size:28px">Что меняется в университете</h2>
<p style="margin-top:16px">УрФУ стал участником пилотного проекта новой системы высшего образования. Вместо привычной схемы «бакалавриат — магистратура» в вузе будет два уровня: базовое и специализированное высшее образование.</p>
<p style="margin-top:28px;font-size:15px;color:#56606B">Источник: <a href="https://obltv.ru/news/bolshe-50-tysyach-abiturientov-podali-zayavleniya-v-urfu-v-2026-33873">ОТВ</a>. Текст пересказан для прототипа.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:32px;padding-top:24px;border-top:1px solid #E1E5EA;align-items:center"><span class="muted" style="font-size:15px">Поделиться:</span><a class="chip" href="Article.dc.html">ВКонтакте</a><a class="chip" href="Article.dc.html">Telegram</a><a class="chip" href="Article.dc.html">Скопировать ссылку</a></div>
