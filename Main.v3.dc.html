<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Главная — УрФУ (прототип v3, конструктивизм)</title>
<style>
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Bold.ttf') format('truetype');font-weight:700;font-display:swap}

/* ===== Цвета: чёрный, белый, синий УрФУ и один «сигнальный» для фигур ===== */
:root{
  --ink:#0E1B2B; --paper:#FFFFFF; --paper-2:#EEF1F4;
  --blue:#1D4E9E; --blue-dark:#163B78;
  --signal:#A3521F;      /* только для фигур, не для текста */
  --muted:#4A5563;
  --line:var(--ink);
  --dark-line:#2A3A4F;   /* линии на тёмном фоне */
  --odm:#C9D1DA;         /* текст на тёмном фоне */
  --odl:#8E9AAB;         /* подписи на тёмном фоне */
  --obm:#E1E8F4;         /* второстепенный текст на синем */
  --lbl:#9DB8E6;         /* метка на тёмном */
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.inv :focus-visible,.bluebg :focus-visible{outline-color:#FFFFFF}
.num{font-variant-numeric:tabular-nums lining-nums}

/* крупная типографика */
.disp{font-weight:700;text-transform:uppercase;letter-spacing:-0.035em;line-height:.9}
.out{color:transparent;-webkit-text-stroke:2px currentColor}
.out{color:transparent;-webkit-text-stroke:2px var(--ink)}
.inv .out{-webkit-text-stroke-color:#FFFFFF}
.label{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}

/* кнопки — прямоугольные, с жёсткой тенью */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;background:var(--ink);color:#FFFFFF;border:2px solid var(--ink);font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s ease}
.btn:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--blue)}
.btn:active{transform:none;box-shadow:none}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.blue:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.white{background:#FFFFFF;color:var(--ink);border-color:#FFFFFF}
.btn.white:hover{box-shadow:3px 3px 0 var(--ink)}
.arr{display:inline-block;transition:transform .2s var(--ease)}
a:hover .arr{transform:translateX(6px)}

/* ===== Палитры (переключатель внизу слева) ===== */
/* «Малахит»: уральский камень + золото */
[data-theme="malachite"]{
  --ink:#0F2421; --paper-2:#EAF1EE; --blue:#0B6E5A; --blue-dark:#085746; --signal:#C08A2E;
  --muted:#45524E; --dark-line:#2A403B; --odm:#C8D6D1; --odl:#8FA39C; --obm:#E3F0EB; --lbl:#8FD3C0;
}
/* «Сталь и песок»: графит, стальной синий, терракота, тёплый фон */
[data-theme="steel"]{
  --ink:#1E2226; --paper:#FAF8F4; --paper-2:#ECE6DA; --blue:#2B4C7E; --blue-dark:#203A61; --signal:#B5532A;
  --muted:#4F4A44; --dark-line:#3A3F45; --odm:#D2CCC2; --odl:#9A948B; --obm:#E2E8F1; --lbl:#A9BEDC;
}
/* «Контраст»: прежний вариант v3 — чёрный и оранжевый */
[data-theme="contrast"]{
  --ink:#111214; --paper-2:#F2F2EE; --signal:#FF5A1F;
  --muted:#4A4F57; --dark-line:#3A3D42; --odm:#D0D3D8; --odl:#9EA3AB; --lbl:#9DB8E6;
}
/* фигуры в картинках берут цвета палитры */
svg [fill="#1D4E9E"]{fill:var(--blue)}
svg [fill="#FF5A1F"]{fill:var(--signal)}
svg [fill="#111214"]{fill:var(--ink)}
svg [fill="#F2F2EE"]{fill:var(--paper-2)}
svg [stroke="#111214"]{stroke:var(--ink)}

/* ===== Шапка ===== */
.hd{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--line)}
.hd-in{display:flex;align-items:stretch;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;padding-right:24px;margin-right:8px;border-right:2px solid var(--line);text-decoration:none;font-weight:700;font-size:22px;letter-spacing:-0.02em;flex:none}
.nav{display:flex;flex:1}
.nav a{display:flex;align-items:center;padding:0 14px;min-height:44px;text-decoration:none;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;transition:background .15s ease,color .15s ease}
.nav a:hover{background:var(--ink);color:#FFFFFF}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;padding-left:12px}
.ico{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;cursor:pointer;border:2px solid transparent}
.ico:hover{border-color:var(--ink)}
.lang{display:flex;border:2px solid var(--ink);font-size:13px;font-weight:700}
.lang>*{min-height:40px;min-width:42px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.lang>[aria-current]{background:var(--ink);color:#FFFFFF}
.mnav{display:none;position:relative}
.mnav summary{list-style:none}
.mnav summary::-webkit-details-marker{display:none}
.mnav-panel{position:absolute;right:0;top:calc(100% + 14px);width:min(320px,calc(100vw - 32px));background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--blue);display:flex;flex-direction:column}
.mnav-panel a{padding:14px 16px;min-height:48px;text-decoration:none;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.04em;border-bottom:1px solid var(--ink)}
.mnav-panel a:last-child{border-bottom:0}
.mnav-panel a:hover{background:var(--ink);color:#FFFFFF}
.mnav[open] .i-open,.mnav:not([open]) .i-close{display:none}

/* ===== Первый экран ===== */
.hero{position:relative;border-bottom:2px solid var(--line);overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);min-height:640px}
.hero-l{padding:56px 40px 48px 0;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;z-index:1}
.hero h1{font-size:clamp(52px,8.4vw,128px)}
.hero h1 .bl{display:inline-block;background:var(--blue);color:#FFFFFF;padding:0 .12em;margin-left:-.06em}
.hero-lead{font-size:20px;max-width:520px;font-weight:500}
.search{position:relative;max-width:680px}
.search-box{display:flex;border:2px solid var(--ink);background:var(--paper);box-shadow:6px 6px 0 var(--ink);transition:box-shadow .15s ease}
.search-box:focus-within{box-shadow:6px 6px 0 var(--blue)}
.search-box input{flex:1;min-width:0;min-height:60px;border:0;padding:0 18px;font:inherit;font-size:18px;background:transparent;color:var(--ink)}
.search-box input:focus{outline:none}
.search-box input::placeholder{color:#6B7079}
.search-box .btn{min-height:auto;border:0;border-left:2px solid var(--ink)}
.search-box .btn:hover{transform:none;box-shadow:none;background:var(--blue)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 12px);background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--blue);z-index:30}
.sug a{display:flex;justify-content:space-between;gap:16px;padding:12px 18px;text-decoration:none;border-bottom:1px solid var(--ink);align-items:center}
.sug a:last-child{border-bottom:0}
.sug a:hover{background:var(--ink);color:#FFFFFF}
.sug a:hover .muted{color:var(--odm)}
.often{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px;font-size:14px;font-weight:600}
.often a{padding:6px 12px;border:2px solid var(--ink);text-decoration:none;text-transform:uppercase;font-size:12px;letter-spacing:.06em;font-weight:700}
.often a:hover{background:var(--ink);color:#FFFFFF}

/* правая часть первого экрана — конструктивистская композиция */
.hero-r{position:relative;border-left:2px solid var(--line);background:var(--paper-2);overflow:hidden}
.hero-r svg{position:absolute;inset:0;width:100%;height:100%}
.hero-r .tag{position:absolute;left:24px;bottom:24px;background:var(--ink);color:#FFFFFF;padding:8px 12px}
@keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
html:not(.ready) .rv{animation:slide .6s var(--ease) both}
html:not(.ready) .rv2{animation-delay:.08s}html:not(.ready) .rv3{animation-delay:.16s}html:not(.ready) .rv4{animation-delay:.24s}
html:not(.ready) .hero-r .c{animation:drop .7s var(--ease) both;transform-box:fill-box}
html:not(.ready) .hero-r .d{animation:spin .9s var(--ease) both;transform-box:fill-box;transform-origin:center}

/* ===== Полоса с цифрами ===== */
.inv{background:var(--ink);color:#FFFFFF}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:36px 24px 36px 0;border-right:1px solid var(--dark-line)}
.stat+.stat{padding-left:28px}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:clamp(44px,5vw,72px);font-weight:700;letter-spacing:-0.03em;line-height:1}
.stat:nth-child(even) b{color:transparent;-webkit-text-stroke:2px #FFFFFF}
.stat span{display:block;margin-top:10px;color:var(--odm);font-size:15px;max-width:220px}

/* ===== Секции ===== */
.sec{padding:96px 0 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:24px;border-bottom:2px solid var(--line);margin-bottom:0}
.sec-h h2{font-size:clamp(44px,7vw,104px)}
.sec-h .label{display:block;margin-bottom:12px;color:var(--blue)}
.more{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.06em;text-decoration:none;border-bottom:2px solid var(--ink)}
.more:hover{color:var(--blue);border-color:var(--blue)}

/* роли — вкладки-коробки */
.roles{display:flex;flex-wrap:wrap;border:2px solid var(--ink);border-top:0}
.roles button{flex:1 1 160px;min-height:56px;border:0;border-right:2px solid var(--ink);background:var(--paper);font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;cursor:pointer;color:var(--ink)}
.roles button:last-child{border-right:0}
.roles button:hover{background:var(--paper-2)}
.roles button[aria-pressed="true"]{background:var(--blue);color:#FFFFFF}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-left:2px solid var(--ink)}
.row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;padding:22px 24px;min-height:96px;text-decoration:none;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transition:background .15s ease,color .15s ease}
.row .n{font-weight:700;font-size:14px;color:var(--blue)}
.row .t{display:block;font-size:22px;font-weight:700;letter-spacing:-0.01em;line-height:1.2}
.row .d{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.row .arr{font-size:28px;font-weight:700}
.row:hover{background:var(--ink);color:#FFFFFF}
.row:hover .n{color:#FFFFFF}
.row:hover .d{color:var(--odm)}

/* институты — таблица */
.inst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-left:2px solid var(--ink)}
.inst a{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:170px;padding:22px;text-decoration:none;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);overflow:hidden;transition:color .2s ease}
.inst a::before{content:"";position:absolute;inset:0;background:var(--blue);transform:translateY(101%);transition:transform .3s var(--ease);z-index:-1}
.inst a{z-index:0}
.inst a:hover{color:#FFFFFF}
.inst a:hover::before{transform:none}
.inst b{font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1}
.inst span{font-size:15px;font-weight:500}

/* поступление — синяя полоса на всю ширину */
.bluebg{background:var(--blue);color:#FFFFFF;position:relative;overflow:hidden}
.adm{padding:80px 0;position:relative}
.adm-deco{position:absolute;right:-80px;top:-60px;width:520px;height:520px;pointer-events:none}
.adm h2{font-size:clamp(44px,6.5vw,96px)}
.adm .note{margin-top:16px;font-size:14px;color:var(--obm);max-width:520px}
.steps{list-style:none;padding:0;margin:48px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid #FFFFFF;position:relative}
.steps li{padding:24px 24px 0 0;border-right:1px solid rgba(255,255,255,.35)}
.steps li+li{padding-left:24px}
.steps li:last-child{border-right:0}
.steps .k{font-size:14px;font-weight:700;letter-spacing:.1em}
.steps .date{display:block;font-size:clamp(28px,3vw,40px);font-weight:700;letter-spacing:-0.02em;margin-top:12px;line-height:1.05}
.steps .what{display:block;margin-top:8px;color:var(--obm)}
.adm-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px;position:relative}

/* новости */
.news{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);border-left:2px solid var(--ink)}
.nc{display:flex;flex-direction:column;text-decoration:none;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.nc .body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.nc .meta{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nc .cat{background:var(--ink);color:#FFFFFF;padding:4px 8px}
.nc .ttl{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-0.01em}
.nc.big .ttl{font-size:28px}
.nc:hover .ttl{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.ev{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);display:flex;flex-direction:column}
.ev-h{padding:16px 22px;background:var(--ink);color:#FFFFFF}
.ev a{display:flex;gap:16px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--ink);text-decoration:none;flex:1}
.ev a:last-child{border-bottom:0}
.ev a:hover{background:var(--paper-2)}
.ev-d{min-width:64px;text-align:center;border:2px solid var(--ink);padding:6px 4px}
.ev-d b{display:block;font-size:24px;font-weight:700;line-height:1}
.ev-d span{display:block;font-size:12px;font-weight:700;text-transform:uppercase;margin-top:2px}
.ev-t{font-weight:700}
.ev .muted{font-size:14px}
.muted{color:var(--muted)}

/* «фото» — плоские конструктивистские композиции вместо серых заглушек */
.comp{position:relative;overflow:hidden;min-height:220px;border-bottom:2px solid var(--ink);background:var(--paper-2)}
.comp svg{position:absolute;inset:0;width:100%;height:100%}
.comp .lbl{position:absolute;left:12px;bottom:12px;background:var(--paper);border:2px solid var(--ink);padding:3px 8px;font-size:12px;font-weight:600}
.nc:hover .comp .sh{transform:rotate(-4deg) scale(1.04)}
.comp .sh{transition:transform .5s var(--ease);transform-box:fill-box;transform-origin:center}

/* история — чёрный блок */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);text-decoration:none;border:2px solid var(--ink)}
.story .comp{min-height:420px;border-bottom:0;border-right:2px solid var(--ink)}
.story-tx{padding:56px 48px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.story h2{font-size:clamp(30px,3.2vw,46px);font-weight:700;letter-spacing:-0.02em;line-height:1.05}
.story p{color:var(--odm);font-size:18px}
.story .go{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px}

/* жизнь */
.life{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:190px;border-left:2px solid var(--ink)}
.life a{position:relative;display:block;text-decoration:none;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);overflow:hidden}
.life .comp{position:absolute;inset:0;min-height:0;border:0}
.life .w2{grid-column:span 2;grid-row:span 2}
.life .w2h{grid-column:span 2}
.life b{position:absolute;left:18px;top:14px;z-index:1;font-size:clamp(24px,2.6vw,40px);font-weight:700;text-transform:uppercase;letter-spacing:-0.02em;line-height:1;background:var(--paper);padding:4px 8px;border:2px solid var(--ink)}
.life a:hover .sh{transform:rotate(-4deg) scale(1.05)}

/* ===== Подвал ===== */
.ft{margin-top:120px}
.ft-top{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.2fr;gap:32px;padding:56px 0 40px}
.ft-col{display:flex;flex-direction:column;gap:10px;font-size:15px}
.ft-col a{text-decoration:none;color:#FFFFFF}
.ft-col a:hover{text-decoration:underline}
.ft-h{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--odl);margin-bottom:6px}
.ft-big{font-size:clamp(80px,19vw,300px);line-height:.8;padding-top:24px;border-top:1px solid var(--dark-line);overflow:hidden;white-space:nowrap}
.ft-copy{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0 28px;color:var(--odl);font-size:14px}

/* ===== Доступность ===== */
.skip{position:absolute;left:16px;top:-60px;z-index:50;background:var(--blue);color:#FFFFFF;padding:12px 18px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.a11y-cb{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#a11y:checked ~ main{zoom:1.2}
#a11y:checked ~ main .out,#a11y:checked ~ footer .out{color:inherit;-webkit-text-stroke:0}
#a11y:checked ~ main .muted,#a11y:checked ~ main .row .d{color:inherit !important}
#a11y:checked ~ main a{text-decoration:underline}
#a11y:checked ~ header .a11y-lbl{background:var(--ink);color:#FFFFFF}
#a11y:focus-visible ~ header .a11y-lbl{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* ===== Планшет и телефон ===== */
@media (max-width:1200px){.nav{display:none}.mnav{display:block}}
@media (max-width:1000px){
  .hero-grid{grid-template-columns:minmax(0,1fr);min-height:0}.hero-r{border-left:0;border-top:2px solid var(--line);min-height:300px}
  .hero-l{padding-right:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(2){border-right:0}.stat:nth-child(3){padding-left:0}.stat:nth-child(n+3){border-top:1px solid var(--dark-line)}
  .inst{grid-template-columns:repeat(2,minmax(0,1fr))}
  .news{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.news .ev{grid-column:span 2}
  .story{grid-template-columns:minmax(0,1fr)}.story .comp{border-right:0;border-bottom:2px solid var(--ink);min-height:260px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}.steps li:nth-child(2){border-right:0}.steps li:nth-child(3){padding-left:0}
  .ft-top{grid-template-columns:repeat(2,minmax(0,1fr))}
  .adm-deco{opacity:.35}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .brand{padding-right:12px;font-size:20px}.tools{gap:2px}.tools .btn{display:none}
  .hero-l{padding:36px 0 32px}.hero-lead{font-size:17px}
  .search-box input{font-size:16px;min-height:54px;padding:0 12px}.search-box .btn{padding:0 14px}
  .out{-webkit-text-stroke-width:1.5px}
  .stat{padding:24px 12px 24px 0}.stat+.stat{padding-left:12px}.stat:nth-child(3){padding-left:0}
  .sec{padding-top:64px}
