<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Эксперимент: три варианта палитры «Самоцветы Урала» рядом.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<title>[Эксперимент] Палитры рядом — УрФУ</title>
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg-soft)}
.bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:12px 20px;background:#FFFFFF;border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;margin:0}
.grp{display:inline-flex;gap:4px;padding:4px;background:var(--bg-soft);border-radius:8px}
.grp button{min-height:40px;padding:0 14px;border:0;border-radius:6px;background:transparent;font:inherit;color:var(--muted);cursor:pointer}
.grp button[aria-pressed="true"]{background:#FFFFFF;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(14,27,43,.15)}
label.sync{display:inline-flex;gap:8px;align-items:center;cursor:pointer;min-height:40px}
label.sync input{width:18px;height:18px}
.panes{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;flex-wrap:wrap}
.pane-h a{font-weight:400;font-size:14px}
.sw{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.sw i{width:16px;height:16px;border-radius:4px;display:inline-block}
.stage{flex:1;position:relative;overflow:hidden;background:#FFFFFF;border:1px solid var(--line);border-radius:8px;min-height:0}
.stage iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#FFFFFF}
.phone .stage{background:transparent;border:0}
.phone .stage iframe{border:1px solid var(--line);border-radius:12px}
.note{padding:0 20px 12px;font-size:14px;color:var(--muted)}
@media (max-width:900px){.panes{grid-template-columns:1fr;overflow:auto}.pane{min-height:70vh}}
</style>
</head>
<body>
<div class="bar">
<h1><a href="index.html" style="color:inherit;text-decoration:none" aria-label="К списку экранов">←</a> Палитры рядом</h1>
<div class="grp" role="group" aria-label="Страница">
<button type="button" data-page="Main" aria-pressed="true">Главная</button>
<button type="button" data-page="Catalog" aria-pressed="false">Каталог</button>
<button type="button" data-page="Institute" aria-pressed="false">Институт</button>
</div>
<div class="grp" role="group" aria-label="Устройство">
<button type="button" data-dev="desk" aria-pressed="true">Компьютер</button>
<button type="button" data-dev="phone" aria-pressed="false">Телефон</button>
</div>
<label class="sync"><input type="checkbox" id="sync" checked> Прокручивать вместе</label>
</div>
<p class="note">Меняются только четыре цвета-самоцвета и свечение на тёмных блоках; фирменный синий, шрифт и вёрстка те же. Все цвета проходят контраст WCAG AA.</p>
<div class="panes" id="panes">
<section class="pane"><div class="pane-h"><span>Сейчас<span class="sw"><i style="background:#0B7A63"></i><i style="background:#6A4C9C"></i><i style="background:#1D4E9E"></i><i style="background:#A63A3A"></i></span></span><a data-open="" href="Main.palette.dc.html" target="_blank">Открыть отдельно</a></div><div class="stage"><iframe title="Палитра сейчас"></iframe></div></section>
<section class="pane"><div class="pane-h"><span>Ярче<span class="sw"><i style="background:#007864"></i><i style="background:#7A3FC2"></i><i style="background:#1A56D6"></i><i style="background:#C42F3E"></i></span></span><a data-open="vivid" href="Main.palette.dc.html?p=vivid" target="_blank">Открыть отдельно</a></div><div class="stage"><iframe title="Палитра ярче"></iframe></div></section>
<section class="pane"><div class="pane-h"><span>Спокойнее<span class="sw"><i style="background:#2E6B5F"></i><i style="background:#5E5A80"></i><i style="background:#34507E"></i><i style="background:#8A4A45"></i></span></span><a data-open="calm" href="Main.palette.dc.html?p=calm" target="_blank">Открыть отдельно</a></div><div class="stage"><iframe title="Палитра спокойнее"></iframe></div></section>
</div>
<script>
(function(){
  var page = 'Main', dev = 'desk', W = {desk:1366, phone:390};
  var pals = ['', 'vivid', 'calm'];
  var frames = [].slice.call(document.querySelectorAll('iframe'));
  var panes = document.getElementById('panes');
  function url(p){ return page + '.palette.dc.html' + (p ? '?p=' + p : ''); }
  function load(){
    frames.forEach(function(f, i){ f.src = url(pals[i]); });
    document.querySelectorAll('[data-open]').forEach(function(a){ a.href = url(a.getAttribute('data-open')); });
  }
  function fit(){
    frames.forEach(function(f){
      var st = f.parentNode, w = W[dev], s = Math.min(1, st.clientWidth / w);
      f.style.width = w + 'px'; f.style.height = (st.clientHeight / s) + 'px';
      f.style.transform = 'scale(' + s + ')';
      f.style.left = dev === 'phone' ? Math.max(0, (st.clientWidth - w * s) / 2) + 'px' : '0';
    });
  }
  function press(attr, val){ document.querySelectorAll('[' + attr + ']').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute(attr) === val)); }); }
  document.querySelectorAll('[data-page]').forEach(function(b){ b.addEventListener('click', function(){ page = b.dataset.page; press('data-page', page); load(); }); });
  document.querySelectorAll('[data-dev]').forEach(function(b){ b.addEventListener('click', function(){ dev = b.dataset.dev; press('data-dev', dev); panes.classList.toggle('phone', dev === 'phone'); fit(); }); });
  window.addEventListener('resize', fit);
  /* общая прокрутка по доле страницы */
  var lock = false;
  function follow(src){
    if (lock || !document.getElementById('sync').checked) return;
    var a; try { a = src.contentDocument.documentElement; } catch(e){ return; }
    var p = a.scrollTop / Math.max(1, a.scrollHeight - a.clientHeight);
    lock = true;
    frames.forEach(function(f){ if (f === src) return; try { var b = f.contentDocument.documentElement; f.contentWindow.scrollTo(0, p * (b.scrollHeight - b.clientHeight)); } catch(e){} });
    setTimeout(function(){ lock = false; }, 60);
  }
  frames.forEach(function(f){ f.addEventListener('load', function(){ try { f.contentWindow.addEventListener('scroll', function(){ follow(f); }); } catch(e){} }); });
  load(); fit();
})();
</script>
</body>
</html>
