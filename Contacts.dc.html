<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const q = ((this.state && this.state.q) || '').trim().toLowerCase();
const T = (n) => ({ txt: n, href: 'tel:' + n.replace(/[^0-9+]/g, ''), link: true, plain: false });
const M = (e) => ({ txt: e, href: 'mailto:' + e, link: true, plain: false });
const P = (t) => ({ txt: t, href: '', link: false, plain: true });
const all = [
{ t: 'Приёмная комиссия', key: 'поступление абитуриент приём документы', rows: [T('+7 (343) 375-44-74'), P('620062, Екатеринбург, ул. Мира, 19, каб. ГУК-100')] },
{ t: 'Пресс-служба', key: 'сми журналисты новости', rows: [T('+7 (343) 375-97-33'), M('news@urfu.ru')] },
{ t: 'Департамент по связям с общественностью', key: 'пресса сми общественность', rows: [T('+7 (343) 389-94-07'), T('+7 (343) 374-40-93')] },
{ t: 'Техподдержка', key: 'личный кабинет пароль почта сайт помощь', rows: [T('+7 (343) 227-20-70'), M('support@urfu.ru')] },
{ t: 'Реклама и партнёрство', key: 'партнёрам бизнес реклама сотрудничество', rows: [T('+7 (343) 375-93-53'), M('partner@urfu.ru')] },
{ t: 'Корреспонденция ректору', key: 'ректор письмо обращение', rows: [M('rector@urfu.ru')] },
{ t: 'Редакция портала', key: 'сайт ошибка опечатка', rows: [M('site@urfu.ru')] },
{ t: 'ИРИТ-РтФ, дирекция', key: 'институт радиоэлектроники информационных технологий ртф ирит', rows: [T('+7 (343) 375-97-00'), M('rtf@urfu.ru'), P('ул. Мира, 32')] }
];
const cards = all.filter(c => !q || (c.t + ' ' + c.key).toLowerCase().includes(q));
return { q, cards, none: cards.length === 0, onQ: (e) => this.setState({ q: e.target.value }) };
}
}
</script>
