<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const q = (this.state && this.state.q) || '';
const words = q.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 3);
const QUICK = [
{t:'Programs in English', kind:'Section', href:'CatalogEn.dc.html', key:'programs degree bachelor master english catalog'},
{t:'How to apply', kind:'Section', href:'AdmissionEn.dc.html', key:'apply admission documents deadline visa'},
{t:'Housing', kind:'Section', href:'Dorms.dc.html', key:'housing dormitory dorm accommodation'},
{t:'Timetable', kind:'Service', href:'Schedule.dc.html', key:'timetable schedule classes'},
{t:'Campus map', kind:'Section', href:'Contacts.dc.html', key:'campus map contacts address'},
{t:'Clubs and sports', kind:'Section', href:'Life.dc.html', key:'clubs sports student life'},
{t:'Events calendar', kind:'Section', href:'Events.dc.html', key:'events open day lecture calendar'}
];
const sug = words.length ? QUICK.map(k => ({t:k.t, kind:k.kind, href:k.href, h:words.filter(w => (k.t + ' ' + k.key).toLowerCase().includes(w)).length}))
  .filter(x => x.h > 0).sort((a, b) => b.h - a.h).slice(0, 6) : [];
const role = (this.state && this.state.role) || 'intl';
const sets = {
abit: [
{t:'Programme catalogue', d:'Filters, exams and pass marks', href:'CatalogEn.dc.html'},
{t:'How to apply', d:'Steps, documents and deadlines', href:'AdmissionEn.dc.html'},
{t:'Housing', d:'Dormitories on campus', href:'Dorms.dc.html'},
{t:'Campus map', d:'Buildings and contacts', href:'Contacts.dc.html'},
{t:'Open days', d:'Meet the institutes', href:'Events.dc.html'},
{t:'Contact us', d:'Admissions office', href:'Contacts.dc.html'}],
student: [
{t:'Timetable', d:'Today and this week', href:'Schedule.dc.html'},
{t:'Personal account', d:'Grades, certificates, scholarship', href:'LoginEn.dc.html'},
{t:'Events', d:'Lectures, contests, career fairs', href:'Events.dc.html'},
{t:'Find a teacher', d:'Department, e-mail, office hours', href:'Person.dc.html'},
{t:'Clubs and sports', d:'Find your people', href:'Life.dc.html'},
{t:'Campus map', d:'Buildings and rooms', href:'Contacts.dc.html'}],
staff: [
{t:'News', d:'What is happening at UrFU', href:'News.dc.html'},
{t:'Find a colleague', d:'Staff search', href:'Search.dc.html'},
{t:'Institutes', d:'Structure and units', href:'Institute.dc.html'},
{t:'Events', d:'University calendar', href:'Events.dc.html'},
{t:'Contacts', d:'Phones and addresses', href:'Contacts.dc.html'},
{t:'Services', d:'Mail, documents, staff account', href:'LoginEn.dc.html?role=staff'}],
intl: [
{t:'Programme catalogue', d:'Filters, exams and pass marks', href:'CatalogEn.dc.html'},
{t:'Visa and arrival', d:'What to do before you come', href:'AdmissionEn.dc.html'},
{t:'Housing', d:'Dormitories for international students', href:'Dorms.dc.html'},
{t:'Adaptation', d:'Buddy program and events', href:'Life.dc.html'},
{t:'Campus map', d:'Buildings and contacts', href:'Contacts.dc.html'},
{t:'International office', d:'Contact us', href:'Contacts.dc.html'}]
};
const list = [['abit','Applicant'],['student','Student'],['staff','Staff'],['intl','International']];
const ME = {abit:'I’m applying', student:'I’m a student', staff:'I work at UrFU', intl:'International students'};
const openG = (this.state && this.state.openG) || {};
const gems = list.map(([k]) => {
  const all = sets[k], ex = !!openG[k];
  return { key: k, me: ME[k], lang: 'en', hid: 'gem-' + k, bid: 'gem-b-' + k,
    links: ex ? all : all.slice(0, 3), exp: String(ex), more: ex ? 'Show less' : 'Show 3 more',
    toggle: () => this.setState({ openG: { ...openG, [k]: !ex } }) };
});
const NOW = new Date(); const Y0 = NOW.getFullYear();
let target = new Date(Y0, 5, 20); if (NOW > new Date(Y0, 7, 20)) target = new Date(Y0 + 1, 5, 20);
const days = Math.max(0, Math.ceil((target - new Date(Y0, NOW.getMonth(), NOW.getDate())) / 864e5));
const daysWord = days === 1 ? 'Day left' : 'Days left';
const qHref = 'Search.dc.html' + (q.trim() ? '?q=' + encodeURIComponent(q.trim()) : '');
return { qHref, gems, days, daysWord,
q, onQ: (e) => this.setState({ q: e.target.value }), open: q.trim().length >= 2, sug, none: q.trim().length >= 2 && sug.length === 0,
roleKey: role,
roles: list.map(([k, label]) => ({ label, pressed: k === role ? 'true' : 'false', pick: () => this.setState({ role: k }) })),
links: sets[role].map((l, i) => Object.assign({ n: '0' + (i + 1) }, l))
};
}
}
</script>
