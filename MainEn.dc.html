<style>
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Bold.ttf') format('truetype');font-weight:700;font-display:swap}

<style>
body{margin:0;background:#FFFFFF;color:#0E1B2B;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:#1D4E9E}a:hover{color:#163B78}
*{box-sizing:border-box}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.hd{border-bottom:1px solid #E1E5EA;background:rgba(255,255,255,0.94);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.hd-in{display:flex;align-items:center;gap:24px;min-height:72px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#0E1B2B;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:20px}
.brand:hover{color:#0E1B2B}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav a{color:#0E1B2B;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:500;min-height:44px;display:inline-flex;align-items:center}
.nav a:hover{background:#EEF1F4;color:#0E1B2B}
.nav a.on{color:#1D4E9E;background:#E8EEF7}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:6px;background:#1D4E9E;color:#FFFFFF;text-decoration:none;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#163B78;color:#FFFFFF}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:6px;background:#FFFFFF;color:#0E1B2B;text-decoration:none;border:1px solid #C5CCD4;font:inherit;font-weight:600;cursor:pointer}
.btn2:hover{border-color:#1D4E9E;color:#1D4E9E}
.ico{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:#0E1B2B;text-decoration:none}
.ico:hover{background:#EEF1F4;color:#0E1B2B}
h1,h2,h3{font-family:'IBM Plex Sans',sans-serif;font-weight:600;line-height:1.15;margin:0;letter-spacing:-0.015em}
.hero-art{position:absolute;right:32px;bottom:0;width:520px;height:340px;pointer-events:none}
@media (max-width:1100px){.hero-art{display:none}}
h2{font-size:32px}h3{font-size:20px}
p{margin:0}
.crumbs{font-size:14px;color:#56606B;padding:24px 0 12px}.crumbs a{color:#56606B}
.sec{padding:64px 0 0}
.card{border:1px solid #E1E5EA;border-radius:8px;padding:24px;background:#FFFFFF}
a.card{display:block;text-decoration:none;color:#0E1B2B}
a.card{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
a.card:hover{border-color:#1D4E9E;color:#0E1B2B;transform:translateY(-3px);box-shadow:0 10px 24px rgba(14,27,43,0.08)}
.btn,.btn2,.chip,.nav a{transition:background .15s ease,color .15s ease,border-color .15s ease}
:focus-visible{outline:3px solid #1D4E9E;outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:4px 10px;border-radius:4px;background:#EEF1F4;font-size:13px;font-weight:500;color:#0E1B2B}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:4px;border:1px solid #C5CCD4;background:#FFFFFF;font:inherit;font-size:15px;font-weight:500;color:#0E1B2B;cursor:pointer;text-decoration:none}
.chip.on{background:#0E1B2B;color:#FFFFFF;border-color:#0E1B2B}
.muted{color:#56606B}
.ph{background:#DDE3E9;border-radius:8px;display:flex;align-items:flex-end;padding:16px;color:#3E4853;font-size:13px;font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.row{display:flex;gap:32px;flex-wrap:wrap}
.main{flex:999 1 560px;min-width:0}
.side{flex:1 1 300px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.input{min-height:48px;border-radius:6px;border:1px solid #C5CCD4;padding:0 16px;font:inherit;font-size:16px;background:#FFFFFF;color:#0E1B2B}
.sr{position:absolute;left:-9999px}
details{border-bottom:1px solid #E1E5EA;padding:18px 0}
summary{cursor:pointer;font-weight:600;font-size:18px}
.ft{background:#0E1B2B;color:#C9D1DA;margin-top:96px;padding:56px 0 40px;font-size:15px}
.ft a{color:#FFFFFF;text-decoration:none}.ft a:hover{text-decoration:underline}
.ft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.ft-col{display:flex;flex-direction:column;gap:10px}
.ft-h{color:#FFFFFF;font-weight:600;margin-bottom:4px}
.skip{position:absolute;left:16px;top:-60px;z-index:50;background:#1D4E9E;color:#FFFFFF;padding:12px 18px;border-radius:4px;font-weight:600;text-decoration:none}
.skip:focus{top:12px;color:#FFFFFF}
.a11y-cb{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#a11y:checked ~ main{zoom:1.22}
#a11y:checked ~ main .muted,#a11y:checked ~ main .crumbs,#a11y:checked ~ main .crumbs a{color:#0E1B2B !important}
#a11y:checked ~ main .ph{filter:grayscale(1)}
#a11y:checked ~ main a{text-decoration:underline}
#a11y:checked ~ header .a11y-lbl{background:#0E1B2B;color:#FFFFFF}
#a11y:focus-visible ~ header .a11y-lbl{outline:3px solid #1D4E9E;outline-offset:2px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#FFFFFF;color:#0E1B2B;border-radius:8px;box-shadow:0 16px 40px rgba(14,27,43,0.28);overflow:hidden;z-index:30;text-align:left}
.sug a{display:flex;justify-content:space-between;gap:16px;padding:12px 18px;text-decoration:none;color:#0E1B2B;border-bottom:1px solid #EEF1F4;align-items:center}
.sug a:hover{background:#E8EEF7;color:#0E1B2B}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.ft-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.wrap{padding:0 16px}.nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto}.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.big{font-size:32px !important}h2{font-size:24px}}
</style>
