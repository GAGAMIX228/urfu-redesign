<h1 class="big" style="font-size:48px">Programme catalogue</h1>
<p class="muted" style="margin-top:12px;font-size:18px">Tick your Unified State Exam (EGE) subjects and enter your score — we will show where you can apply. International applicants may take UrFU entrance tests instead of the EGE.</p>
</div></section><div class="wrap">
<div class="row" style="margin-top:40px;align-items:flex-start">
<aside class="side" style="flex:1 1 280px;max-width:320px;display:flex;flex-direction:column;gap:24px">
<div class="field"><label for="cq">Programme name</label><input autocomplete="off" type="search" id="cq" name="cq" class="input" placeholder="e.g. design…" value="{{q}}" onChange="{{onQ}}"></div>
<div><div style="font-weight:600;margin-bottom:10px">Level</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{levels}}" as="v" hint-placeholder-count="3">
<sc-if value="{{v.on}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{v.pick}}">{{v.label}}</button></sc-if>
<sc-if value="{{v.off}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{v.pick}}">{{v.label}}</button></sc-if>
</sc-for>
</div>
<p class="muted" style="font-size:13px;margin-top:8px;line-height:1.45">The catalogue lists Bachelor's programmes: you apply after school, study usually takes 4 years.</p></div>
<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:10px;padding:0">My EGE subjects</legend>
<div style="display:flex;flex-direction:column;gap:4px">
<sc-for list="{{subjects}}" as="sj" hint-placeholder-count="10">
<label for="{{sj.id}}" style="display:flex;gap:10px;align-items:center;min-height:36px;cursor:pointer"><input id="{{sj.id}}" type="checkbox" checked="{{sj.on}}" onChange="{{sj.toggle}}" style="width:20px;height:20px;accent-color:var(--blue)">{{sj.label}}</label>
</sc-for>
</div></fieldset>
<div class="field"><label for="sc">My total score</label><input autocomplete="off" id="sc" name="sc" class="input" inputmode="numeric" placeholder="e.g. 240…" value="{{my}}" onChange="{{onMy}}"><span class="muted" style="font-weight:400;font-size:13px">Compared with the 2025 pass mark</span></div>
<button class="btn2" onClick="{{reset}}">Reset filters</button>
</aside>
<div class="main">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6">
<sc-if value="{{a.on}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{a.pick}}">{{a.label}}</button></sc-if>
<sc-if value="{{a.off}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{a.pick}}">{{a.label}}</button></sc-if>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:8px"><b aria-live="polite">Found: {{count}}</b><span class="muted" style="font-size:14px">Where your score is enough comes first</span></div>
<sc-if value="{{showCmp}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="Compare programmes" style="position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(14,27,43,0.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px">
<div class="card" style="padding:0;overflow:auto;border-color:var(--blue);width:100%;max-width:1040px;max-height:90vh">
<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--blue-soft)"><b style="font-size:18px">Compare programmes</b><button class="btn2" data-close onClick="{{hideCmp}}" style="min-height:40px">Close</button></div>
<div style="overflow-x:auto">
<div style="display:grid;grid-template-columns:{{cmpGrid}};min-width:640px;font-size:15px"><div style="padding:14px 20px"></div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:14px 20px"><a href="{{c.href}}" style="color:var(--ink);text-decoration:none;font-weight:600">{{c.name}}</a><div><button onClick="{{c.remove}}" style="border:0;background:none;padding:6px 0 0;color:var(--copper);font:inherit;font-size:13px;cursor:pointer">Remove</button></div></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Pass mark 2025</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.score}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">State-funded places</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.budget}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Tuition per year</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.price}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">EGE exams</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.exams}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Institute</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.inst}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Field</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.area}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">My score</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.verdict}}</div></sc-for></div></div></div></div>
</sc-if>
<sc-if value="{{hasTipMore}}" hint-placeholder-val="{{false}}"><p class="muted" style="font-size:14px;margin-top:8px">{{tip}}</p></sc-if>
<sc-if value="{{emptyBach}}" hint-placeholder-val="{{false}}"><div class="card" style="margin-top:16px;text-align:center;padding:40px"><div style="font-weight:600;font-size:18px">No programmes match these subjects</div><sc-if value="{{hasTip}}" hint-placeholder-val="{{false}}"><p style="margin-top:8px;color:var(--blue);font-weight:600">{{tip}}</p></sc-if><p class="muted" style="margin-top:8px">Tick another subject, change the field or reset the filters.</p><button class="btn2" onClick="{{reset}}" style="margin-top:16px">Reset filters</button></div></sc-if>
<sc-if value="{{notBach}}" hint-placeholder-val="{{false}}"><div class="card" style="margin-top:16px;text-align:center;padding:40px"><div style="font-weight:600;font-size:18px">The prototype shows Bachelor's programmes</div><p class="muted" style="margin-top:8px">Specialist and Master's programmes use the same catalogue with other filters.</p><button class="btn2" onClick="{{reset}}" style="margin-top:16px">Back to Bachelor's</button></div></sc-if>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
<sc-for list="{{progs}}" as="p" hint-placeholder-count="5">
<div class="card pc">
<div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag" style="background:#FFFFFF;border:1px solid var(--line)" title="{{p.instFull}}">{{p.instL}}</span></div>
<a href="{{p.href}}" style="display:block;font-weight:600;font-size:20px;margin-top:12px;color:var(--ink);text-decoration:none">{{p.name}}</a>
<div class="muted" style="font-size:14px;margin-top:6px">EGE: {{p.exams}}</div>
<sc-if value="{{p.ok}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px;background:var(--blue-soft);color:var(--blue-dark)">Your score is enough</span></sc-if>
<sc-if value="{{p.short}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px;background:var(--bg-soft);color:#7A3B14">{{p.gap}} points short</span></sc-if>
<sc-if value="{{p.nodata}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px">Pass mark to be confirmed</span></sc-if>
<div class="pc-cmp">
<sc-if value="{{p.inCmp}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{p.toggle}}" aria-pressed="true">✓ Comparing</button></sc-if>
<sc-if value="{{p.canAdd}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{p.toggle}}" aria-pressed="false">+ Compare</button></sc-if>
<sc-if value="{{p.blocked}}" hint-placeholder-val="{{false}}"><span class="muted" style="font-size:13px">Compare up to 3</span></sc-if>
</div></div>
<div class="pc-s">
<sc-if value="{{p.hasS}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">Pass mark {{p.sy}}</div><div style="font-weight:600;font-size:18px">{{p.score}}</div></div></sc-if>
<sc-if value="{{p.hasB}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">State-funded places</div><div style="font-weight:600;font-size:18px">{{p.budget}}</div></div></sc-if>
<sc-if value="{{p.hasP}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">Per year</div><div style="font-weight:600;font-size:18px">{{p.price}}</div></div></sc-if>

</div>
</sc-for>
</div>
<sc-if value="{{hasCmp}}" hint-placeholder-val="{{false}}">
<div style="position:sticky;bottom:16px;margin-top:20px;background:var(--ink);color:#FFFFFF;border-radius:8px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(14,27,43,0.3)">
<span>Selected to compare: <b>{{cmpCount}} of 3</b></span>
<div style="display:flex;gap:8px"><button onClick="{{clearCmp}}" style="min-height:44px;padding:0 16px;border-radius:6px;border:1px solid #3A4E66;background:transparent;color:#FFFFFF;font:inherit;cursor:pointer">Clear</button><button class="btn" onClick="{{openCmp}}" style="background:#FFFFFF;color:var(--ink)">Compare</button></div>
</div>
</sc-if>

</div>
</div>
</div>

const togg = (name) => { const has = cmp.includes(name); const next = has ? cmp.filter(x => x !== name) : (full ? cmp : cmp.concat(name)); this.setState({ cmp: next, show: next.length ? s.show : false }); };
const SUBJ = [['rus','Russian'],['math','Mathematics'],['inf','Computer Science'],['phys','Physics'],['chem','Chemistry'],['bio','Biology'],['soc','Social Studies'],['hist','History'],['lit','Literature'],['lang','Foreign language']];
const NAME = {}; SUBJ.forEach(([k, n]) => { NAME[k] = n; });
const ACC = {math:'mathematics', inf:'computer science', phys:'physics', chem:'chemistry', bio:'biology', soc:'social studies', hist:'history', lit:'literature', lang:'a foreign language', rus:'Russian'};
const missing = p => { const m = p.req.filter(r => !sel[r]); p.ch.forEach(g => { if (!g.some(x => sel[x])) m.push(g[0]); }); return m; };
const areas = [['all','All'],['it','IT'],['eng','Engineering'],['nat','Natural sciences'],['hum','Humanities'],['eco','Economics']];
const levels = [['bach','Bachelor']];
const st = stems(q);
const myN = parseInt(my, 10);
const hasMy = !isNaN(myN) && myN > 0;
const IL = {'IRIT-RTF':['Radio electronics and IT','Institute of Radioelectronics and Information Technologies — RTF'],'INSM':['Natural sciences and mathematics','Institute of Natural Sciences and Mathematics'],'INMT':['New materials and technologies','Institute of New Materials and Technologies'],'UralENIN':['Power engineering','Ural Power Engineering Institute'],'ICEA':['Civil engineering and architecture','Institute of Civil Engineering and Architecture'],'UIH':['Humanities','Ural Institute of Humanities'],'GSEM':['Economics and management','Graduate School of Economics and Management'],'IPT':['Physics and technology','Institute of Physics and Technology']};
const base = ALL_PROGS
 .filter(p => area === 'all' || p.k === area)
 .map(p => ({ score: '—', budget: '—', price: '—', sy: '2025', ...p, hit: st.filter(x => p.name.toLowerCase().includes(x)).length }))
 .filter(p => !st.length || p.hit > 0);
const eligible = level === 'bach' ? base.filter(p => missing(p).length === 0) : [];
const tally = {};
if (level === 'bach') base.forEach(p => { const m = missing(p); if (m.length === 1) tally[m[0]] = (tally[m[0]] || 0) + 1; });
let tip = '';
const best = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
if (best) { const c = tally[best]; tip = 'Add ' + ACC[best] + ' to open ' + c + ' more programme' + (c === 1 ? '' : 's') + '.'; }
const progs = eligible.map(p => {
 const sc = parseInt(p.score, 10);
 const known = !isNaN(sc);
 const ok = hasMy && known && myN >= sc;
 const short = hasMy && known && myN < sc;
 return { ...p, hasS: known, hasB: p.budget !== '—', hasP: p.price !== '—', instL: (IL[p.inst] || [p.inst])[0], instFull: (IL[p.inst] || [p.inst, p.inst])[1], href: 'Program.dc.html?p=' + encodeURIComponent(p.name), ok, short, nodata: hasMy && !known, gap: known ? sc - myN : 0, rank: ok ? 0 : (hasMy && !known ? 1 : 2), inCmp: cmp.includes(p.name), canAdd: !cmp.includes(p.name) && !full, blocked: !cmp.includes(p.name) && full, toggle: () => togg(p.name) };
}).sort((a, b) => (hasMy ? a.rank - b.rank : 0) || b.hit - a.hit);
const n = progs.length, m10 = n % 10, m100 = n % 100;
const word = n === 1 ? 'programme' : 'programmes';
const cmpCols = cmp.map(name => {
 const p0 = { score: '—', budget: '—', price: '—', sy: '2025', ...ALL_PROGS.find(x => x.name === name) };
 const p = { ...p0, score: p0.sy !== '2025' && p0.score !== '—' ? p0.score + ' (' + p0.sy + ')' : p0.score };
 const sc = parseInt(p.score, 10);
 const verdict = !hasMy ? 'Enter your score' : (isNaN(sc) ? 'Pass mark TBC' : (myN >= sc ? 'Enough' : (sc - myN) + ' points short'));
 return { ...p, verdict, href: 'Program.dc.html?p=' + encodeURIComponent(name), remove: () => togg(name) };
});
return {
cmpGrid: '180px repeat(' + Math.max(1, cmp.length) + ', minmax(180px, 1fr))', cmpCols, hasCmp: cmp.length > 0, cmpCount: cmp.length, showCmp: !!s.show && cmp.length > 0,
openCmp: () => this.setState({ show: true }), hideCmp: () => this.setState({ show: false }), clearCmp: () => this.setState({ cmp: [], show: false }),
areas: areas.map(([k,label]) => ({label, on:k===area, off:k!==area, pick:() => this.setState({area:k})})),
levels: levels.map(([k,label]) => ({label, on:k===level, off:k!==level, pick:() => this.setState({level:k})})),
subjects: SUBJ.map(([k, label]) => ({ k, label, id: 'subj-' + k, on: !!sel[k], toggle: () => this.setState({ sel: { ...sel, [k]: !sel[k] } }) })),
progs,
count: n + ' ' + word,
empty: n === 0,
notBach: level !== 'bach',
emptyBach: n === 0 && level === 'bach',
tip, hasTip: n === 0 && level === 'bach' && !!tip, hasTipMore: n > 0 && !!tip,
q, my,
onQ: (e) => this.setState({ q: e.target.value }),
onMy: (e) => this.setState({ my: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
reset: () => this.setState({ q: '', area: 'all', sel: { rus: true, math: true, inf: true }, my: '', level: 'bach' })
};
}
}
