<div style="margin-top:24px;display:flex;flex-direction:column">

<div style="display:flex;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)"><div style="min-width:120px;font-weight:600;color:var(--copper)">25 июля</div><div>Окончание приёма на бюджет по результатам ЕГЭ</div></div>
<div style="display:flex;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)"><div style="min-width:120px;font-weight:600;color:var(--copper)">20 августа</div><div>Окончание приёма на договор</div></div>
<div style="display:flex;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)"><div style="min-width:120px;font-weight:600;color:var(--copper)">Начало августа</div><div>Приказы о зачислении на бюджет</div></div>
</div>
<h2 style="margin-top:56px">Частые вопросы</h2>
<div style="margin-top:12px">
<details><summary>Можно ли подать документы онлайн?</summary><p class="muted" style="margin-top:12px">Да: через Госуслуги или личный кабинет абитуриента. Ещё можно лично в приёмной комиссии или почтой: 620062, Екатеринбург, ул. Мира, 19.</p></details>
<details><summary>Сколько направлений можно выбрать?</summary><p class="muted" style="margin-top:12px">До пяти направлений подготовки в одном вузе — и не больше пяти вузов. Внутри выбранных направлений вы расставляете приоритеты: какая программа важнее.</p></details>
<details><summary>Как учитываются индивидуальные достижения?</summary><p class="muted" style="margin-top:12px">Они добавляют баллы к сумме ЕГЭ. Например, аттестат с отличием — 6 баллов, волонтёрство — 2, золотой значок ГТО — 1.</p></details>
<details><summary>Когда дают общежитие?</summary><p class="muted" style="margin-top:12px">Место получают все иногородние первокурсники, которые отметили потребность в общежитии при подаче документов. <a href="Dorms.dc.html">Подробнее об общежитиях</a></p></details>
</div>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const i = (this.state && this.state.i) || 0;
/* чек-лист документов: запоминается в браузере */
const DOCS = ['Паспорт', 'Аттестат или диплом', 'СНИЛС', 'Документы об индивидуальных достижениях', 'Документы на особые права, если есть'];
let saved = this.state && this.state.docs;
if (!saved) { try { saved = JSON.parse(localStorage.getItem('urfu-docs') || '[]'); } catch (e) { saved = []; } }
const setDocs = v => { try { localStorage.setItem('urfu-docs', JSON.stringify(v)); } catch (e) {} this.setState({ docs: v }); };
const docs = DOCS.map((t, k) => ({ t, on: saved.includes(k), toggle: () => setDocs(saved.includes(k) ? saved.filter(x => x !== k) : saved.concat(k)) }));
const docDone = docs.filter(d => d.on).length;
/* отсчёт до начала приёма: 20 июня по правилам 2026 года */
const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
let start = new Date(today.getFullYear(), 5, 20); if (today > new Date(today.getFullYear(), 7, 20)) start = new Date(today.getFullYear() + 1, 5, 20);
const days = Math.round((start - today) / 86400000);
const dw = n => (n % 10 === 1 && n % 100 !== 11) ? 'день' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'дня' : 'дней';
const going = days <= 0;
const data = [
{t:'Выберите программы', d:'Ответьте на 3 вопроса — покажем программы, куда вы проходите по своим ЕГЭ и баллам. Или откройте каталог и сравните программы между собой.', cta:'Подобрать за 3 вопроса', href:'Quiz.dc.html'},
{t:'Подайте документы', d:'Заявление подаётся онлайн через Госуслуги или личный кабинет абитуриента. Проверьте чек-лист документов справа.', cta:'Чек-лист документов', href:'#docs'},
{t:'Следите за списками', d:'Конкурсные списки обновляются каждый день. Ваше место в списке видно в личном кабинете.', cta:'Конкурсные списки', href:'NotFound.dc.html'},
{t:'Подайте согласие', d:'Подтвердите, на какую программу хотите поступить, до даты окончания приёма согласий.', cta:'Как подать согласие', href:'NotFound.dc.html'},
{t:'Зачисление и заселение', d:'После приказа о зачислении — заселение в общежитие и знакомство с институтом.', cta:'Об общежитиях', href:'Dorms.dc.html'}
];
const steps = data.map((s, k) => ({ n: k + 1, t: s.t, on: k === i, off: k !== i, pick: () => this.setState({ i: k }) }));
const c = data[i];
return { docs, docDone, docTotal: DOCS.length, docPct: Math.round(docDone / DOCS.length * 100),
cdNum: going ? '✓' : String(days), cdTitle: going ? 'Приём документов идёт' : dw(days) + ' до начала приёма документов',
cdNote: going ? 'Подайте заявление через Госуслуги или личный кабинет абитуриента.' : '20 июня ' + start.getFullYear() + ' — по правилам приёма 2026 года; точная дата появится весной.',
steps, cur: { n: i + 1, t: c.t, d: c.d, cta: c.cta, href: c.href }, next: () => this.setState({ i: (i + 1) % 5 }) };
}
}

</script>
