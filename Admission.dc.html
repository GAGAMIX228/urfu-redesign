<h1 class="big" style="font-size:52px">Как поступить в УрФУ</h1>
<p class="muted" style="margin-top:12px;font-size:19px;max-width:720px">Пять шагов от выбора программы до заселения. Нажмите на шаг, чтобы увидеть подробности.</p>
</div></section><div class="wrap">
<div class="countdown" aria-live="polite"><div class="cd-n num">{{cdNum}}</div><div><div class="cd-t">{{cdTitle}}</div><div class="cd-d">{{cdNote}}</div></div><a class="btn" href="Quiz.dc.html">Подобрать программу</a></div>
<ol style="list-style:none;padding:0;margin:40px 0 0;display:flex;flex-wrap:wrap;gap:12px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<li style="flex:1 1 180px">
<sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><button class="stp stp-on" aria-current="step" onClick="{{s.pick}}"><b>{{s.n}}</b><span>{{s.t}}</span></button></sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{true}}"><button class="stp" onClick="{{s.pick}}"><b>{{s.n}}</b><span>{{s.t}}</span></button></sc-if>
</li>
</sc-for>
</ol>
<div class="card" style="margin-top:16px;padding:40px;display:flex;gap:40px;flex-wrap:wrap">
<div style="flex:2 1 420px"><span class="tag">Шаг {{cur.n}} из 5</span><h2 style="margin-top:16px">{{cur.t}}</h2><p style="margin-top:16px;font-size:18px;color:#2B3946">{{cur.d}}</p></div>
<div style="flex:1 1 260px;display:flex;flex-direction:column;gap:10px;justify-content:center"><a class="btn" href="{{cur.href}}">{{cur.cta}}</a><button class="btn2" onClick="{{next}}">Следующий шаг</button></div>
</div>
<div class="row" style="margin-top:64px;align-items:flex-start">
<div class="main">
<h2>Частые вопросы</h2>
<div style="margin-top:12px">
<details><summary>Можно ли подать документы онлайн?</summary><p class="muted" style="margin-top:12px">Да: через Госуслуги или личный кабинет абитуриента. Ещё можно лично в приёмной комиссии или почтой: 620062, Екатеринбург, ул. Мира, 19.</p></details>
<details><summary>Сколько направлений можно выбрать?</summary><p class="muted" style="margin-top:12px">До пяти направлений подготовки в одном вузе — и не больше пяти вузов. Внутри выбранных направлений вы расставляете приоритеты: какая программа важнее.</p></details>
<details><summary>Как учитываются индивидуальные достижения?</summary><p class="muted" style="margin-top:12px">Они добавляют баллы к сумме ЕГЭ. Например, аттестат с отличием — 6 баллов, волонтёрство — 2, золотой значок ГТО — 1.</p></details>
<details><summary>Когда дают общежитие?</summary><p class="muted" style="margin-top:12px">Место получают все иногородние первокурсники, которые отметили потребность в общежитии при подаче документов. <a href="Dorms.dc.html">Подробнее об общежитиях</a></p></details>
</div>
</div>
<aside id="docs" class="side card" style="display:flex;flex-direction:column;gap:14px">
<h3>Мой план: документы</h3>

<section id="calendar" class="adm-sec" aria-labelledby="cal-h">
<h2 id="cal-h">Календарь приёма</h2>
<p class="muted adm-lead">Даты приёма-2026 в бакалавриат и специалитет. Правила следующего года УрФУ публикует зимой: на приём-2026 — до 20 января. Сроки от года к году меняются мало.</p>
<div class="tl-cols">
<div class="tl-col tl-b"><h3>На бюджет</h3><ol class="tl"><li><span class="tl-d">20 июня</span><b>Старт приёма документов</b><span class="tl-n">Через Госуслуги, личный кабинет абитуриента или лично.</span></li><li><span class="tl-d">1–23 июля</span><b>Экзамены УрФУ</b><span class="tl-n">Тесты для тех, кому можно сдавать их вместо ЕГЭ (например, после колледжа), и творческие экзамены.</span></li><li><span class="tl-d">15 июля</span><b>Конец подачи с экзаменами УрФУ</b><span class="tl-n">И для творческих направлений: журналистика, дизайн, архитектура, спорт и другие.</span></li><li><span class="tl-d">25 июля</span><b>Конец подачи по ЕГЭ</b><span class="tl-n">До 17:00 по Екатеринбургу.</span></li><li><span class="tl-d">1 августа</span><b>Согласие: квоты и без экзаменов</b><span class="tl-n">Приоритетный этап — особая, отдельная и целевая квоты, олимпиадники. Приказ 3 августа.</span></li><li><span class="tl-d">5 августа</span><b>Согласие: основной этап</b><span class="tl-n">До 14:00. Приказ о зачислении — 7 августа.</span></li><li><span class="tl-d">9 августа</span><b>Согласие: дополнительный этап</b><span class="tl-n">На оставшиеся места. Приказ — 11 августа.</span></li></ol></div>
<div class="tl-col tl-p"><h3>На платное</h3><ol class="tl"><li><span class="tl-d">20 июня – 20 августа</span><b>Приём документов по ЕГЭ</b><span class="tl-n">С экзаменами УрФУ и на творческие направления — до 15 августа.</span></li><li><span class="tl-d">21 августа</span><b>Последний день договора</b><span class="tl-n">Договор об обучении нужно заключить до 17:00.</span></li><li><span class="tl-d">25 августа</span><b>Приказ о зачислении</b><span class="tl-n">На места с оплатой обучения.</span></li><li><span class="tl-d">1 сентября – 22 октября</span><b>Осенний набор</b><span class="tl-n">Дополнительный приём на платное: договор до 28 октября, приказ 30 октября.</span></li></ol></div>
</div>
<p class="muted adm-src">Источник: <a href="https://web.archive.org/web/20260831155039/https://urfu.ru/ru/applicant/docs-abiturient/kalendar-priema/" target="_blank" rel="noopener">календарь приёма УрФУ 2026<span class="sr"> (откроется в новой вкладке)</span></a>. Время — екатеринбургское.</p>
</section>

<section id="apply" class="adm-sec" aria-labelledby="apply-h">
<h2 id="apply-h">Как подать документы</h2>
<div class="g3 adm-ways">
<div class="card way"><span class="way-i" aria-hidden="true">1</span><h3>Через Госуслуги</h3><p class="muted">Сервис «Поступление в вуз онлайн»: заявление, документы и согласие — без поездки в Екатеринбург.</p></div>
<div class="card way"><span class="way-i" aria-hidden="true">2</span><h3>В личном кабинете абитуриента</h3><p class="muted">На сайте приёмной комиссии УрФУ. Там же видно своё место в конкурсных списках.</p></div>
<div class="card way"><span class="way-i" aria-hidden="true">3</span><h3>Лично</h3><p class="muted">Приёмная комиссия: Екатеринбург, ул. Мира, 19, аудитория ГУК-100. <a href="tel:+73433754474">+7 (343) 375-44-74</a>, <a href="mailto:priem@urfu.ru">priem@urfu.ru</a></p></div>
</div>
</section>

<section id="lists" class="adm-sec" aria-labelledby="lists-h">
<h2 id="lists-h">Списки и согласие — как это работает</h2>
<div class="g2 adm-two">
<div class="card"><h3>Конкурсные списки</h3><p class="muted">После подачи вы попадаете в список каждой выбранной программы. Списки обновляются каждый день, своё место видно в личном кабинете. Можно выбрать до 5 направлений и расставить программы по приоритету.</p>
<p style="margin-top:14px"><a href="Catalog.dc.html">Сравнить свою сумму с проходными баллами прошлых лет →</a></p></div>
<div class="card"><h3>Согласие на зачисление</h3><p class="muted">Согласие подтверждает, на какую программу вы идёте. Подайте его до 14:00 в день этапа: 1 августа — квоты и олимпиадники, 5 августа — основной этап, 9 августа — дополнительный. Без согласия на бюджет не зачисляют.</p>
<p style="margin-top:14px"><a href="#calendar">Смотреть даты этапов →</a></p></div>
</div>
<div class="card lf" role="search" aria-labelledby="lf-h">
<div class="lf-in"><h3 id="lf-h">Найди себя в списках</h3>
<p class="muted">В списках вместо фамилии — СНИЛС или уникальный код из личного кабинета абитуриента.</p>
<form class="lf-form" novalidate>
<label for="lf-c">СНИЛС или код</label><input id="lf-c" class="input" inputmode="numeric" autocomplete="off" placeholder="Например, 1234567" aria-describedby="lf-err">
<label for="lf-p">Программа</label><select id="lf-p" class="cost-sel"><option value="Алгоритмы искусственного интеллекта">Алгоритмы искусственного интеллекта</option><option value="Архитектура">Архитектура</option><option value="Журналистика">Журналистика</option><option value="Интеллектуальные системы в гуманитарной сфере">Интеллектуальные системы в гуманитарной сфере</option><option value="Информатика и вычислительная техника">Информатика и вычислительная техника</option><option value="Информационная безопасность">Информационная безопасность</option><option value="История">История</option><option value="Математика">Математика</option><option value="Международные отношения">Международные отношения</option><option value="Металлургия">Металлургия</option><option value="Прикладная информатика">Прикладная информатика</option><option value="Прикладная математика">Прикладная математика</option><option value="Прикладной искусственный интеллект">Прикладной искусственный интеллект</option><option value="Программная инженерия">Программная инженерия</option><option value="Радиотехника">Радиотехника</option><option value="Теплоэнергетика и теплотехника">Теплоэнергетика и теплотехника</option><option value="Физика">Физика</option><option value="Филология">Филология</option></select>
<button class="btn" type="submit">Найти</button>
<p id="lf-err" class="lf-err" role="alert"></p>
</form></div>
<div class="lf-out" aria-live="polite"><p class="lf-empty">Здесь появится ваше место в списке, баллы и подано ли согласие.</p></div>
</div>
<p class="muted adm-src">Это демо: ответ — пример того, как будет выглядеть поиск. Настоящие списки появятся с 20 июня, когда начнётся приём.</p>
</section>

<section id="benefits" class="adm-sec" aria-labelledby="ben-h">
<h2 id="ben-h">Особые права</h2>
<p class="muted adm-lead">Кому положены отдельные места или зачисление без экзаменов — по закону об образовании.</p>
<div class="g4 adm-ben">
<div class="card ben"><b>Без экзаменов</b><p class="muted">Победители и призёры заключительного этапа Всероссийской олимпиады школьников. Победителям и призёрам олимпиад из перечня — по решению вуза и по профилю программы.</p></div>
<div class="card ben"><b>Особая квота</b><p class="muted">Для детей-инвалидов, инвалидов I и II групп и с детства, детей-сирот. Не меньше 10% бюджетных мест.</p></div>
<div class="card ben"><b>Отдельная квота</b><p class="muted">Для участников специальной военной операции и их детей. Тоже не меньше 10% бюджетных мест.</p></div>
<div class="card ben"><b>Целевое обучение</b><p class="muted">Учёба бесплатно по договору с компанией или ведомством — и работа у него после выпуска. Конкурс отдельный.</p></div>
</div>
</section>

<section id="cost" class="adm-sec" aria-labelledby="cost-h">
<h2 id="cost-h">Сколько стоит платное</h2>

/* чек-лист документов: запоминается в браузере */
const DOCS = ['Паспорт', 'Аттестат или диплом', 'СНИЛС', 'Документы об индивидуальных достижениях', 'Документы о льготах, если есть'];
let saved = this.state && this.state.docs;
if (!saved) { try { saved = JSON.parse(localStorage.getItem('urfu-docs') || '[]'); } catch (e) { saved = []; } }
const setDocs = v => { try { localStorage.setItem('urfu-docs', JSON.stringify(v)); } catch (e) {} this.setState({ docs: v }); };
const docs = DOCS.map((t, k) => ({ t, on: saved.includes(k), toggle: () => setDocs(saved.includes(k) ? saved.filter(x => x !== k) : saved.concat(k)) }));
const docDone = docs.filter(d => d.on).length;
/* отсчёт до начала приёма: 20 июня по правилам 2026 года */
const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
let start = new Date(today.getFullYear(), 5, 20); if (today > new Date(today.getFullYear(), 7, 20)) start = new Date(today.getFullYear() + 1, 5, 20);
const days = Math.round((start - today) / 86400000);
const dw = n => (n % 10 === 1 && n % 100 !== 11) ? 'день' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'дня' : 'дней';
const going = days <= 0;
const data = [
{t:'Выберите программы', d:'Ответьте на 3 вопроса — покажем программы, куда вы проходите по своим ЕГЭ и баллам. Или откройте каталог и сравните программы между собой.', cta:'Подобрать за 3 вопроса', href:'Quiz.dc.html'},
{t:'Подайте документы', d:'Заявление подаётся онлайн через Госуслуги или личный кабинет абитуриента — или лично в приёмной комиссии. Проверьте чек-лист документов.', cta:'Способы подачи', href:'#apply'},
{t:'Следите за списками', d:'Конкурсные списки обновляются каждый день. Ваше место в списке видно в личном кабинете.', cta:'Как работают списки', href:'#lists'},
{t:'Подайте согласие', d:'Подтвердите, на какую программу хотите поступить, до даты окончания приёма согласий.', cta:'Даты согласия', href:'#calendar'},
{t:'Зачисление и заселение', d:'После приказа о зачислении — заселение в общежитие и знакомство с институтом.', cta:'Об общежитиях', href:'Dorms.dc.html'}
];
const steps = data.map((s, k) => ({ n: k + 1, t: s.t, on: k === i, off: k !== i, pick: () => this.setState({ i: k }) }));
const c = data[i];
return { docs, docDone, docTotal: DOCS.length, docPct: Math.round(docDone / DOCS.length * 100),
cdNum: going ? '✓' : String(days), cdTitle: going ? 'Приём документов идёт' : dw(days) + ' до начала приёма документов',
cdNote: going ? 'Подайте заявление через Госуслуги или личный кабинет абитуриента.' : '20 июня ' + start.getFullYear() + ' — по правилам приёма 2026 года; точная дата — в правилах приёма, их публикуют зимой.',
steps, cur: { n: i + 1, t: c.t, d: c.d, cta: c.cta, href: c.href }, next: () => this.setState({ i: (i + 1) % 5 }) };
}
}

</script>
