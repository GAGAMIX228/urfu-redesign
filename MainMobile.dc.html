<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Главная, телефон — УрФУ</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<style>
/* макет телефона: по центру на компьютере, на весь экран на телефоне */
body{background:var(--bg-soft);display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;margin:0}
.phone{width:390px;max-width:100%;height:844px;border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(14,27,43,.25);outline:1px solid var(--line)}
.phone-top{background:radial-gradient(420px 260px at 90% 0%,var(--hero-1),transparent 70%),radial-gradient(360px 260px at 0% 100%,var(--hero-2),transparent 70%),var(--ink) !important}
@media (max-width:480px){body{padding:0}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;outline:0}}
.mq{box-shadow:inset 0 3px 0 var(--c,var(--a1))}
div > .mq:nth-child(4n+2){--c:var(--a2)}div > .mq:nth-child(4n+3){--c:var(--a3)}div > .mq:nth-child(4n+4){--c:var(--a4)}
</style>
</head>
<body>
<template id="dc-tpl">
<div class="phone" style="background:#FFFFFF;display:flex;flex-direction:column;font-family:'IBM Plex Sans',sans-serif;color:var(--ink)">
<div style="flex:1;overflow-y:auto">
<div class="phone-top" style="color:#FFFFFF">
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px">
<a href="MainMobile.dc.html" style="display:flex;align-items:center;gap:8px;color:#FFFFFF;text-decoration:none;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:18px"><svg width="18" height="32" viewBox="0 0 35 62" aria-hidden="true"><defs><linearGradient id="gemM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A7AD6"></stop><stop offset=".5" stop-color="#5B8BDB"></stop><stop offset="1" stop-color="#3CCFA6"></stop></linearGradient></defs><path d="M1 2 H25 V4 H17 L33 35 C31 46 24 59 12 60 C10 60.2 8.8 59.3 9.4 58.1 C16 55.8 22.6 49 24.4 38.6 L6.2 4 H3.4 Z" fill="url(#gemM)"></path></svg>УрФУ</a>
<a href="Schedule.dc.html" style="color:#FFFFFF;font-size:14px;font-weight:600;text-decoration:none;min-height:44px;display:flex;align-items:center">Войти</a>
</div>
<div style="padding:12px 16px 28px">
<h1 style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:28px;line-height:1.15;margin:0;color:#FFFFFF">Найдите своё место в УрФУ</h1>
<div style="display:flex;gap:6px;margin-top:18px">
<label for="mq" style="position:absolute;left:-9999px">Поиск</label>
<input id="mq" placeholder="Программа, человек, событие" style="flex:1;min-height:48px;border-radius:6px;border:0;padding:0 14px;font:inherit;font-size:15px;min-width:0">
<a href="Search.dc.html" aria-label="Найти" style="width:48px;min-height:48px;border-radius:6px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:var(--ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></a>
</div>
</div>

</div>
<div style="padding:20px 16px">
<div style="font-weight:600;font-size:15px">Я —</div>
<div style="display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
<sc-if value="{{r.on}}" hint-placeholder-val="{{false}}"><button onClick="{{r.pick}}" style="flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#FFFFFF;font:inherit;font-size:14px;font-weight:500;cursor:pointer">{{r.label}}</button></sc-if>
<sc-if value="{{r.off}}" hint-placeholder-val="{{true}}"><button onClick="{{r.pick}}" style="flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:#FFFFFF;color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer">{{r.label}}</button></sc-if>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<a href="{{l.href}}" class="mq" style="border:1px solid var(--line);border-radius:8px;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--ink)"><span style="font-weight:600;font-size:15px">{{l.t}}</span><span style="font-size:12px;color:var(--muted)">{{l.d}}</span></a>
</sc-for>
</div>
<a href="Admission.dc.html" style="display:block;margin-top:16px;background:var(--blue-soft);border-radius:8px;padding:18px;text-decoration:none;color:var(--ink)"><span style="font-size:12px;font-weight:600;color:var(--blue)">ПРИЁМ 2027</span><div style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:18px;margin-top:6px">Поступление за 5 шагов</div><div style="font-size:14px;color:#2B3946;margin-top:4px">Старт приёма: 20 июня →</div></a>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px"><div style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:18px">Новости</div><a href="News.dc.html" style="font-size:14px">Все</a></div>
<a href="Article.dc.html" style="display:flex;gap:12px;margin-top:12px;text-decoration:none;color:var(--ink);align-items:center"><div style="width:84px;height:68px;border-radius:6px;background:var(--a1);flex:0 0 auto"></div><div><div style="font-size:12px;color:var(--muted)">Поступающим · июль 2026</div><div style="font-weight:600;font-size:15px">Почти 50 тысяч заявлений на бюджет</div></div></a>
<a href="Article.dc.html" style="display:flex;gap:12px;margin-top:12px;text-decoration:none;color:var(--ink);align-items:center"><div style="width:84px;height:68px;border-radius:6px;background:var(--a2);flex:0 0 auto"></div><div><div style="font-size:12px;color:var(--muted)">Наука · 2026</div><div style="font-weight:600;font-size:15px">Учёные УрФУ объяснили причину мужского бесплодия</div></div></a>
</div>
</div>
<nav aria-label="Нижнее меню" style="display:flex;background:#FFFFFF;border-top:1px solid var(--line);padding:6px 4px 10px">
<a href="MainMobile.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--blue);font-weight:600;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg>Главная</a>
<a href="Search.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Поиск</a>
<a href="Schedule.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Расписание</a>
<a href="Contacts.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Сервисы</a>
<a href="Institute.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Меню</a>
</nav>
</div>

</template>
<div id="dc-root"></div>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const role = (this.state && this.state.role) || 'abit';
const sets = {
abit: [
{t:'Каталог программ', d:'400+ программ с фильтром по ЕГЭ и баллам', href:'Catalog.dc.html'},
{t:'Как поступить', d:'5 шагов от выбора до зачисления', href:'Admission.dc.html'},
{t:'Проходные баллы', d:'Баллы и бюджетные места прошлых лет', href:'Catalog.dc.html'},
{t:'Общежития', d:'Адреса, цены и как получить место', href:'Dorms.dc.html'},
{t:'Дни открытых дверей', d:'Ближайшие встречи с институтами', href:'Events.dc.html'},
{t:'Задать вопрос', d:'Контакты приёмной комиссии', href:'Contacts.dc.html'}],
student: [
{t:'Расписание', d:'Пары на сегодня и на неделю', href:'Schedule.dc.html'},
{t:'Личный кабинет', d:'Оценки, справки, стипендия', href:'Schedule.dc.html'},
{t:'События', d:'Лекции, конкурсы, ярмарки вакансий', href:'Events.dc.html'},
{t:'Найти преподавателя', d:'Кафедра, почта, часы консультаций', href:'Person.dc.html'},
{t:'Общежития', d:'Заселение и правила', href:'Dorms.dc.html'},
{t:'Карта кампуса', d:'Корпуса и аудитории', href:'Contacts.dc.html'}],
staff: [
{t:'Новости', d:'Что происходит в университете', href:'News.dc.html'},
{t:'Найти коллегу', d:'Поиск по сотрудникам', href:'Search.dc.html'},
{t:'Институты', d:'Структура и подразделения', href:'Institute.dc.html'},
{t:'Мероприятия', d:'Календарь университета', href:'Events.dc.html'},
{t:'Контакты служб', d:'Телефоны и адреса', href:'Contacts.dc.html'},
{t:'Сервисы', d:'Почта, документы, ЛК сотрудника', href:'Schedule.dc.html'}],
intl: [
{t:'Programs in English', d:'Bachelor and Master programs', href:'Catalog.dc.html'},
{t:'How to apply', d:'Steps, documents and deadlines', href:'Admission.dc.html'},
{t:'Dormitories', d:'Housing for international students', href:'Dorms.dc.html'},
{t:'Campus map', d:'Buildings and contacts', href:'Contacts.dc.html'},
{t:'Events', d:'Adaptation and student life', href:'Events.dc.html'},
{t:'Contact us', d:'International office', href:'Contacts.dc.html'}]
};
const list = [['abit','Абитуриент'],['student','Студент'],['staff','Сотрудник'],['intl','Intl']];
return {
roles: list.map(([k, label]) => ({ label, on: k === role, off: k !== role, pick: () => this.setState({ role: k }) })),
links: sets[role].slice(0, 4)
};
}
}

</script>
<script src="dc-lite.js"></script>
<script src="site.js"></script>
</body>
</html>
