<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Главная, телефон — УрФУ</title>
<style>
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
</style>


<style>
body{margin:0;background:#FFFFFF;color:#0E1B2B;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:#1D4E9E}a:hover{color:#163B78}
*{box-sizing:border-box}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.hd{border-bottom:1px solid #E1E5EA;background:rgba(255,255,255,0.94);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.hd-in{display:flex;align-items:center;gap:24px;min-height:72px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#0E1B2B;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:20px}
.brand:hover{color:#0E1B2B}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav a{color:#0E1B2B;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:500;min-height:44px;display:inline-flex;align-items:center}
.nav a:hover{background:#EEF1F4;color:#0E1B2B}
.nav a.on{color:#1D4E9E;background:#E8EEF7}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:6px;background:#1D4E9E;color:#FFFFFF;text-decoration:none;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#163B78;color:#FFFFFF}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:6px;background:#FFFFFF;color:#0E1B2B;text-decoration:none;border:1px solid #C5CCD4;font:inherit;font-weight:600;cursor:pointer}
.btn2:hover{border-color:#1D4E9E;color:#1D4E9E}
.ico{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:#0E1B2B;text-decoration:none}
.ico:hover{background:#EEF1F4;color:#0E1B2B}
h1,h2,h3{font-family:'IBM Plex Sans',sans-serif;font-weight:600;line-height:1.15;margin:0;letter-spacing:-0.015em}
.hero-art{position:absolute;right:32px;bottom:0;width:520px;height:340px;pointer-events:none}
@media (max-width:1100px){.hero-art{display:none}}
h2{font-size:32px}h3{font-size:20px}
p{margin:0}
.crumbs{font-size:14px;color:#56606B;padding:24px 0 12px}.crumbs a{color:#56606B}
.sec{padding:64px 0 0}
.card{border:1px solid #E1E5EA;border-radius:8px;padding:24px;background:#FFFFFF}
a.card{display:block;text-decoration:none;color:#0E1B2B}
a.card{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
a.card:hover{border-color:#1D4E9E;color:#0E1B2B;transform:translateY(-3px);box-shadow:0 10px 24px rgba(14,27,43,0.08)}
.btn,.btn2,.chip,.nav a{transition:background .15s ease,color .15s ease,border-color .15s ease}
:focus-visible{outline:3px solid #1D4E9E;outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:4px 10px;border-radius:4px;background:#EEF1F4;font-size:13px;font-weight:500;color:#0E1B2B}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:4px;border:1px solid #C5CCD4;background:#FFFFFF;font:inherit;font-size:15px;font-weight:500;color:#0E1B2B;cursor:pointer;text-decoration:none}
.chip.on{background:#0E1B2B;color:#FFFFFF;border-color:#0E1B2B}
.muted{color:#56606B}
.ph{background:#DDE3E9;border-radius:8px;display:flex;align-items:flex-end;padding:16px;color:#3E4853;font-size:13px;font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.row{display:flex;gap:32px;flex-wrap:wrap}
.main{flex:999 1 560px;min-width:0}
.side{flex:1 1 300px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.input{min-height:48px;border-radius:6px;border:1px solid #C5CCD4;padding:0 16px;font:inherit;font-size:16px;background:#FFFFFF;color:#0E1B2B}
.sr{position:absolute;left:-9999px}
details{border-bottom:1px solid #E1E5EA;padding:18px 0}
summary{cursor:pointer;font-weight:600;font-size:18px}
.ft{background:#0E1B2B;color:#C9D1DA;margin-top:96px;padding:56px 0 40px;font-size:15px}
.ft a{color:#FFFFFF;text-decoration:none}.ft a:hover{text-decoration:underline}
.ft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.ft-col{display:flex;flex-direction:column;gap:10px}
.ft-h{color:#FFFFFF;font-weight:600;margin-bottom:4px}
.skip{position:absolute;left:16px;top:-60px;z-index:50;background:#1D4E9E;color:#FFFFFF;padding:12px 18px;border-radius:4px;font-weight:600;text-decoration:none}
.skip:focus{top:12px;color:#FFFFFF}
.a11y-cb{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#a11y:checked ~ main{zoom:1.22}
#a11y:checked ~ main .muted,#a11y:checked ~ main .crumbs,#a11y:checked ~ main .crumbs a{color:#0E1B2B !important}
#a11y:checked ~ main .ph{filter:grayscale(1)}
#a11y:checked ~ main a{text-decoration:underline}
#a11y:checked ~ header .a11y-lbl{background:#0E1B2B;color:#FFFFFF}
#a11y:focus-visible ~ header .a11y-lbl{outline:3px solid #1D4E9E;outline-offset:2px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#FFFFFF;color:#0E1B2B;border-radius:8px;box-shadow:0 16px 40px rgba(14,27,43,0.28);overflow:hidden;z-index:30;text-align:left}
.sug a{display:flex;justify-content:space-between;gap:16px;padding:12px 18px;text-decoration:none;color:#0E1B2B;border-bottom:1px solid #EEF1F4;align-items:center}
.sug a:hover{background:#E8EEF7;color:#0E1B2B}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.ft-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.wrap{padding:0 16px}.nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto}.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.big{font-size:32px !important}h2{font-size:24px}}
</style>

<style>body{background:#DCE3EC !important;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;margin:0}</style>
</head>
<body>
<template id="dc-tpl">
<div style="width:390px;height:844px;background:#FFFFFF;display:flex;flex-direction:column;font-family:'IBM Plex Sans',sans-serif;color:#0E1B2B">
<div style="flex:1;overflow-y:auto">
<div style="background:#0E1B2B;color:#FFFFFF">
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px">
<a href="MainMobile.dc.html" style="display:flex;align-items:center;gap:8px;color:#FFFFFF;text-decoration:none;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:18px"><svg width="32" height="32" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="3" fill="#1D4E9E"></rect><path d="M8 10.5 H28" stroke="#FFFFFF" stroke-width="2.4"></path><path d="M9.5 13.8 H26.5" stroke="#FFFFFF" stroke-width="1.4"></path><path d="M11.5 16.5 V25 M16 16.5 V25 M20.5 16.5 V25 M25 16.5 V25" stroke="#FFFFFF" stroke-width="2.2"></path><path d="M8 27.8 H28" stroke="#FFFFFF" stroke-width="2.4"></path></svg>УрФУ</a>
<a href="Schedule.dc.html" style="color:#FFFFFF;font-size:14px;font-weight:600;text-decoration:none;min-height:44px;display:flex;align-items:center">Войти</a>
</div>
<div style="padding:12px 16px 28px">
<h1 style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:28px;line-height:1.15;margin:0;color:#FFFFFF">Найдите своё место в УрФУ</h1>
<div style="display:flex;gap:6px;margin-top:18px">
<label for="mq" style="position:absolute;left:-9999px">Поиск</label>
<input id="mq" placeholder="Программа, человек, событие" style="flex:1;min-height:48px;border-radius:6px;border:0;padding:0 14px;font:inherit;font-size:15px;min-width:0">
<a href="Search.dc.html" aria-label="Найти" style="width:48px;min-height:48px;border-radius:6px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#0E1B2B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></a>
</div>
</div>

</div>
<div style="padding:20px 16px">
<div style="font-weight:600;font-size:15px">Я —</div>
<div style="display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
<sc-if value="{{r.on}}" hint-placeholder-val="{{false}}"><button onClick="{{r.pick}}" style="flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:4px;border:1px solid #0E1B2B;background:#0E1B2B;color:#FFFFFF;font:inherit;font-size:14px;font-weight:500;cursor:pointer">{{r.label}}</button></sc-if>
<sc-if value="{{r.off}}" hint-placeholder-val="{{true}}"><button onClick="{{r.pick}}" style="flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:4px;border:1px solid #C5CCD4;background:#FFFFFF;color:#0E1B2B;font:inherit;font-size:14px;font-weight:500;cursor:pointer">{{r.label}}</button></sc-if>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<a href="{{l.href}}" style="border:1px solid #E1E5EA;border-radius:8px;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:#0E1B2B"><span style="font-weight:600;font-size:15px">{{l.t}}</span><span style="font-size:12px;color:#56606B">{{l.d}}</span></a>
</sc-for>
</div>
<a href="Admission.dc.html" style="display:block;margin-top:16px;background:#E8EEF7;border-radius:8px;padding:18px;text-decoration:none;color:#0E1B2B"><span style="font-size:12px;font-weight:600;color:#1D4E9E">ПРИЁМ 2027</span><div style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:18px;margin-top:6px">Поступление за 5 шагов</div><div style="font-size:14px;color:#2B3946;margin-top:4px">Старт приёма: 20 июня →</div></a>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px"><div style="font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:18px">Новости</div><a href="News.dc.html" style="font-size:14px">Все</a></div>
<a href="Article.dc.html" style="display:flex;gap:12px;margin-top:12px;text-decoration:none;color:#0E1B2B;align-items:center"><div style="width:84px;height:68px;border-radius:6px;background:#1D4E9E;flex:0 0 auto"></div><div><div style="font-size:12px;color:#56606B">Поступающим · июль 2026</div><div style="font-weight:600;font-size:15px">Почти 50 тысяч заявлений на бюджет</div></div></a>
<a href="Article.dc.html" style="display:flex;gap:12px;margin-top:12px;text-decoration:none;color:#0E1B2B;align-items:center"><div style="width:84px;height:68px;border-radius:6px;background:#A3521F;flex:0 0 auto"></div><div><div style="font-size:12px;color:#56606B">Наука · 2026</div><div style="font-weight:600;font-size:15px">Учёные УрФУ объяснили причину мужского бесплодия</div></div></a>
</div>
</div>
<nav aria-label="Нижнее меню" style="display:flex;background:#FFFFFF;border-top:1px solid #E1E5EA;padding:6px 4px 10px">
<a href="MainMobile.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#1D4E9E;font-weight:600;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg>Главная</a>
<a href="Search.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#56606B;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Поиск</a>
<a href="Schedule.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#56606B;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Расписание</a>
<a href="Contacts.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#56606B;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Сервисы</a>
<a href="Institute.dc.html" style="flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#56606B;text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Меню</a>
</nav>
</div>

</template>
<div id="dc-root"></div>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const role = (this.state && this.state.role) || 'abit';
const sets = {
abit: [
{t:'Каталог программ', d:'400+ программ с фильтром по ЕГЭ и баллам', href:'Catalog.dc.html'},
{t:'Как поступить', d:'5 шагов от выбора до зачисления', href:'Admission.dc.html'},
{t:'Проходные баллы', d:'Баллы и бюджетные места прошлых лет', href:'Catalog.dc.html'},
{t:'Общежития', d:'Адреса, цены и как получить место', href:'Dorms.dc.html'},
{t:'Дни открытых дверей', d:'Ближайшие встречи с институтами', href:'Events.dc.html'},
{t:'Задать вопрос', d:'Контакты приёмной комиссии', href:'Contacts.dc.html'}],
student: [
{t:'Расписание', d:'Пары на сегодня и на неделю', href:'Schedule.dc.html'},
{t:'Личный кабинет', d:'Оценки, справки, стипендия', href:'Schedule.dc.html'},
{t:'События', d:'Лекции, конкурсы, ярмарки вакансий', href:'Events.dc.html'},
{t:'Найти преподавателя', d:'Кафедра, почта, часы консультаций', href:'Person.dc.html'},
{t:'Общежития', d:'Заселение и правила', href:'Dorms.dc.html'},
{t:'Карта кампуса', d:'Корпуса и аудитории', href:'Contacts.dc.html'}],
staff: [
{t:'Новости', d:'Что происходит в университете', href:'News.dc.html'},
{t:'Найти коллегу', d:'Поиск по сотрудникам', href:'Search.dc.html'},
{t:'Институты', d:'Структура и подразделения', href:'Institute.dc.html'},
{t:'Мероприятия', d:'Календарь университета', href:'Events.dc.html'},
{t:'Контакты служб', d:'Телефоны и адреса', href:'Contacts.dc.html'},
{t:'Сервисы', d:'Почта, документы, ЛК сотрудника', href:'Schedule.dc.html'}],
intl: [
{t:'Programs in English', d:'Bachelor and Master programs', href:'Catalog.dc.html'},
{t:'How to apply', d:'Steps, documents and deadlines', href:'Admission.dc.html'},
{t:'Dormitories', d:'Housing for international students', href:'Dorms.dc.html'},
{t:'Campus map', d:'Buildings and contacts', href:'Contacts.dc.html'},
{t:'Events', d:'Adaptation and student life', href:'Events.dc.html'},
{t:'Contact us', d:'International office', href:'Contacts.dc.html'}]
};
const list = [['abit','Абитуриент'],['student','Студент'],['staff','Сотрудник'],['intl','Intl']];
return {
roles: list.map(([k, label]) => ({ label, on: k === role, off: k !== role, pick: () => this.setState({ role: k }) })),
links: sets[role].slice(0, 4)
};
}
}

</script>
<script src="dc-lite.js"></script>
</body>
</html>
