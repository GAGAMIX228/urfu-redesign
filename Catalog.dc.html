<style>
.pc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:center}
.pc-s{display:grid;grid-template-columns:96px 84px 128px;gap:24px;align-items:start}.pc-s .muted{white-space:normal;line-height:1.3;min-height:2.6em}.pc-s > div > div:last-child{white-space:nowrap}.pc-cmp{margin-top:14px}
@media (max-width:480px){.pc-s > div > div:last-child{white-space:normal}}

@media (max-width:1100px){.pc{grid-template-columns:1fr}.pc-s{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}}
</style>
<style id="cg-css">
.cg-more{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:#FFFFFF;padding:14px 18px}.cg-more summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}.cg-more ul{list-style:none;margin:12px 0 0;padding:0;columns:2 320px;column-gap:28px}.cg-more li{break-inside:avoid;display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--line)}.cg-more li span:not(.sr){font-size:13px;color:var(--muted)}
.cg-areas{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.cg-areas li{display:grid;grid-template-columns:200px 90px minmax(0,1fr) 110px 90px 170px;gap:14px;align-items:center;padding:14px 18px;border-radius:16px;background:#FFFFFF;border:1px solid var(--line)}
.cg-a{font-weight:700;font-size:17px}
.cg-n{font-size:14px;color:var(--muted)}
.cg-bar{position:relative;height:14px;border-radius:8px;background:var(--limestone)}
.cg-bar i{position:absolute;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--amethyst),var(--rhodonite))}
.cg-bar.is-empty{background:repeating-linear-gradient(45deg,var(--limestone) 0 6px,#FFFFFF 6px 12px)}
.cg-v{display:flex;flex-direction:column;font-family:var(--narrow);font-size:20px;font-weight:700}
.cg-v small{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted)}
.cg-tops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.cg-tops h3{font-size:20px;font-family:var(--narrow)}
.cg-top{list-style:none;margin:12px 0 0;padding:0;counter-reset:t;display:flex;flex-direction:column;gap:8px}
.cg-top li{counter-increment:t;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.cg-top li::before{content:counter(t);grid-row:span 2;font-family:var(--narrow);font-size:22px;font-weight:700;color:var(--rhodonite)}
.cg-top a{font-weight:600}
.cg-top b{font-family:var(--narrow);font-size:20px;white-space:nowrap}
.cg-top span{grid-column:2/-1;font-size:13px;color:var(--muted)}
.cg-steps{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cg-steps li{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:16px;background:var(--ink);color:#FFFFFF}
.cg-steps span{font-family:var(--narrow);font-size:36px;font-weight:700;color:var(--gold);line-height:1}
.cg-steps small{font-size:14px;color:var(--on-dark-muted)}
.cg-gl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0 0}
.cg-gl div{padding:16px 18px;border-radius:16px;background:#FFFFFF;border:1px solid var(--line);border-left:5px solid var(--amethyst)}
.cg-gl dt{font-weight:700;font-size:17px}
.cg-gl dd{margin:4px 0 0;font-size:15px;color:var(--muted)}
.cg-faq{max-width:860px;margin-top:12px}
.cg-it{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#FFFFFF}
.cg-ir{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) 80px 90px minmax(0,1.1fr);gap:12px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.cg-ir:first-child{border-top:0}
.cg-irh{background:var(--limestone);font-size:13px;font-weight:700;color:var(--muted)}
.cg-ir a{font-weight:700}
.cg-ir span{font-weight:600}
.cg-ir small{display:none}
.cg-faq p{margin-top:10px}
@media (max-width:1100px){.cg-areas li{grid-template-columns:minmax(0,1fr) auto;gap:8px 14px}.cg-bar{grid-column:1/-1}.cg-v{flex-direction:row;gap:6px;align-items:baseline;font-size:18px}.cg-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.cg-tops,.cg-gl{grid-template-columns:minmax(0,1fr)}.cg-irh{display:none}.cg-ir{grid-template-columns:repeat(2,minmax(0,1fr))}.cg-ir a{grid-column:1/-1}.cg-ir span{display:flex;flex-direction:column}.cg-ir small{display:block;font-size:12px;font-weight:500;color:var(--muted)}}
@media (max-width:560px){.cg-steps{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

<h1 class="big" style="font-size:48px">Каталог программ</h1>
<p class="muted" style="margin-top:12px;font-size:18px">Отметьте свои предметы ЕГЭ и баллы — покажем, куда вы можете поступить. Не знаете, с чего начать? <a href="Quiz.dc.html">Подбор за 3 вопроса</a></p>
</div></section><div class="wrap">
<div class="row" style="margin-top:40px;align-items:flex-start">
<aside class="side" style="flex:1 1 280px;max-width:320px;display:flex;flex-direction:column;gap:24px">
<div class="field"><label for="cq">Название программы</label><input autocomplete="off" type="search" id="cq" name="cq" class="input" placeholder="Например, дизайн…" value="{{q}}" onChange="{{onQ}}"></div>
<div><div style="font-weight:600;margin-bottom:10px">Уровень</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{levels}}" as="v" hint-placeholder-count="3">
<sc-if value="{{v.on}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{v.pick}}">{{v.label}}</button></sc-if>
<sc-if value="{{v.off}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{v.pick}}">{{v.label}}</button></sc-if>
</sc-for>
</div>
<p class="muted" style="font-size:13px;margin-top:8px;line-height:1.45">Программы бакалавриата и специалитета набора 2026 года в Екатеринбурге — с сайта образовательных программ УрФУ. После школы учатся 4–6 лет.</p></div>
<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:10px;padding:0">Мои предметы ЕГЭ</legend>
<div style="display:flex;flex-direction:column;gap:4px">
<sc-for list="{{subjects}}" as="sj" hint-placeholder-count="10">
<label for="{{sj.id}}" style="display:flex;gap:10px;align-items:center;min-height:36px;cursor:pointer"><input id="{{sj.id}}" type="checkbox" checked="{{sj.on}}" onChange="{{sj.toggle}}" style="width:20px;height:20px;accent-color:var(--blue)">{{sj.label}}</label>
</sc-for>
</div></fieldset>
<div class="field"><label for="sc">Моя сумма баллов</label><input autocomplete="off" id="sc" name="sc" class="input" inputmode="numeric" placeholder="Например, 240…" value="{{my}}" onChange="{{onMy}}"><span class="muted" style="font-weight:400;font-size:13px">Сравним с проходным баллом 2025 года</span></div>
<button class="btn2" onClick="{{reset}}">Сбросить фильтры</button>
</aside>
<div class="main">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6">
<sc-if value="{{a.on}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{a.pick}}">{{a.label}}</button></sc-if>
<sc-if value="{{a.off}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{a.pick}}">{{a.label}}</button></sc-if>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:8px"><b aria-live="polite">Найдено: {{count}}</b><span class="muted" style="font-size:14px">Сначала — где хватает баллов</span></div>
<sc-if value="{{showCmp}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="Сравнение программ" style="position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(14,27,43,0.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px">
<div class="card" style="padding:0;overflow:auto;border-color:var(--blue);width:100%;max-width:1040px;max-height:90vh">
<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--blue-soft)"><b style="font-size:18px">Сравнение программ</b><button class="btn2" data-close onClick="{{hideCmp}}" style="min-height:40px">Закрыть</button></div>
<div style="overflow-x:auto">
<div style="display:grid;grid-template-columns:{{cmpGrid}};min-width:640px;font-size:15px"><div style="padding:14px 20px"></div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:14px 20px"><a href="{{c.href}}" style="color:var(--ink);text-decoration:none;font-weight:600">{{c.name}}</a><div><button onClick="{{c.remove}}" style="border:0;background:none;padding:6px 0 0;color:var(--copper);font:inherit;font-size:13px;cursor:pointer">Убрать</button></div></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Проходной 2025</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.score}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Бюджетных мест</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.budget}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Стоимость в год</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.price}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Экзамены ЕГЭ</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.exams}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Институт</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.inst}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Область</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.area}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Мои баллы</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.verdict}}</div></sc-for></div></div></div></div>
</sc-if>
<sc-if value="{{hasTipMore}}" hint-placeholder-val="{{false}}"><p class="muted" style="font-size:14px;margin-top:8px">{{tip}}</p></sc-if>
<sc-if value="{{emptyBach}}" hint-placeholder-val="{{false}}"><div class="card" style="margin-top:16px;text-align:center;padding:40px"><div style="font-weight:600;font-size:18px">С этими предметами программ не нашлось</div><sc-if value="{{hasTip}}" hint-placeholder-val="{{false}}"><p style="margin-top:8px;color:var(--blue);font-weight:600">{{tip}}</p></sc-if><p class="muted" style="margin-top:8px">Отметьте ещё один предмет, смените область или сбросьте фильтры.</p><button class="btn2" onClick="{{reset}}" style="margin-top:16px">Сбросить фильтры</button></div></sc-if>
<sc-if value="{{notBach}}" hint-placeholder-val="{{false}}"><div class="card" style="margin-top:16px;text-align:center;padding:40px"><div style="font-weight:600;font-size:18px">В прототипе показан бакалавриат</div><p class="muted" style="margin-top:8px">Специалитет и магистратура открываются тем же каталогом — с другими фильтрами.</p><button class="btn2" onClick="{{reset}}" style="margin-top:16px">Вернуться к бакалавриату</button></div></sc-if>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
<sc-for list="{{progs}}" as="p" hint-placeholder-count="5">
<div class="card pc">
<div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag" style="background:#FFFFFF;border:1px solid var(--line)" title="{{p.instFull}}">{{p.instL}}</span><span class="tag" style="background:#FFFFFF;border:1px solid var(--line)">{{p.lvlL}}</span></div>
<a href="{{p.href}}" style="display:block;font-weight:600;font-size:20px;margin-top:12px;color:var(--ink);text-decoration:none">{{p.name}}</a>
<div class="muted" style="font-size:14px;margin-top:6px">ЕГЭ: {{p.exams}}</div>
<sc-if value="{{p.ok}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px;background:var(--blue-soft);color:var(--blue-dark)">Ваших баллов хватает</span></sc-if>
<sc-if value="{{p.short}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px;background:var(--bg-soft);color:#7A3B14">Не хватает {{p.gap}} баллов</span></sc-if>
<sc-if value="{{p.nodata}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px">Проходной балл уточняется</span></sc-if>
<div class="pc-cmp">
<sc-if value="{{p.inCmp}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{p.toggle}}" aria-pressed="true">✓ В сравнении</button></sc-if>
<sc-if value="{{p.canAdd}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{p.toggle}}" aria-pressed="false">+ Сравнить</button></sc-if>
<sc-if value="{{p.blocked}}" hint-placeholder-val="{{false}}"><span class="muted" style="font-size:13px">Можно сравнить до 3</span></sc-if>
</div></div>
<div class="pc-s">
<sc-if value="{{p.hasS}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">Проходной балл {{p.sy}}</div><div style="font-weight:600;font-size:18px">{{p.score}}</div></div></sc-if>
<sc-if value="{{p.hasB}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">Бюджетных мест</div><div style="font-weight:600;font-size:18px">{{p.budget}}</div></div></sc-if>
<sc-if value="{{p.hasP}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">Цена в год</div><div style="font-weight:600;font-size:18px">{{p.price}}</div></div></sc-if>

</div>
</sc-for>
</div>
<sc-if value="{{hasCmp}}" hint-placeholder-val="{{false}}">
<div style="position:sticky;bottom:16px;margin-top:20px;background:var(--ink);color:#FFFFFF;border-radius:8px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(14,27,43,0.3)">
<span>Выбрано для сравнения: <b>{{cmpCount}} из 3</b></span>
<div style="display:flex;gap:8px"><button onClick="{{clearCmp}}" style="min-height:44px;padding:0 16px;border-radius:6px;border:1px solid #3A4E66;background:transparent;color:#FFFFFF;font:inherit;cursor:pointer">Очистить</button><button class="btn" onClick="{{openCmp}}" style="background:#FFFFFF;color:var(--ink)">Сравнить</button></div>
</div>
</sc-if>

</div>
</div>
</div>
<!-- ru-only --><div class="wrap cg">
<section class="sec" aria-labelledby="cg-a-h">

<section class="sec" aria-labelledby="cg-s-h">
<h2 id="cg-s-h">Как выбрать программу за 5 минут</h2>
<ol class="cg-steps"><li><span>1</span><b>Отметьте свои ЕГЭ</b><small>Слева — предметы, которые сдаёте. Каталог оставит только подходящие программы.</small></li><li><span>2</span><b>Введите сумму баллов</b><small>Покажем, где хватает баллов прошлого года, а где не хватает и сколько.</small></li><li><span>3</span><b>Сравните до трёх</b><small>Баллы, места, цены и экзамены — в одной таблице.</small></li><li><span>4</span><b>Откройте программу</b><small>Что изучают, кем работают выпускники, кто преподаёт.</small></li><li><span>5</span><b>Не уверены — пройдите подбор</b><small>Три вопроса — и список программ под ваши интересы.</small></li></ol>
</section>
<section class="sec" aria-labelledby="cg-g-h">
<h2 id="cg-g-h">Словарь поступающего</h2>
<dl class="cg-gl"><div><dt>Проходной балл</dt><dd>Сумма баллов последнего, кто поступил на бюджет в прошлом году. Ориентир, а не гарантия: каждый год он меняется.</dd></div><div><dt>Бюджетные места</dt><dd>Места, где учёбу оплачивает государство. Их число на каждый год утверждают заранее.</dd></div><div><dt>Приоритет</dt><dd>В одном вузе можно выбрать до пяти направлений и расставить их по порядку — зачислят на самое желанное, куда хватит баллов.</dd></div><div><dt>Согласие на зачисление</dt><dd>Подтверждение, что вы идёте именно сюда. Без него не зачислят, даже если баллов хватает.</dd></div><div><dt>Индивидуальные достижения</dt><dd>Дополнительные баллы к сумме ЕГЭ: например, за аттестат с отличием, ГТО, волонтёрство, олимпиады.</dd></div><div><dt>Особая и отдельная квоты</dt><dd>Места для поступающих с особыми правами. Конкурс на них идёт отдельно от общего.</dd></div><div><dt>Целевое обучение</dt><dd>Учёба по договору с компанией: она поддерживает студента, а выпускник работает у неё.</dd></div><div><dt>Минимальный балл</dt><dd>Ниже него по предмету документы не примут. На программах УрФУ — от 40 баллов.</dd></div></dl>
<p style="margin-top:14px"><a href="Admission.dc.html">Как поступить — сроки и шаги →</a></p>
</section>
<section class="sec" aria-labelledby="cg-f-h">
<h2 id="cg-f-h">Вопросы о каталоге</h2>
<div class="cg-faq"><details><summary>Почему у некоторых программ нет проходного балла?</summary><p class="muted">На странице программы его не публиковали — например, если бюджетных мест не было или конкурс шёл только среди поступающих по особым правам. Такие программы мы показываем без балла, а не придумываем его.</p></details><details><summary>Что значит год рядом с баллом?</summary><p class="muted">Год, за который опубликован проходной балл. Обычно это 2025, у части программ — 2024: свежее данных на сайте программ не нашлось.</p></details><details><summary>Откуда цены и места?</summary><p class="muted">С сайта образовательных программ УрФУ (programs.edu.urfu.ru) и из приказов университета. Точную цену на ваш год пишут в договоре.</p></details><details><summary>Сколько программ можно сравнить?</summary><p class="muted">До трёх. Нажмите «+ Сравнить» на карточках — появится таблица рядом друг с другом.</p></details><details><summary>Где магистратура и аспирантура?</summary><p class="muted">В прототипе каталог показывает бакалавриат и специалитет — с них начинают после школы. Магистерские программы есть на сайте образовательных программ УрФУ.</p></details></div>
</section>

levels: levels.map(([k,label]) => ({label, on:k===level, off:k!==level, pick:() => this.setState({level:k})})),

progs,
count: n + ' ' + word,
empty: n === 0,
notBach: false,
emptyBach: n === 0,
tip, hasTip: n === 0 && !!tip, hasTipMore: n > 0 && !!tip,
q, my,
onQ: (e) => this.setState({ q: e.target.value }),
onMy: (e) => this.setState({ my: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
reset: () => this.setState({ q: '', area: 'all', sel: { rus: true, math: true, inf: true }, my: '', level: 'all' })
};
}
