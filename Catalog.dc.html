<h1 class="big" style="font-size:48px">Каталог программ</h1>
<p class="muted" style="margin-top:12px;font-size:18px">Отметьте свои предметы ЕГЭ и баллы — покажем, куда вы можете поступить. Не знаете, с чего начать? <a href="Quiz.dc.html">Подбор за 3 вопроса</a></p>
</div></section><div class="wrap">
<div class="row" style="margin-top:40px;align-items:flex-start">
<aside class="side" style="flex:1 1 280px;max-width:320px;display:flex;flex-direction:column;gap:24px">
<div class="field"><label for="cq">Название программы</label><input autocomplete="off" type="search" id="cq" name="cq" class="input" placeholder="Например, дизайн…" value="{{q}}" onChange="{{onQ}}"></div>
<div><div style="font-weight:600;margin-bottom:10px">Уровень</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{levels}}" as="v" hint-placeholder-count="3">
<sc-if value="{{v.on}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{v.pick}}">{{v.label}}</button></sc-if>
<sc-if value="{{v.off}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{v.pick}}">{{v.label}}</button></sc-if>
</sc-for>
</div>
<p class="muted" style="font-size:13px;margin-top:8px;line-height:1.45">В каталоге — программы бакалавриата: поступают после школы, учатся обычно 4 года.</p></div>
<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:10px;padding:0">Мои предметы ЕГЭ</legend>
<div style="display:flex;flex-direction:column;gap:4px">
<sc-for list="{{subjects}}" as="sj" hint-placeholder-count="10">
<label for="{{sj.id}}" style="display:flex;gap:10px;align-items:center;min-height:36px;cursor:pointer"><input id="{{sj.id}}" type="checkbox" checked="{{sj.on}}" onChange="{{sj.toggle}}" style="width:20px;height:20px;accent-color:var(--blue)">{{sj.label}}</label>
</sc-for>
</div></fieldset>
<div class="field"><label for="sc">Моя сумма баллов</label><input autocomplete="off" id="sc" name="sc" class="input" inputmode="numeric" placeholder="Например, 240…" value="{{my}}" onChange="{{onMy}}"><span class="muted" style="font-weight:400;font-size:13px">Сравним с проходным баллом 2025 года</span></div>
<button class="btn2" onClick="{{reset}}">Сбросить фильтры</button>
</aside>
<div class="main">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6">
<sc-if value="{{a.on}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{a.pick}}">{{a.label}}</button></sc-if>
<sc-if value="{{a.off}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{a.pick}}">{{a.label}}</button></sc-if>
</sc-for>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:8px"><b aria-live="polite">Найдено: {{count}}</b><span class="muted" style="font-size:14px">Сначала — где хватает баллов</span></div>
<sc-if value="{{showCmp}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="Сравнение программ" style="position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(14,27,43,0.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px">
<div class="card" style="padding:0;overflow:auto;border-color:var(--blue);width:100%;max-width:1040px;max-height:90vh">
<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--blue-soft)"><b style="font-size:18px">Сравнение программ</b><button class="btn2" data-close onClick="{{hideCmp}}" style="min-height:40px">Закрыть</button></div>
<div style="overflow-x:auto">
<div style="display:grid;grid-template-columns:{{cmpGrid}};min-width:640px;font-size:15px"><div style="padding:14px 20px"></div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:14px 20px"><a href="{{c.href}}" style="color:var(--ink);text-decoration:none;font-weight:600">{{c.name}}</a><div><button onClick="{{c.remove}}" style="border:0;background:none;padding:6px 0 0;color:var(--copper);font:inherit;font-size:13px;cursor:pointer">Убрать</button></div></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Проходной 2025</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.score}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Бюджетных мест</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.budget}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Стоимость в год</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)"><b>{{c.price}}</b></div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Экзамены ЕГЭ</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.exams}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Институт</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.inst}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Область</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.area}}</div></sc-for><div style="padding:12px 20px;border-top:1px solid var(--line);color:var(--muted)">Мои баллы</div><sc-for list="{{cmpCols}}" as="c" hint-placeholder-count="2"><div style="padding:12px 20px;border-top:1px solid var(--line)">{{c.verdict}}</div></sc-for></div></div></div></div>
</sc-if>
<sc-if value="{{hasTipMore}}" hint-placeholder-val="{{false}}"><p class="muted" style="font-size:14px;margin-top:8px">{{tip}}</p></sc-if>
<sc-if value="{{emptyBach}}" hint-placeholder-val="{{false}}"><div class="card" style="margin-top:16px;text-align:center;padding:40px"><div style="font-weight:600;font-size:18px">С этими предметами программ не нашлось</div><sc-if value="{{hasTip}}" hint-placeholder-val="{{false}}"><p style="margin-top:8px;color:var(--blue);font-weight:600">{{tip}}</p></sc-if><p class="muted" style="margin-top:8px">Отметьте ещё один предмет, смените область или сбросьте фильтры.</p><button class="btn2" onClick="{{reset}}" style="margin-top:16px">Сбросить фильтры</button></div></sc-if>
<sc-if value="{{notBach}}" hint-placeholder-val="{{false}}"><div class="card" style="margin-top:16px;text-align:center;padding:40px"><div style="font-weight:600;font-size:18px">В прототипе показан бакалавриат</div><p class="muted" style="margin-top:8px">Специалитет и магистратура открываются тем же каталогом — с другими фильтрами.</p><button class="btn2" onClick="{{reset}}" style="margin-top:16px">Вернуться к бакалавриату</button></div></sc-if>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
<sc-for list="{{progs}}" as="p" hint-placeholder-count="5">
<div class="card pc">
<div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag" style="background:#FFFFFF;border:1px solid var(--line)" title="{{p.instFull}}">{{p.instL}}</span></div>
<a href="{{p.href}}" style="display:block;font-weight:600;font-size:20px;margin-top:12px;color:var(--ink);text-decoration:none">{{p.name}}</a>
<div class="muted" style="font-size:14px;margin-top:6px">ЕГЭ: {{p.exams}}</div>
<sc-if value="{{p.ok}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px;background:var(--blue-soft);color:var(--blue-dark)">Ваших баллов хватает</span></sc-if>
<sc-if value="{{p.short}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px;background:var(--bg-soft);color:#7A3B14">Не хватает {{p.gap}} баллов</span></sc-if>
<sc-if value="{{p.nodata}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-top:10px">Проходной балл уточняется</span></sc-if>
<div class="pc-cmp">
<sc-if value="{{p.inCmp}}" hint-placeholder-val="{{false}}"><button class="chip on" onClick="{{p.toggle}}" aria-pressed="true">✓ В сравнении</button></sc-if>
<sc-if value="{{p.canAdd}}" hint-placeholder-val="{{true}}"><button class="chip" onClick="{{p.toggle}}" aria-pressed="false">+ Сравнить</button></sc-if>
<sc-if value="{{p.blocked}}" hint-placeholder-val="{{false}}"><span class="muted" style="font-size:13px">Можно сравнить до 3</span></sc-if>
</div></div>
<div class="pc-s">
<sc-if value="{{p.hasS}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">Проходной балл {{p.sy}}</div><div style="font-weight:600;font-size:18px">{{p.score}}</div></div></sc-if>
<sc-if value="{{p.hasB}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">Бюджетных мест</div><div style="font-weight:600;font-size:18px">{{p.budget}}</div></div></sc-if>
<sc-if value="{{p.hasP}}" hint-placeholder-val="{{true}}"><div><div class="muted" style="font-size:13px">Цена в год</div><div style="font-weight:600;font-size:18px">{{p.price}}</div></div></sc-if>

</div>
</sc-for>
</div>
<sc-if value="{{hasCmp}}" hint-placeholder-val="{{false}}">
<div style="position:sticky;bottom:16px;margin-top:20px;background:var(--ink);color:#FFFFFF;border-radius:8px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 12px 32px rgba(14,27,43,0.3)">
<span>Выбрано для сравнения: <b>{{cmpCount}} из 3</b></span>
<div style="display:flex;gap:8px"><button onClick="{{clearCmp}}" style="min-height:44px;padding:0 16px;border-radius:6px;border:1px solid #3A4E66;background:transparent;color:#FFFFFF;font:inherit;cursor:pointer">Очистить</button><button class="btn" onClick="{{openCmp}}" style="background:#FFFFFF;color:var(--ink)">Сравнить</button></div>
</div>
</sc-if>

</div>
</div>
</div>
