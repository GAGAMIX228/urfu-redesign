<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const my = (this.state && this.state.my) || '';
const v = parseInt(my, 10);
const last = 259, lo = 244;
let has = false, resT = '', resD = '', resCls = 'calc';
if (my.trim() !== '') {
has = true;
if (isNaN(v) || v < 0 || v > 310) { resT = 'Введите сумму от 0 до 310'; resD = 'Три ЕГЭ — до 300 баллов, плюс до 10 за достижения.'; resCls = 'calc calc-warn'; }
else if (v >= last) { resT = 'Хватает'; resD = 'Ваша сумма не ниже проходного балла 2025 года (' + last + ').'; resCls = 'calc calc-ok'; }
else if (v >= lo) { resT = 'На границе'; resD = 'За три года проходной был от ' + lo + ' до ' + last + '. До балла 2025 не хватает ' + (last - v) + '.'; resCls = 'calc calc-mid'; }
else { resT = 'Пока не хватает ' + (last - v) + ' баллов'; resD = 'Посмотрите похожие программы с проходным ниже.'; resCls = 'calc calc-warn'; }
}
return { my, has, resT, resD, resCls, onMy: (e) => this.setState({ my: e.target.value }) };
}
}
</script>
