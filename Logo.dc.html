<h1 class="big" style="font-size:52px">Логотип и фирменный стиль</h1>
<p class="muted" style="margin-top:12px;font-size:19px;max-width:760px">Новый знак — «Лента»: буква «У», сложенная из ленты. Яркий, объёмный и простой — хорошо читается и в шапке сайта, и на значке вкладки.</p>
</div></section>

<section class="wrap sec" style="padding-top:48px"><h2 class="sr">Знак и шрифт</h2>
<div class="g2">
<div class="card keep-light" style="display:flex;align-items:center;justify-content:center;gap:28px;padding:56px 32px;min-height:300px">

</div>
<div class="card" style="display:flex;align-items:center;justify-content:center;gap:28px;padding:56px 32px;min-height:300px;background:var(--ink);border-color:var(--ink);color:#FFFFFF">

<div><div style="font-weight:600;font-size:30px;line-height:1.05;letter-spacing:-0.01em">Уральский<br>федеральный<br>университет</div><div style="font-size:15px;margin-top:8px;line-height:1.3;color:var(--on-dark-muted)">имени первого Президента<br>России Б.Н.Ельцина</div></div>

<div class="row" style="margin-top:24px;align-items:stretch">
<div class="card main">
<h3>Знак</h3>
<p class="muted" style="margin-top:10px">Буква «У» из одной ленты: левая часть — аметист, правая — родонит, на сгибе — тень, будто лента повернулась. Плавный перелив внутри каждой части даёт объём. Знак одинаково хорошо смотрится на светлом и тёмном фоне, а при загрузке страницы по ленте пробегает блик.</p>
<div style="display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap;margin-top:24px">
<div style="text-align:center"><img src="favicon.svg" width="128" height="128" alt=""><div class="muted num" style="font-size:13px">128 px</div></div>
<div style="text-align:center"><img src="favicon.svg" width="64" height="64" alt=""><div class="muted num" style="font-size:13px">64 px</div></div>
<div style="text-align:center"><div style="width:72px;height:72px;border-radius:18px;background:var(--ink);display:flex;align-items:center;justify-content:center;margin:0 auto"><img src="favicon.svg" width="44" height="44" alt=""></div><div class="muted" style="font-size:13px;margin-top:4px">иконка приложения</div></div>
<div style="text-align:center"><img src="favicon.svg" width="32" height="32" alt=""><div class="muted num" style="font-size:13px">32 px</div></div>
<div style="text-align:center"><img src="favicon.svg" width="16" height="16" alt=""><div class="muted num" style="font-size:13px">16 px · вкладка</div></div>
</div>
</div>
<div class="card side">
<h3>Шрифты</h3>
<div style="font-family:var(--narrow);font-weight:700;font-size:44px;line-height:1;margin-top:12px">PT Sans Narrow</div>
<p class="muted" style="margin-top:8px">Заголовки. Узкий шрифт студии ParaType, сделан для общественных надписей — как буквы на фасадах.</p>
<div style="font-weight:600;font-size:28px;line-height:1.1;margin-top:18px">IBM Plex Sans</div>
<p class="muted" style="margin-top:8px">Текст, кнопки и формы: 400, 500, 600, 700. Оба шрифта с кириллицей и лежат в папке сайта — без внешних сервисов.</p>
<div style="font-family:var(--narrow);font-weight:700;font-size:26px;margin-top:14px">Что вам нужно в УрФУ?</div>
</div>
</div>
</section>

<section class="wrap sec">
<div class="sec-head"><div><div class="kicker">Палитра</div><h2>Основа и самоцветы</h2></div></div>
<p class="muted" style="max-width:760px">Яркие уральские самоцветы. Родонит — официальный камень Екатеринбурга, золото — символ Урала. Для каждого цвета указан контраст текста на нём: норма WCAG AA — от 4,5.</p>
<div class="g4" style="margin-top:24px">
<div class="card" style="padding:0;overflow:hidden"><div style="height:110px;background:#6B2BE8;display:flex;align-items:flex-end;padding:12px;color:#FFFFFF;font-weight:600">Аа</div><div style="padding:14px 16px"><b>Аметист · основной</b><div class="muted num" style="font-size:14px">#6B2BE8 · белый текст 6,7 : 1</div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div style="height:110px;background:#16112B;display:flex;align-items:flex-end;padding:12px;color:#FFFFFF;font-weight:600">Аа</div><div style="padding:14px 16px"><b>Ночь · тёмный фон</b><div class="muted num" style="font-size:14px">#16112B · белый текст 18,3 : 1</div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div style="height:110px;background:#E0246F;display:flex;align-items:flex-end;padding:12px;color:#FFFFFF;font-weight:600">Аа</div><div style="padding:14px 16px"><b>Родонит · акцент</b><div class="muted num" style="font-size:14px">#E0246F · белый текст 4,5 : 1</div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div style="height:110px;background:#FFC21A;display:flex;align-items:flex-end;padding:12px;color:#16112B;font-weight:600">Аа</div><div style="padding:14px 16px"><b>Золото · акцент</b><div class="muted num" style="font-size:14px">#FFC21A · тёмный текст 11,3 : 1</div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div style="height:110px;background:#00B386;display:flex;align-items:flex-end;padding:12px;color:#16112B;font-weight:600">Аа</div><div style="padding:14px 16px"><b>Малахит</b><div class="muted num" style="font-size:14px">#00B386 · тёмный текст 6,8 : 1</div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div style="height:110px;background:#EFE9FF;display:flex;align-items:flex-end;padding:12px;color:#16112B;font-weight:600">Аа</div><div style="padding:14px 16px"><b>Лаванда · светлый фон</b><div class="muted num" style="font-size:14px">#EFE9FF · тёмный текст 16 : 1</div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div style="height:110px;background:linear-gradient(180deg,#9B5CFF,#5A1FD1);display:flex;align-items:flex-end;padding:12px;color:#FFFFFF;font-weight:600">Аа</div><div style="padding:14px 16px"><b>Лента · левая часть</b><div class="muted num" style="font-size:14px">аметистовый перелив</div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div style="height:110px;background:linear-gradient(180deg,#FF4D8D,#C2185B);display:flex;align-items:flex-end;padding:12px;color:#FFFFFF;font-weight:600">Аа</div><div style="padding:14px 16px"><b>Лента · правая часть</b><div class="muted num" style="font-size:14px">родонитовый перелив</div></div></div>
</div>
</section>

<section class="wrap sec">
<div class="sec-head"><div><div class="kicker" style="--k:var(--a4)">Элементы</div><h2>Как стиль живёт на страницах</h2></div></div>
<div class="g3">
<div class="card"><h3>Срезанный угол</h3><p class="muted" style="margin-top:8px">Угол срезан, как грань огранённого камня: у плиток ролей и институтов, у фото, карточек и карты кампуса.</p><div aria-hidden="true" style="height:96px;margin-top:20px;background:var(--a1);clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%)"></div></div>
<div class="card"><h3>Фотографии</h3><p class="muted" style="margin-top:8px">Настоящие снимки зданий и студентов УрФУ. Снизу — лёгкое затемнение, чтобы подпись на фото читалась.</p><div class="ph art t2 photo" style="--img:url('photos/kampus-leto.webp');height:150px;margin-top:16px;position:relative;overflow:hidden"></div></div>
<div class="card"><h3>Кнопки и фильтры</h3><p class="muted" style="margin-top:8px">Основная кнопка — аметист, второстепенная — с тёмной рамкой, выбранный фильтр — тёмный.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px"><span class="btn">Подобрать</span><span class="btn2">Все шаги</span><span class="chip on">Наука</span><span class="chip">Спорт</span></div></div>
</div>
