<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Варианты знака УрФУ</title>
<style>
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'IBM Plex Sans';src:url('fonts/IBMPlexSans-SemiBold.ttf') format('truetype');font-weight:600}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F4;color:#0E1B2B;font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:28px;margin:0 0 4px}
.lead{color:#56606B;margin:0 0 28px}
.opt{background:#FFFFFF;border:1px solid #E1E5EA;border-radius:8px;padding:24px;margin-bottom:24px}
.opt-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.opt-h b{font-size:22px}
.opt-h span{color:#56606B}
.row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:16px;margin-top:18px}
.tile{border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:220px;padding:24px}
.light{background:#F6F8FA;border:1px solid #E1E5EA}
.dark{background:#0E1B2B}
.hdr{flex-direction:column;align-items:stretch;justify-content:center;gap:16px;background:#F6F8FA;border:1px solid #E1E5EA}
.bar{display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #E1E5EA;border-radius:6px;padding:12px 16px}
.bar.d{background:#0E1B2B;border-color:#0E1B2B;color:#FFFFFF}
.bar .t{font-weight:600;font-size:20px;line-height:1.1}
.bar small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56606B}
.bar.d small{color:#C9D1DA}
.fav{display:flex;gap:10px;align-items:center;font-size:13px;color:#56606B}
@media (max-width:820px){.row{grid-template-columns:1fr 1fr}.hdr{grid-column:span 2}}
@media (max-width:520px){.row{grid-template-columns:1fr}.hdr{grid-column:auto}}
</style>
</head>
<body>
<!-- общие цвета-переходы для всех знаков -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<linearGradient id="gem" gradientUnits="userSpaceOnUse" x1="40" y1="2" x2="6" y2="46"><stop offset="0" stop-color="#14A383"></stop><stop offset=".5" stop-color="#1D4E9E"></stop><stop offset="1" stop-color="#6A4C9C"></stop></linearGradient>
<linearGradient id="jasper" gradientUnits="userSpaceOnUse" x1="5" y1="4" x2="23" y2="24"><stop offset="0" stop-color="#E0605A"></stop><stop offset="1" stop-color="#A63A3A"></stop></linearGradient>
<linearGradient id="stone" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="44" y2="44"><stop offset="0" stop-color="#14A383"></stop><stop offset="1" stop-color="#0B6A56"></stop></linearGradient>
<linearGradient id="crys" gradientUnits="userSpaceOnUse" x1="24" y1="1" x2="24" y2="47"><stop offset="0" stop-color="#2F64C0"></stop><stop offset="1" stop-color="#5A3E8E"></stop></linearGradient>
<!-- плавная «У»: левый штрих сужается кверху, правый — широкий наверху и уходит дугой в острый «хвост» внизу слева -->
<symbol id="u-left" viewBox="0 0 48 48"><path d="M6 4 H13.5 C16 11.5 19 17.5 23 23 C17 19 10.5 12.5 6 4 Z"></path></symbol>
<symbol id="u-right" viewBox="0 0 48 48"><path d="M27 4 H35.5 C33 18 26 34 9 45 C19 34 25 20 27 4 Z"></path></symbol>
</defs>
</svg>

<div class="wrap">
<h1>Варианты знака</h1>
<p class="lead">Форма повторяет фирменную «У» УрФУ, цвета — уральские самоцветы. Каждый знак показан крупно, на светлом и тёмном фоне и в шапке в настоящем размере.</p>
<div id="list"></div>
</div>

<script>
/* знаки: функция получает размер и фон, возвращает SVG */
var MARKS = {
  A: {name:'А · Лента', note:'Плавная «У», как у настоящего логотипа. Правый штрих переходит малахит → сапфир → аметист, левый — яшма.',
    svg:function(onDark){return '<g transform="translate(2.3 0)"><use href="#u-right" fill="url(#gem)"></use><use href="#u-left" fill="url(#jasper)"></use></g>';}},
  B: {name:'Б · Огранённый камень', note:'«У» вырезана в малахите огранки «изумруд». Похоже на значок, хорошо смотрится маленьким.',
    svg:function(onDark){return '<polygon points="13,2 35,2 46,13 46,35 35,46 13,46 2,35 2,13" fill="url(#stone)"></polygon>'+
      '<polygon points="16,8 32,8 40,16 40,32 32,40 16,40 8,32 8,16" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1"></polygon>'+
      '<path d="M13 2 L16 8 M35 2 L32 8 M46 13 L40 16 M46 35 L40 32 M35 46 L32 40 M13 46 L16 40 M2 35 L8 32 M2 13 L8 16" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1"></path>'+
      '<g transform="translate(11 9) scale(.62)" fill="#FFFFFF"><use href="#u-right"></use><use href="#u-left"></use></g>';}},
  C: {name:'В · Кристалл', note:'Шестигранный кристалл (сапфир → аметист) с белой «У» внутри. Отсылка к уральским минералам.',
    svg:function(onDark){return '<polygon points="24,1 44,12.5 44,35.5 24,47 4,35.5 4,12.5" fill="url(#crys)"></polygon>'+
      '<path d="M24 1 L24 47 M4 12.5 L44 35.5 M44 12.5 L4 35.5" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1"></path>'+
      '<g transform="translate(12 10.5) scale(.58)" fill="#FFFFFF"><use href="#u-right"></use><use href="#u-left"></use></g>';}},
  D: {name:'Г · Строгий', note:'Та же плавная «У» одним фирменным синим. Самый сдержанный вариант; на тёмном фоне — белая.',
    svg:function(onDark){var c=onDark?'#FFFFFF':'#1D4E9E';return '<g transform="translate(2.3 0)"><use href="#u-right" fill="'+c+'"></use><use href="#u-left" fill="'+c+'"></use></g>';}}
};
function mark(k,size,onDark){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 48 48" role="img" aria-label="Знак УрФУ, вариант '+MARKS[k].name+'">'+MARKS[k].svg(onDark)+'</svg>';}
var html='';
Object.keys(MARKS).forEach(function(k){
  var m=MARKS[k];
  html+='<section class="opt"><div class="opt-h"><b>'+m.name+'</b><span>'+m.note+'</span></div><div class="row">'+
    '<div class="tile light">'+mark(k,160,false)+'</div>'+
    '<div class="tile dark">'+mark(k,160,true)+'</div>'+
    '<div class="tile hdr">'+
      '<div class="bar">'+mark(k,40,false)+'<span class="t">УрФУ<small>Уральский федеральный</small></span></div>'+
      '<div class="bar d">'+mark(k,40,true)+'<span class="t">УрФУ<small>Уральский федеральный</small></span></div>'+
      '<div class="fav">'+mark(k,16,false)+mark(k,24,false)+'<span>— так знак выглядит совсем маленьким (значок вкладки)</span></div>'+
    '</div></div></section>';
});
document.getElementById('list').innerHTML=html;
</script>
</body>
</html>
