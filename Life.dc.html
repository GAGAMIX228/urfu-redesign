<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const c = (this.state && this.state.c) || 'Все';
const cats = ['Все','Спорт','Творчество','Наука и IT','Волонтёрство','Медиа'];
const bg = {'Спорт':'#E8EEF7','Творчество':'#EEF1F4','Наука и IT':'#E4EAF2','Волонтёрство':'#EEF1F4','Медиа':'#EEF1F4'};
const all = [
{t:'Секция волейбола', cat:'Спорт', d:'Тренировки для новичков и сборной'},
{t:'Секция плавания', cat:'Спорт', d:'Бассейн спорткомплекса, разные уровни'},
{t:'Студенческий театр', cat:'Творчество', d:'Постановки, сценическая речь, фестивали'},
{t:'Вокальная студия', cat:'Творчество', d:'Хор и сольный вокал'},
{t:'Клуб программирования', cat:'Наука и IT', d:'Олимпиады, хакатоны, командные проекты'},
{t:'Клуб робототехники', cat:'Наука и IT', d:'Собираем роботов и участвуем в соревнованиях'},
{t:'Волонтёрский центр', cat:'Волонтёрство', d:'Социальные и городские проекты'},
{t:'Студенческий медиацентр', cat:'Медиа', d:'Фото, видео, тексты и соцсети'}
];
const clubs = all.filter(x => c === 'Все' || x.cat === c).map(x => ({ ...x, bg: bg[x.cat] }));
return { cats: cats.map(l => ({ label: l, on: l === c, off: l !== c, pick: () => this.setState({ c: l }) })), clubs };
}
}

</script>
