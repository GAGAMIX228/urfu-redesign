<div class="q"><span class="n num">03</span><span class="t">Один сайт и один поиск</span><span class="d">Приём, каталог и институты — разделы одного сайта с общим шаблоном и общим поиском.</span></div>

<p class="muted" style="max-width:760px;font-size:18px">Урал известен камнями — малахитом, аметистом, сапфиром и яшмой. Их цвета стали акцентами сайта: институты, разделы и рубрики различаются «камнями», а основа остаётся строгой — фирменный синий, глубокий тёмно-синий и медь для дат. Знак сохраняет форму фирменной «У» УрФУ, но переливается цветами самоцветов.</p>
