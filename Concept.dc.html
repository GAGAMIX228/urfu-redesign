<section class="wrap sec" id="audit">
<div class="sec-head"><div><div class="kicker" style="--k:var(--a1)">Исследование</div><h2>Что мешает на urfu.ru сейчас</h2></div></div>
<p class="muted" style="max-width:780px;margin-top:8px;font-size:17px">Мы разобрали главную страницу urfu.ru по её копии в веб-архиве от 12 октября 2026 года и прошли по ней частые задачи. Все цифры ниже посчитаны по коду страницы, а не на глаз.</p>
<div class="au-grid">
<div class="au"><b>419</b><span>ссылок на главной</span><small>206 из них спрятаны в выпадающих меню. В одном меню «Абитуриентам» — 67 ссылок.</small></div>
<div class="au"><b>22</b><span>пункта меню в двух рядах</span><small>«Все разделы» (8 — для кого) и «Меню» (14 — по устройству университета).</small></div>
<div class="au"><b>40</b><span>других сайтов УрФУ в ссылках</span><small>115 ссылок с главной уводят на поддомены и внешние сайты — у каждого своё меню.</small></div>
<div class="au"><b>0</b><span>раз слово «общежитие» на главной</span><small>Есть только «Поселение». Адресов общежитий нет и на самой странице «Поселение».</small></div>
<div class="au"><b>×5</b><span>одна и та же ссылка</span><small>«Списки поступающих», «Списки зачисленных» и «Спорт» — по 5 раз, «Контакты приёмной комиссии» — 4 раза.</small></div>
<div class="au"><b>1</b><span>пустой раздел</span><small>В меню «Партнерам»: «Раздел находится в стадии заполнения контентом. Приносим извинения…»</small></div>
</div>
<p class="muted" style="margin-top:16px;font-size:14px">Источник: <a href="https://web.archive.org/web/20261012070238/https://urfu.ru/ru/" target="_blank" rel="noopener">копия urfu.ru/ru от 12.10.2026 в веб-архиве<span class="sr"> (откроется в новой вкладке)</span></a>. Внутренние страницы — из того же архива.</p>
</section>

<section class="wrap sec" id="structure">
<div class="sec-head"><div><div class="kicker" style="--k:var(--a4)">Структура и навигация</div><h2>Было → стало</h2></div></div>
<p class="muted" style="max-width:760px;margin-top:8px;font-size:17px">Сейчас на главной urfu.ru 22 пункта меню в двух рядах и 4 разных личных кабинета — меню повторяет устройство университета. Мы собрали сайт вокруг задач человека: 6 разделов, 5 ролей на главной и один вход в личный кабинет.</p>
<div class="st-grid">
<div class="st-old"><div class="st-h"><span class="st-num">22</span><span>пункта меню сейчас<br><small>urfu.ru, главная страница</small></span></div>
<div class="st-lbl">Ряд «для кого» — 8</div><div class="st-chips"><span class="st-chip">Студентам</span><span class="st-chip">Абитуриентам</span><span class="st-chip">Школьникам</span><span class="st-chip">Сотрудникам</span><span class="st-chip">Выпускникам</span><span class="st-chip">Партнерам</span><span class="st-chip">Работодателям</span><span class="st-chip">СМИ</span></div>

<section class="wrap sec" id="paths">

<p class="muted" style="max-width:780px;margin-top:8px;font-size:17px">Восемь частых задач. Считаем действия от главной до ответа: открыть меню, нажать ссылку, скачать файл. Где мы не лучше — так и пишем.</p>

<tbody>

<tr><th scope="row">Когда подавать документы</th><td><span class="n bad">2</span>Меню «Абитуриентам» → «Календарь приема» → таблица</td><td><span class="n good">0</span>На главной: «Приём документов — с 20 июня» и отсчёт дней</td></tr>

<p class="muted" style="margin-top:12px;font-size:14px">Цифра — сколько действий нужно от главной страницы, 0 — ответ виден на главной сразу. Пути на urfu.ru пройдены по копиям страниц в веб-архиве: главная — 12.10.2026, внутренние — 2025–2026.</p>

binet.dc.html"><b>Кабинет студента</b><span class="muted">Пары, баллы по шкале УрФУ, стипендия по суммам 2026 года, пропуск и чек-лист первокурсника — демо.</span></a><a class="card cf" href="Admission.dc.html#ach"><b>Баллы за достижения</b><span class="muted">Отметьте аттестат, ГТО, олимпиады — посчитаем плюс к ЕГЭ по правилам приёма, не больше 10.</span></a><a class="card cf" href="Institute.dc.html#im-ex-h"><b>Куда с моими ЕГЭ</b><span class="muted">Выберите предметы — покажем институты и программы, куда они подходят.</span></a><a class="card cf" href="News.dc.html"><b>Новости</b><span class="muted">Лента по месяцам с источниками, поиск, афиша, подписка.</span></a><a class="card cf" href="Search.dc.html"><b>Поиск</b><span class="muted">По всему сайту, понимает «общага» и «стипуха», прощает опечатки; открывается по Ctrl+K.</span></a><a class="card cf" href="Main.dc.html"><b>Для слабовидящих</b><span class="muted">Размер текста, 5 цветовых схем, изображения, интервал — на любой странице.</span></a><a class="card cf" href="MainEn.dc.html"><b>English</b><span class="muted">Главная, каталог, поступление и вход — на английском.</span></a></div>

<!-- next --><section class="wrap sec" id="next">
<div class="sec-head"><div><h2>Что дальше — после конкурса</h2></div></div>
<p class="muted" style="margin-top:12px;max-width:760px;font-size:18px">Прототип показывает, как должен работать сайт. Чтобы он стал настоящим, его нужно подключить к системам университета. Вот что для этого нужно — честно, без обещаний за других.</p>
<ol class="nx">
<li><b>Расписание</b><span>Подключить к той же базе, что у приложения «УрФУ.Учеба», — вместо примера появятся настоящие пары группы.</span></li>
