<div class="q"><span class="t">Меню по задачам</span><span class="d">Шесть разделов вместо оргструктуры: Поступление, Обучение, Наука, Жизнь, Партнёрам, Об университете.</span></div>

<section class="wrap sec" id="audit">
<div class="sec-head"><div><div class="kicker" style="--k:var(--a1)">Исследование</div><h2>Что мешает на urfu.ru сейчас</h2></div></div>
<p class="muted" style="max-width:780px;margin-top:8px;font-size:17px">Мы разобрали главную страницу urfu.ru по её копии в веб-архиве от 12 октября 2026 года и прошли по ней частые задачи. Все цифры ниже посчитаны по коду страницы, а не на глаз.</p>
<div class="au-grid">
<div class="au"><b>419</b><span>ссылок на главной</span><small>206 из них спрятаны в выпадающих меню. В одном меню «Абитуриентам» — 67 ссылок.</small></div>
<div class="au"><b>22</b><span>пункта меню в двух рядах</span><small>«Все разделы» (8 — для кого) и «Меню» (14 — по устройству университета).</small></div>
<div class="au"><b>40</b><span>других сайтов УрФУ в ссылках</span><small>115 ссылок с главной уводят на поддомены и внешние сайты — у каждого своё меню.</small></div>
<div class="au"><b>0</b><span>раз слово «общежитие» на главной</span><small>Есть только «Поселение». Адресов общежитий нет и на самой странице «Поселение».</small></div>
<div class="au"><b>×5</b><span>одна и та же ссылка</span><small>«Списки поступающих», «Списки зачисленных» и «Спорт» — по 5 раз, «Контакты приёмной комиссии» — 4 раза.</small></div>
<div class="au"><b>1</b><span>пустой раздел</span><small>В меню «Партнерам»: «Раздел находится в стадии заполнения контентом. Приносим извинения…»</small></div>
</div>
<p class="muted" style="margin-top:16px;font-size:14px">Источник: <a href="https://web.archive.org/web/20261012070238/https://urfu.ru/ru/" target="_blank" rel="noopener">копия urfu.ru/ru от 12.10.2026 в веб-архиве<span class="sr"> (откроется в новой вкладке)</span></a>. Внутренние страницы — из того же архива.</p>
</section>

<section class="wrap sec" id="structure">
<div class="sec-head"><div><div class="kicker" style="--k:var(--a4)">Структура и навигация</div><h2>Было → стало</h2></div></div>
<p class="muted" style="max-width:760px;margin-top:8px;font-size:17px">Сейчас на главной urfu.ru 22 пункта меню в двух рядах и 4 разных личных кабинета — меню повторяет устройство университета. Мы собрали сайт вокруг задач человека: 6 разделов, 4 роли на главной и один вход в личный кабинет.</p>
<div class="st-grid">
<div class="st-old"><div class="st-h"><span class="st-num">22</span><span>пункта меню сейчас<br><small>urfu.ru, главная страница</small></span></div>
<div class="st-lbl">Ряд «для кого» — 8</div><div class="st-chips"><span class="st-chip">Студентам</span><span class="st-chip">Абитуриентам</span><span class="st-chip">Школьникам</span><span class="st-chip">Сотрудникам</span><span class="st-chip">Выпускникам</span><span class="st-chip">Партнерам</span><span class="st-chip">Работодателям</span><span class="st-chip">СМИ</span></div>
<div class="st-lbl">Главное меню — 14</div><div class="st-chips"><span class="st-chip">Об университете</span><span class="st-chip">Новый кампус</span><span class="st-chip">Наука</span><span class="st-chip">Образование</span><span class="st-chip">Международная деятельность</span><span class="st-chip">Инновации</span><span class="st-chip">Эндаумент</span><span class="st-chip">Творчество</span><span class="st-chip">Спорт</span><span class="st-chip">Устойчивое развитие</span><span class="st-chip">Институты</span><span class="st-chip">Филиалы</span><span class="st-chip">Контакты</span><span class="st-chip">Обратная связь</span></div>
<div class="st-lbl">Личный кабинет — 4 входа</div><div class="st-chips"><span class="st-chip">Студенту</span><span class="st-chip">Сотруднику</span><span class="st-chip">Партнеру</span><span class="st-chip">Участнику ВЭД</span></div>
</div>
<div class="st-arrow" aria-hidden="true">→</div>
<div class="st-newcol"><div class="st-h"><span class="st-num" style="color:var(--a1)">6</span><span>разделов в новом меню<br><small>+ 4 роли на главной, 1 личный кабинет, поиск</small></span></div>
<div class="st-cards"><a class="st-new" href="Admission.dc.html" style="--c:var(--a1)"><b>Поступление</b><ul><li>Как поступить</li><li>Подбор программы за 3 вопроса</li><li>Каталог и проходные баллы</li><li>Общежития</li></ul></a><a class="st-new" href="Schedule.dc.html" style="--c:var(--a2)"><b>Обучение</b><ul><li>Расписание</li><li>Личный кабинет</li><li>Институты и кафедры</li></ul></a><a class="st-new" href="Science.dc.html" style="--c:var(--a3)"><b>Наука</b><ul><li>54 проекта «Приоритет-2030»</li><li>Научные школы</li><li>Студенту и бизнесу</li></ul></a><a class="st-new" href="Life.dc.html" style="--c:var(--a4)"><b>Жизнь в УрФУ</b><ul><li>Клубы и спорт</li><li>Творчество</li><li>Календарь событий</li></ul></a><a class="st-new" href="Contacts.dc.html" style="--c:var(--a1)"><b>Партнёрам</b><ul><li>Сотрудничество и реклама</li><li>Работодателям</li><li>Контакты служб</li></ul></a><a class="st-new" href="Institute.dc.html" style="--c:var(--a2)"><b>Об университете</b><ul><li>Новости</li><li>Новый кампус, эндаумент</li><li>Устойчивое развитие</li><li>Филиалы</li></ul></a></div></div>
</div>
<div class="st-changes">
<div><h3>Убрали из главного меню</h3><p>Эндаумент, Инновации, Устойчивое развитие, Новый кампус, Филиалы — важны, но нужны немногим. Теперь они внутри «Об университете», в одном клике.</p></div>
<div><h3>Объединили</h3><p>8 вкладок «для кого» → 4 роли на первом экране главной. Творчество и Спорт → «Жизнь в УрФУ». Образование и Институты → «Обучение». Контакты и Обратная связь → один раздел с поиском службы. 4 личных кабинета → один вход.</p></div>
<div><h3>Добавили</h3><p>Подбор программы за 3 вопроса, расписание в один клик с поиском группы, цены общежитий таблицей, центр помощи с поиском, страницу науки, календарь событий, общежития отдельным разделом, умный поиск с подсказками, отсчёт до приёма документов, английскую версию.</p></div>
</div>
</section>
<section class="wrap sec" id="paths">
<div class="sec-head"><div><div class="kicker" style="--k:var(--a3)">Удобство</div><h2>Путь до ответа</h2></div></div>
<p class="muted" style="max-width:780px;margin-top:8px;font-size:17px">Восемь частых задач. Считаем действия от главной до ответа: открыть меню, нажать ссылку, скачать файл. Где мы не лучше — так и пишем.</p>
<div class="pt-wrap" role="region" aria-label="Путь до ответа: urfu.ru и новый сайт" tabindex="0"><table class="pt">
<thead><tr><th scope="col">Задача</th><th scope="col">urfu.ru сейчас</th><th scope="col">Новый сайт</th></tr></thead>
<tbody>
<tr><th scope="row">Хватит ли моих баллов на бюджет</th><td><span class="n bad">2</span>Меню «Абитуриентам» → «Калькулятор ЕГЭ» — открывается отдельный сайт calcege.my1.urfu.ru</td><td><span class="n good">0</span>Ползунок баллов прямо на главной: сразу видно, на сколько программ проходишь и сколько там бюджетных мест</td></tr>
<tr><th scope="row">Когда подавать документы</th><td><span class="n bad">2</span>Меню «Абитуриентам» → «Календарь приема» → таблица</td><td><span class="n good">0</span>На главной: «Приём документов — с 20 июня» и отсчёт дней</td></tr>
<tr><th scope="row">Сколько стоит обучение</th><td><span class="n bad">3</span>Меню → «Стоимость обучения» → скачать приказ PDF на 16 МБ и найти в нём свою программу</td><td><span class="n good">1</span>«Каталог» — цена за год в карточке каждой программы</td></tr>
<tr><th scope="row">Адрес общежития</th><td><span class="n bad">—</span>Меню «Студентам» → «Поселение»: порядок заселения и группы ВК, а адресов нет. Они только на отдельном сайте кампуса</td><td><span class="n good">1</span>«Общежития» на первом экране главной → карта и список с адресами</td></tr>
<tr><th scope="row">Сколько стоит общежитие</th><td><span class="n bad">4</span>Меню → «Поселение» → «Плата за проживание» → скан приказа в PDF, 3 МБ, и таблица тарифов по строкам</td><td><span class="n good">1</span>«Общежития» → таблица: сколько в месяц, вдвоём в комнате</td></tr>
<tr><th scope="row">Расписание своей группы</th><td><span class="n bad">2</span>Меню «Студентам» → «Расписание занятий» → ввести группу. Личное расписание — только в кабинете, нужен вход</td><td><span class="n good">1</span>«Расписание» на первом экране → номер группы. Сайт запоминает группу — в следующий раз сразу пары</td></tr>
<tr><th scope="row">Телефон приёмной комиссии</th><td><span class="n">1</span>Значок телефона в шапке → список служб</td><td><span class="n">0</span>Внизу главной, рядом с контакт-центром</td></tr>
<tr><th scope="row">Версия для слабовидящих</th><td><span class="n">1</span>Значок в шапке → отдельная версия сайта</td><td><span class="n">1</span>Значок «глаз» → панель поверх любой страницы: размер, цвета, картинки, интервал</td></tr>
</tbody></table></div>
<p class="muted" style="margin-top:12px;font-size:14px">Цифра — сколько действий нужно от главной страницы, 0 — ответ виден на главной сразу. Пути на urfu.ru пройдены по копиям страниц в веб-архиве: главная — 12.10.2026, внутренние — 2025–2026.</p>
