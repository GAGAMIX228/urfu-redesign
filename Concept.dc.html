<h1 class="rv rv2">Один УрФУ&nbsp;—<br><em>один вход</em></h1>
<p class="hero-lead rv rv3">Сайт, построенный вокруг задач людей, а не вокруг устройства университета. В фирменных цветах уральских самоцветов.</p>
<div class="rv rv4" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:32px"><a class="btn" href="Main.dc.html" style="background:#FFFFFF;color:var(--ink)">Открыть сайт <span class="arrow">→</span></a></div>

<div class="qgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
<div class="q"><span class="t">Меню по задачам</span><span class="d">Шесть разделов вместо оргструктуры: Поступление, Обучение, Наука, Жизнь, Партнёрам, Об университете.</span></div>
<div class="q"><span class="t">Роли на первом экране</span><span class="d">«Я поступаю», «Я учусь», «Я работаю», «International» — у каждого свои главные дела сразу на главной.</span></div>
<div class="q"><span class="t">Один сайт и один поиск</span><span class="d">Приём, каталог и институты — разделы одного сайта с общим шаблоном и общим поиском.</span></div>
<div class="q"><span class="t">Телефон и доступность</span><span class="d">Мобильное меню и нижняя панель на телефоне, контраст WCAG AA, работа с клавиатуры, версия для слабовидящих.</span></div>
</div>

<section class="wrap sec" id="structure">
<div class="sec-head"><div><div class="kicker" style="--k:var(--a4)">Структура и навигация</div><h2>Было → стало</h2></div></div>
<p class="muted" style="max-width:760px;margin-top:8px;font-size:17px">Сейчас на главной urfu.ru 22 пункта меню в двух рядах и 4 разных личных кабинета — меню повторяет устройство университета. Мы собрали сайт вокруг задач человека: 6 разделов, 4 роли на главной и один вход в личный кабинет.</p>
<div class="st-grid">
<div class="st-old"><div class="st-h"><span class="st-num">22</span><span>пункта меню сейчас<br><small>urfu.ru, главная страница</small></span></div>
<div class="st-lbl">Ряд «для кого» — 8</div><div class="st-chips"><span class="st-chip">Студентам</span><span class="st-chip">Абитуриентам</span><span class="st-chip">Школьникам</span><span class="st-chip">Сотрудникам</span><span class="st-chip">Выпускникам</span><span class="st-chip">Партнерам</span><span class="st-chip">Работодателям</span><span class="st-chip">СМИ</span></div>
<div class="st-lbl">Главное меню — 14</div><div class="st-chips"><span class="st-chip">Об университете</span><span class="st-chip">Новый кампус</span><span class="st-chip">Наука</span><span class="st-chip">Образование</span><span class="st-chip">Международная деятельность</span><span class="st-chip">Инновации</span><span class="st-chip">Эндаумент</span><span class="st-chip">Творчество</span><span class="st-chip">Спорт</span><span class="st-chip">Устойчивое развитие</span><span class="st-chip">Институты</span><span class="st-chip">Филиалы</span><span class="st-chip">Контакты</span><span class="st-chip">Обратная связь</span></div>
<div class="st-lbl">Личный кабинет — 4 входа</div><div class="st-chips"><span class="st-chip">Студенту</span><span class="st-chip">Сотруднику</span><span class="st-chip">Партнеру</span><span class="st-chip">Участнику ВЭД</span></div>
</div>
<div class="st-arrow" aria-hidden="true">→</div>
<div class="st-newcol"><div class="st-h"><span class="st-num" style="color:var(--a1)">6</span><span>разделов в новом меню<br><small>+ 4 роли на главной, 1 личный кабинет, поиск</small></span></div>
<div class="st-cards"><a class="st-new" href="Admission.dc.html" style="--c:var(--a1)"><b>Поступление</b><ul><li>Как поступить</li><li>Подбор программы за 3 вопроса</li><li>Каталог и проходные баллы</li><li>Общежития</li></ul></a><a class="st-new" href="Schedule.dc.html" style="--c:var(--a2)"><b>Обучение</b><ul><li>Расписание</li><li>Личный кабинет</li><li>Институты и кафедры</li><li>Преподаватели</li></ul></a><a class="st-new" href="Article.dc.html" style="--c:var(--a3)"><b>Наука</b><ul><li>Новости науки</li><li>Лаборатории</li><li>Конференции</li></ul></a><a class="st-new" href="Life.dc.html" style="--c:var(--a4)"><b>Жизнь в УрФУ</b><ul><li>Клубы и спорт</li><li>Творчество</li><li>Календарь событий</li></ul></a><a class="st-new" href="Contacts.dc.html" style="--c:var(--a1)"><b>Партнёрам</b><ul><li>Сотрудничество и реклама</li><li>Работодателям</li><li>Контакты служб</li></ul></a><a class="st-new" href="Institute.dc.html" style="--c:var(--a2)"><b>Об университете</b><ul><li>Новости</li><li>Новый кампус, эндаумент</li><li>Устойчивое развитие</li><li>Филиалы</li></ul></a></div></div>
</div>
<div class="st-changes">
<div><h3>Убрали из главного меню</h3><p>Эндаумент, Инновации, Устойчивое развитие, Новый кампус, Филиалы — важны, но нужны немногим. Теперь они внутри «Об университете», в одном клике.</p></div>
<div><h3>Объединили</h3><p>8 вкладок «для кого» → 4 роли на первом экране главной. Творчество и Спорт → «Жизнь в УрФУ». Образование и Институты → «Обучение». Контакты и Обратная связь → один раздел с поиском службы. 4 личных кабинета → один вход.</p></div>
<div><h3>Добавили</h3><p>Подбор программы за 3 вопроса, расписание в один клик, календарь событий, общежития отдельным разделом, умный поиск с подсказками, отсчёт до приёма документов, английскую версию.</p></div>
</div>

<p class="muted" style="max-width:760px;font-size:18px">Урал известен камнями — малахитом, аметистом, сапфиром и яшмой. Их цвета стали цветами четырёх ролей, а срезанный угол, как грань огранённого камня, — единственным фирменным приёмом: у плиток ролей, шапок страниц и фото. Заголовки набраны узким PT Sans Narrow — как надписи на фасадах уральского конструктивизма.</p>
<div class="g4" style="margin-top:28px">
<div class="card" style="padding:0;overflow:hidden"><div style="height:96px;background:var(--a1)"></div><div style="padding:16px 18px"><b>Малахит</b><div class="muted" style="font-size:14px">#0B7A63 · акцент</div></div></div>

<div class="card" style="padding:0;overflow:hidden"><div style="height:96px;background:var(--a3)"></div><div style="padding:16px 18px"><b>Сапфир</b><div class="muted" style="font-size:14px">#1D4E9E · основной цвет</div></div></div>
<div class="card" style="padding:0;overflow:hidden"><div style="height:96px;background:var(--a4)"></div><div style="padding:16px 18px"><b>Яшма</b><div class="muted" style="font-size:14px">#A63A3A · акцент</div></div></div>

<h3 style="font-size:24px">Все страницы связаны</h3>
<p class="muted" style="margin-top:12px">Начните с главной: выберите роль, попробуйте поиск, откройте каталог программ и сравните программы. Список всех 19 экранов — на стартовой странице.</p>
