const progRes = ALL_PROGS.map(p => ({kind:'Программы', t:p.name, d:'Бакалавриат · ' + p.inst + ' · ЕГЭ: ' + p.exams, href:'Program.dc.html', h: hit(p.name) * 2}));
const otherRes = other.map(o => ({kind:o.kind, t:o.t, d:o.d, href:o.href, h: hit(o.t + ' ' + o.key)}));
const all = progRes.concat(otherRes).filter(r => st.length ? r.h > 0 : true).sort((a, b) => b.h - a.h);
const res = all.filter(r => tab === 'Все' || r.kind === tab);
const tabs = ['Все','Программы','Люди','Новости','События','Документы'];
const cnt = k => all.filter(r => k === 'Все' || r.kind === k).length;
return {
tabs: tabs.map(l => ({ label: l + ' · ' + cnt(l), on: l === tab, off: l !== tab, pick: () => this.setState({ tab: l }) })),
res, q, empty: res.length === 0,
onQ: (e) => this.setState({ q: e.target.value, tab: 'Все' })
};
}
}
</script>
