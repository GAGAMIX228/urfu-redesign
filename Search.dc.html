const st = window.SmartSearch ? SmartSearch.terms(q, CORPUS) : stems(q);
const nrm = t => window.SmartSearch ? SmartSearch.norm(t) : t.toLowerCase();
const hit = t => st.filter(x => nrm(t).includes(x)).length;
const IL = {'ИРИТ-РтФ':['Радиоэлектроника и IT','Институт радиоэлектроники и информационных технологий — РтФ'],'ИЕНиМ':['Естественные науки и математика','Институт естественных наук и математики'],'ИНМиТ':['Новые материалы и технологии','Институт новых материалов и технологий'],'УралЭНИН':['Энергетика','Уральский энергетический институт'],'ИСА':['Строительство и архитектура','Институт строительства и архитектуры'],'УГИ':['Гуманитарные науки','Уральский гуманитарный институт'],'ИнЭУ':['Экономика и управление','Институт экономики и управления'],'ФТИ':['Физика и технологии','Физико-технологический институт']};

const otherRes = other.map(o => ({kind:o.kind, t:o.t, d:o.d, href:o.href, h: hit(o.t + ' ' + o.key)}));
const all = progRes.concat(otherRes).filter(r => st.length ? r.h > 0 : true).sort((a, b) => b.h - a.h);
const res = all.filter(r => tab === 'Все' || r.kind === tab);
const tabs = ['Все','Разделы','Программы','Новости','События','Документы'];
const cnt = k => all.filter(r => k === 'Все' || r.kind === k).length;
return {
tabs: tabs.map(l => ({ label: l + ' · ' + cnt(l), on: l === tab, off: l !== tab, pick: () => this.setState({ tab: l }) })),
res, q, empty: res.length === 0,
onQ: (e) => this.setState({ q: e.target.value, tab: 'Все' })
};
